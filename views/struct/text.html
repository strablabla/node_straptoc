
<!DOCTYPE html>
<html>

<meta charset="UTF-8">

<script src="lib/keymaster.js"></script>

{% include 'page_struct/header.html' %}

<script  src="/edit_textarea.js"></script>
<script  src="/code_mirror_addons.js"></script>
<link rel="stylesheet" href="codemirror.css">
<script src="codemirror.js"></script>
<link rel="stylesheet" href="highlight.css">

{% include 'struct/textarea.html' %}

 <script src="/socket.io/socket.io.js"></script>

 <script>

    var socket = io.connect();  //'http://localhost:3000'

    // Initialize global variables (will be populated by socket.io)
    var dchandir = {};
    var list_pages = [];
    var list_md = [];
    var dic_text_id = {};

    // Store sessionStorage values globally so they can be used after pages_data arrives
    var stored_patt = null;
    var stored_patt_prev = null;
    var stored_patt_next = null;
    var stored_scroll_html_pos = null;
    var stored_curr_txt = null;
    var pages_data_received = false;
    var globals_updated_received = false;

    // Wait for socket to be fully connected before sending events
    socket.on('connect', function() {
        console.log('[text.html] Socket fully connected, checking sessionStorage...');

        // Retrieve values from sessionStorage (set by dbl_click_move_to_text.js)
        stored_patt = sessionStorage.getItem('text_mode_patt');
        stored_patt_prev = sessionStorage.getItem('text_mode_patt_prev');
        stored_patt_next = sessionStorage.getItem('text_mode_patt_next');
        stored_scroll_html_pos = sessionStorage.getItem('text_mode_scroll_html_pos');
        stored_curr_txt = sessionStorage.getItem('text_mode_curr_txt');

        console.log('[text.html] sessionStorage values:', {
            text_mode_patt: stored_patt,
            text_mode_patt_prev: stored_patt_prev,
            text_mode_patt_next: stored_patt_next,
            text_mode_scroll_html_pos: stored_scroll_html_pos,
            text_mode_curr_txt: stored_curr_txt
        });

        // Send curr_txt first to update server globals
        if (stored_curr_txt) {
            console.log('[text.html] Emitting curr_txt:', stored_curr_txt);
            socket.emit('curr_txt', stored_curr_txt);
        }

        if (stored_patt) {
            console.log('[text.html] Emitting scroll pattern with context');
            // Create a JSON object with pattern and context
            // Handle empty strings and 'null' string properly
            var prev = (stored_patt_prev && stored_patt_prev !== '' && stored_patt_prev !== 'null') ? stored_patt_prev : null;
            var next = (stored_patt_next && stored_patt_next !== '' && stored_patt_next !== 'null') ? stored_patt_next : null;

            var pattern_data = JSON.stringify({
                pattern: stored_patt,
                pattern_prev: prev,
                pattern_next: next
            });
            console.log('[text.html] Pattern data being sent:', pattern_data);
            socket.emit('scroll', pattern_data);
        }
        if (stored_scroll_html_pos) {
            console.log('[text.html] Emitting scroll_html position:', stored_scroll_html_pos);
            socket.emit('scroll_html', parseInt(stored_scroll_html_pos));
        }

        // Request pages data from server
        socket.emit('ask_pages_data');
    });

    // Wait for BOTH pages_data AND globals_updated before sending join
    function checkReadyToJoin() {
        console.log('[text.html] checkReadyToJoin called', {
            pages_data_received: pages_data_received,
            globals_updated_received: globals_updated_received,
            has_stored_curr_txt: !!stored_curr_txt
        });

        // If we have stored_curr_txt, wait for both pages_data and globals_updated
        // If no stored_curr_txt, only wait for pages_data
        var ready = pages_data_received && (!stored_curr_txt || globals_updated_received);

        if (ready) {
            console.log('[text.html] Ready to join! Emitting join event');
            socket.emit('join', 'This is a message from client textarea !!' );

            // Clear sessionStorage after use
            sessionStorage.removeItem('text_mode_patt');
            sessionStorage.removeItem('text_mode_patt_prev');
            sessionStorage.removeItem('text_mode_patt_next');
            sessionStorage.removeItem('text_mode_scroll_html_pos');
            sessionStorage.removeItem('text_mode_curr_txt');
            console.log('[text.html] sessionStorage cleared');
        }
    }

    socket.on('globals_updated', function() {
        console.log('[text.html] Server confirmed globals updated');
        globals_updated_received = true;
        checkReadyToJoin();
    });

    // Receive pages data from server
    socket.on('pages_data', function(data) {
        console.log('[text.html] Received pages_data:', data);
        try {
            var pagesData = JSON.parse(data);
            dchandir = pagesData.dchandir;
            list_pages = pagesData.list_pages;
            list_md = pagesData.list_md;
            dic_text_id = pagesData.dic_text_id;
            console.log('[text.html] Pages data loaded successfully');
            console.log('[text.html] dchandir is now:', dchandir);

            // NOW create the channel listeners AFTER dchandir is populated
            console.log('[text.html] Creating channel listeners for:', Object.keys(dchandir));
            Object.entries(dchandir).forEach(([elem,k]) => {
                console.log('[text.html] Setting up listener for channel:', elem, '→', k);
                socket.on(elem, function(message) {
                    console.log('[text.html] Received message on channel', elem, 'length:', message.length);
                    $('#comment').val(message);
                    if (comment){ alert('received message  !! ') }
                    new_loc = k
                    name_origin_page(new_loc)
                })
            });
            console.log('[text.html] All channel listeners created');

            // Mark that pages_data has been received
            pages_data_received = true;

            // Check if we're ready to join (need both pages_data and globals_updated if curr_txt was sent)
            checkReadyToJoin();
        } catch(e) {
            console.error('[text.html] Error parsing pages_data:', e);
        }
    });
    var comment = false;
    var scroll_html_pos = 0
    var pattern = ''
    var new_loc = ''
    var editor;
    var line_number = 0;

    function name_origin_page(curr_page){

          /*

          name of the page

          */

          var name_page = $('<h4/>').text('Text of page : ' + curr_page)
          name_page.attr('id','name_page')
                     .css({
                          'position':'absolute',
                          'top':'10px',
                          'left':'10px',
                          //'width':'24px',
                          'z-index':'10'
                        })

          $('body').append(name_page)
    }

    //------------- Scroll position

    socket.on('scroll', function(code) {
            console.log('[text.html] Received scroll event, raw code:', code);
            console.log('[text.html] Type of code:', typeof code);

            var json_line_patt = JSON.parse(code);
            line_number = json_line_patt['line']
            var patt = json_line_patt['pattern']

            console.log('[text.html] Parsed JSON:', json_line_patt);
            console.log('[text.html] line_number:', line_number);
            console.log('[text.html] pattern:', patt);

            if (comment){ alert('line_number is : ' + line_number) }

            //-------------------------- CodeMirror

            editor = CodeMirror.fromTextArea(document.getElementById("comment"), {
                  lineNumbers: true,
                  mode: 'markdown'
            });

            console.log('[text.html] CodeMirror editor initialized');

            code_mirror_add_func(editor, socket) // set CodeMirror width etc..

             //------------- from textarea to html

             $('#submit').click(function(){               // submit new text.. from text to html
                   var new_text = editor.getValue()
                   console.log('[text.html] Submitting new text, length:', new_text.length);
                   socket.emit('return', new_text);
                 }) // end click
      })

    socket.on('scroll_html', function(pos) {              // save html position of scroll
            console.log('[text.html] Received scroll_html event, position:', pos);
            scroll_html_pos = pos
            console.log('[text.html] scroll_html_pos set to:', scroll_html_pos);
            if (comment){ alert(' scroll_html pos = ' + pos) }
      })

    //------------- from html to textarea
    // NOTE: Channel listeners are now created in pages_data handler (after dchandir is populated)

    //-------------  pattern

    socket.on('pattern', function(patt) {              // pattern to be found in the md text..
          console.log('[text.html] Received pattern event:', patt);
          pattern = patt
          console.log('[text.html] pattern variable set to:', pattern);
      })

    $('#go_back').click(function(){                     // submit new text.. from text to html
          socket.emit('scroll_html', scroll_html_pos);
        }) // end click

    $('.form-group').bind('contextmenu', function(e){   // when clicking right go back to html
          e.preventDefault();
          document.getElementById('submit').click();
          return false;
          });

    socket.on('page_return_to_html', function(name){
        console.log('[text.html] Received page_return_to_html event, name:', name);
        console.log('[text.html] Navigating to:', new_loc);
        // alert(name)
        // alert(new_loc)
        window.location.href = new_loc;   // return to html..
    })

    document.addEventListener('keydown', function(event) {  // alt + s for saving the text..
      //if (event.ctrlKey && event.key === 'z') {
      if (event.altKey && event.key === 's') {
            document.getElementById('submit').click();
            return false;
  }
});


</script>

</html>
