// ============= Tool state management

var currentTool = 'pen'  // 'pen', 'eraser' or 'pointer'
var colstroke = "#0000a0"
var linewidth = 7
var penWidth = 7
var eraserWidth = 20
var zoomLevel = 1
var panX = 0
var panY = 0

function updateToolSelection(tool) {
    currentTool = tool
    // Reset all tool icon backgrounds and borders
    $('#manuscript_icon_pen, #manuscript_icon_rubber, #manuscript_icon_pointer, #manuscript_icon_drag').css({
        'background-color': '#ffffff',
        'border-radius': '0px',
        'border': '2px solid transparent'
    })
    // Highlight selected tool with background and border
    if (tool === 'pen') {
        $('#manuscript_icon_pen').css({
            'background-color': '#cce0ff',
            'border-radius': '4px',
            'border': '2px solid #3366cc'
        })
    } else if (tool === 'eraser') {
        $('#manuscript_icon_rubber').css({
            'background-color': '#cce0ff',
            'border-radius': '4px',
            'border': '2px solid #3366cc'
        })
    } else if (tool === 'pointer') {
        $('#manuscript_icon_pointer').css({
            'background-color': '#cce0ff',
            'border-radius': '4px',
            'border': '2px solid #3366cc'
        })
    } else if (tool === 'drag') {
        $('#manuscript_icon_drag').css({
            'background-color': '#cce0ff',
            'border-radius': '4px',
            'border': '2px solid #3366cc'
        })
    }
    // Update active linewidth from tool-specific size
    if (tool === 'pen') {
        linewidth = penWidth
    } else if (tool === 'eraser') {
        linewidth = eraserWidth
    }
    if (tool !== 'pointer' && tool !== 'drag') {
        list_moves_col.push([moves.length, colstroke, linewidth])
        // Update slider to reflect current tool size
        $('#size_slider').val(linewidth)
        $('#size_slider_value').text(linewidth + 'px')
        // Update indicator
        $('#control_size_color').css({'height': linewidth, 'margin-bottom': -linewidth/2})
    }
    updateCursor()
}

// ============= Size preview circle

function showSizePreview() {
    var el = document.getElementById('size_preview')
    if (!el) return
    var displaySize = Math.max(4, Math.round(linewidth * zoomLevel))
    el.style.width = displaySize + 'px'
    el.style.height = displaySize + 'px'
    el.style.background = (currentTool === 'eraser') ? 'rgba(0,0,0,0.15)' : colstroke
    el.style.opacity = '0.7'
    el.style.display = 'block'
}

function hideSizePreview() {
    var el = document.getElementById('size_preview')
    if (el) el.style.display = 'none'
}

// ============= Wrapper border (visible when zoomed/panned)

function updateWrapperBorder() {
    var wrapper = document.getElementById('canvas_wrapper')
    if (!wrapper) return
    if (zoomLevel !== 1 || panX !== 0 || panY !== 0) {
        wrapper.style.border = '1px dashed #888'
    } else {
        wrapper.style.border = '1px dashed transparent'
    }
}

// ============= Custom cursor

function updateCursor() {
    if (currentTool === 'pointer') {
        $('#canvas').css('cursor', 'crosshair')
        return
    }
    if (currentTool === 'drag') {
        $('#canvas').css('cursor', 'grab')
        return
    }
    var size = Math.max(6, Math.min(Math.round(linewidth * zoomLevel), 128))
    // Ensure even size for centered hotspot
    if (size % 2 !== 0) size += 1
    var half = size / 2
    var svg
    if (currentTool === 'pen') {
        // Round cursor for pen
        svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size + '">' +
              '<circle cx="' + half + '" cy="' + half + '" r="' + (half - 1) + '" fill="rgba(0,0,0,0.15)" stroke="black" stroke-width="1"/>' +
              '</svg>'
    } else {
        // Square cursor for eraser
        svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size + '">' +
              '<rect x="1" y="1" width="' + (size - 2) + '" height="' + (size - 2) + '" fill="rgba(0,0,0,0.15)" stroke="black" stroke-width="1"/>' +
              '</svg>'
    }
    var encoded = 'data:image/svg+xml;base64,' + btoa(svg)
    $('#canvas').css('cursor', 'url(' + encoded + ') ' + half + ' ' + half + ', crosshair')
}

var moves = new Array();
var pressed;

// ============= Layer system

var layers = []
var activeLayerIndex = 0
var layerCounter = 0

function getActiveLayer() {
    return layers[activeLayerIndex]
}

function createLayerCanvas(name) {
    layerCounter++
    var layerCanvas = document.createElement('canvas')
    layerCanvas.setAttribute('width', canvas_width)
    layerCanvas.setAttribute('height', 450)
    layerCanvas.style.position = 'absolute'
    layerCanvas.style.left = '0'
    layerCanvas.style.top = '0'
    layerCanvas.className = 'layer-canvas'
    var layerContext = layerCanvas.getContext('2d')
    layerContext.lineJoin = 'round'
    return {
        canvas: layerCanvas,
        context: layerContext,
        moves: [],
        list_moves_col: [[0, colstroke, linewidth]],
        visible: true,
        name: name || ('Calque ' + layerCounter)
    }
}

function addLayer(name) {
    if (layers.length > 0) {
        layers[activeLayerIndex].moves = moves
        layers[activeLayerIndex].list_moves_col = list_moves_col
    }
    var layer = createLayerCanvas(name)
    layers.push(layer)
    var wrapper = document.getElementById('canvas_wrapper')
    var inputCanvas = document.getElementById('canvas')
    if (inputCanvas) {
        wrapper.insertBefore(layer.canvas, inputCanvas)
    } else {
        wrapper.appendChild(layer.canvas)
    }
    activeLayerIndex = layers.length - 1
    context = layer.context
    moves = layer.moves
    list_moves_col = layer.list_moves_col
    updateLayerPanel()
    return layer
}

function removeLayer(index) {
    if (layers.length <= 1) return
    layers[index].canvas.parentNode.removeChild(layers[index].canvas)
    layers.splice(index, 1)
    if (activeLayerIndex >= layers.length) {
        activeLayerIndex = layers.length - 1
    }
    context = layers[activeLayerIndex].context
    moves = layers[activeLayerIndex].moves
    list_moves_col = layers[activeLayerIndex].list_moves_col
    updateLayerPanel()
}

function setActiveLayer(index) {
    if (index === activeLayerIndex) { updateLayerPanel(); return }
    if (layers.length > 0 && activeLayerIndex < layers.length) {
        layers[activeLayerIndex].moves = moves
        layers[activeLayerIndex].list_moves_col = list_moves_col
    }
    activeLayerIndex = index
    context = layers[index].context
    moves = layers[index].moves
    list_moves_col = layers[index].list_moves_col
    updateLayerPanel()
}

function toggleLayerVisibility(index) {
    layers[index].visible = !layers[index].visible
    layers[index].canvas.style.display = layers[index].visible ? 'block' : 'none'
    updateLayerPanel()
}

function updateLayerPanel() {
    var listDiv = $('#layer_list')
    if (!listDiv.length) return
    listDiv.empty()
    for (var i = layers.length - 1; i >= 0; i--) {
        (function(idx) {
            var item = $('<div/>').css({
                'padding': '2px',
                'margin': '1px 0',
                'cursor': 'pointer',
                'background': idx === activeLayerIndex ? '#cce0ff' : '#f5f5f5',
                'border': idx === activeLayerIndex ? '1px solid #3366cc' : '1px solid #ddd',
                'border-radius': '2px',
                'font-size': '9px',
                'display': 'flex',
                'align-items': 'center',
                'gap': '2px'
            })
            var eye = $('<span/>').html(layers[idx].visible ? '&#9679;' : '&#9675;')
                                   .css({'cursor': 'pointer', 'font-size': '10px', 'width': '12px'})
            eye.click(function(e) { e.stopPropagation(); toggleLayerVisibility(idx) })
            var nm = $('<span/>').text(idx + 1).css({'flex': '1', 'overflow': 'hidden'})
            item.append(eye).append(nm)
            item.click(function() { setActiveLayer(idx) })
            listDiv.append(item)
        })(i)
    }
}

function canvas_actions(){

    var dragStartX, dragStartY, dragPanX, dragPanY

    $('#canvas').mousedown(function(e){
          if (currentTool === 'pointer') return;
          if (currentTool === 'drag') {
              pressed = true;
              dragStartX = e.clientX
              dragStartY = e.clientY
              dragPanX = panX
              dragPanY = panY
              $('#canvas').css('cursor', 'grabbing')
              return;
          }
          pressed= true;
          linewidth_choices.hide()
          hideSizePreview()
          save_pixel(e, false)
          redraw();

    });

    $('#canvas').mousemove(function(e){
          if (currentTool === 'pointer') return;
          if (currentTool === 'drag') {
              if (pressed) {
                  panX = dragPanX + (e.clientX - dragStartX)
                  panY = dragPanY + (e.clientY - dragStartY)
                  var wrapper = document.getElementById('canvas_wrapper')
                  wrapper.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + zoomLevel + ')'
                  updateWrapperBorder()
              }
              return;
          }
          if(pressed){
             save_pixel(e, true)
             redraw();
      }
    });

    $('#canvas').mouseup(function(e){
      if (currentTool === 'drag' && pressed) {
          $('#canvas').css('cursor', 'grab')
      }
      pressed = false;
    });

    $('#canvas').mouseleave(function(e){
      if (currentTool === 'drag' && pressed) {
          $('#canvas').css('cursor', 'grab')
      }
      pressed = false;
    });

    // Ctrl+wheel zoom (translate+scale to keep point under cursor in place)
    document.getElementById('canvas').addEventListener('wheel', function(e){
        if (!e.ctrlKey) return;
        e.preventDefault();
        var oldZoom = zoomLevel
        var factor = e.deltaY > 0 ? 0.9 : 1.1
        zoomLevel *= factor
        zoomLevel = Math.max(0.3, Math.min(zoomLevel, 5))
        var wrapper = document.getElementById('canvas_wrapper')
        var cm = document.getElementById('canvas_manuscript')
        var cmRect = cm.getBoundingClientRect()
        // Mouse position relative to canvas_manuscript
        var mouseX = e.clientX - cmRect.left
        var mouseY = e.clientY - cmRect.top
        // Canvas coordinate under cursor
        var cx = (mouseX - panX) / oldZoom
        var cy = (mouseY - panY) / oldZoom
        // Adjust pan so this point stays under cursor
        panX = mouseX - cx * zoomLevel
        panY = mouseY - cy * zoomLevel
        wrapper.style.transformOrigin = '0 0'
        wrapper.style.transform = 'translate(' + panX + 'px,' + panY + 'px) scale(' + zoomLevel + ')'
        updateCursor()
        updateWrapperBorder()
    }, {passive: false});

    redraw();

}

var canvas, context = false

function initCanvas() {

      var canvasDiv = document.getElementById('canvas_manuscript');

      // Create wrapper for zoom transform (canvas_manuscript clips overflow)
      var wrapper = document.createElement('div')
      wrapper.setAttribute('id', 'canvas_wrapper')
      wrapper.style.position = 'absolute'
      wrapper.style.left = '0'
      wrapper.style.top = '0'
      wrapper.style.width = canvas_width + 'px'
      wrapper.style.height = '450px'
      wrapper.style.border = '1px dashed transparent'
      wrapper.style.boxSizing = 'border-box'
      canvasDiv.appendChild(wrapper)

      // Create first layer
      var firstLayer = createLayerCanvas('Calque 1')
      layers.push(firstLayer)
      wrapper.appendChild(firstLayer.canvas)
      activeLayerIndex = 0
      context = firstLayer.context
      moves = firstLayer.moves
      list_moves_col = firstLayer.list_moves_col

      // Create input overlay canvas (transparent, captures mouse events)
      canvas = document.createElement('canvas');
      canvas.setAttribute('width', canvas_width);
      canvas.setAttribute('height', 450);
      canvas.setAttribute('id', 'canvas');
      canvas.style.position = 'absolute'
      canvas.style.left = '0'
      canvas.style.top = '0'
      canvas.style.zIndex = '2'
      wrapper.appendChild(canvas);

      // Size preview circle (top-left corner, outside wrapper so always visible)
      var preview = document.createElement('div')
      preview.setAttribute('id', 'size_preview')
      preview.style.position = 'absolute'
      preview.style.left = '15px'
      preview.style.top = '15px'
      preview.style.borderRadius = '50%'
      preview.style.pointerEvents = 'none'
      preview.style.zIndex = '10'
      preview.style.display = 'none'
      canvasDiv.appendChild(preview)

      canvas_actions()
      updateCursor()
      updateLayerPanel()

}


function draw_one_color(i, ctx){

      ctx.beginPath();
      if(moves[i][2] && i){ ctx.moveTo(moves[i-1][0], moves[i-1][1]);
      }else{ ctx.moveTo(moves[i][0], moves[i][1]); }
      ctx.lineTo(moves[i][0], moves[i][1]);
      ctx.closePath();
      ctx.stroke();

}

var list_moves_col = [[0, colstroke, linewidth]]  // initialisation
function redraw(){
      var layer = getActiveLayer()
      var lcanvas = layer.canvas
      var lcontext = layer.context
      lcanvas.width = lcanvas.width; //

      lcontext.lineJoin = "round";

      list_moves_col.push([moves.length, colstroke, linewidth]) // adding last element..
      for(var j = 0; j < list_moves_col.length-1; j++){
            lcontext.lineWidth = list_moves_col[j][2];
            lcontext.strokeStyle = list_moves_col[j][1];
            for(var i = list_moves_col[j][0]; i < list_moves_col[j+1][0]; i++)
              {
                draw_one_color(i, lcontext)
              }
      }
      list_moves_col.pop() // removing last element..

}

function save_pixel(e, state){

  var al = getActiveLayer()
  var rect = document.getElementById('canvas').getBoundingClientRect()
  var x = (e.clientX - rect.left) * (canvas_width / rect.width)
  var y = (e.clientY - rect.top) * (450 / rect.height)
  al.moves.push([x, y, state]);
  moves = al.moves

}

function saveCanvasAsImage(title) {   // Flatten all visible layers and save as png
       var tempCanvas = document.createElement('canvas')
       tempCanvas.width = canvas_width
       tempCanvas.height = 450
       var tempCtx = tempCanvas.getContext('2d')
       tempCtx.fillStyle = manuscript_canvas_color
       tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height)
       for (var i = 0; i < layers.length; i++) {
           if (layers[i].visible) {
               tempCtx.drawImage(layers[i].canvas, 0, 0)
           }
       }
       var link = document.createElement('a')
       link.download = title + '.png'
       link.href = tempCanvas.toDataURL('image/png')
       link.click()
}

function convertCanvasToImage(canvas) {   // Convert canvas drawing to png image (legacy)
       var image = new Image();
       image.src = canvas[0].toDataURL("image/png");
       return image;
}

initCanvas()
