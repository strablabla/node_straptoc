<style>
/* README Modal */
#readme_modal {
    display: none;
    position: fixed;
    z-index: 10002;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.6);
}

#readme_modal_content {
    background-color: #fff;
    margin: 3% auto;
    padding: 0;
    border-radius: 8px;
    width: 85%;
    max-width: 1200px;
    max-height: 90%;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    display: flex;
    flex-direction: column;
}

#readme_modal_header {
    padding: 20px 30px;
    border-bottom: 1px solid #e0e0e0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 8px 8px 0 0;
}

#readme_modal_title {
    margin: 0;
    color: #fff;
    font-size: 24px;
    font-weight: 600;
}

#readme_modal_close {
    background: rgba(255,255,255,0.2);
    border: none;
    border-radius: 50%;
    width: 36px;
    height: 36px;
    cursor: pointer;
    font-size: 24px;
    line-height: 1;
    color: #fff;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
}

#readme_modal_close:hover {
    background: rgba(255,255,255,0.3);
    transform: scale(1.1);
}

#readme_modal_body {
    padding: 30px;
    overflow-y: auto;
    flex: 1;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    color: #333;
}

/* Markdown Styling */
#readme_modal_body h1 {
    font-size: 2em;
    border-bottom: 1px solid #eaecef;
    padding-bottom: 0.3em;
    margin-top: 24px;
    margin-bottom: 16px;
}

#readme_modal_body h2 {
    font-size: 1.5em;
    border-bottom: 1px solid #eaecef;
    padding-bottom: 0.3em;
    margin-top: 24px;
    margin-bottom: 16px;
}

#readme_modal_body h3 {
    font-size: 1.25em;
    margin-top: 24px;
    margin-bottom: 16px;
}

#readme_modal_body h4 {
    font-size: 1em;
    margin-top: 24px;
    margin-bottom: 16px;
}

#readme_modal_body p {
    margin-top: 0;
    margin-bottom: 16px;
}

#readme_modal_body ul, #readme_modal_body ol {
    padding-left: 2em;
    margin-top: 0;
    margin-bottom: 16px;
}

#readme_modal_body li {
    margin-bottom: 0.25em;
}

#readme_modal_body code {
    background-color: rgba(27,31,35,0.05);
    border-radius: 3px;
    font-size: 85%;
    margin: 0;
    padding: 0.2em 0.4em;
    font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
}

#readme_modal_body pre {
    background-color: #f6f8fa;
    border-radius: 6px;
    font-size: 85%;
    line-height: 1.45;
    overflow: auto;
    padding: 16px;
    margin-bottom: 16px;
}

#readme_modal_body pre code {
    background-color: transparent;
    border: 0;
    display: inline;
    line-height: inherit;
    margin: 0;
    overflow: visible;
    padding: 0;
    word-wrap: normal;
}

#readme_modal_body a {
    color: #0366d6;
    text-decoration: none;
}

#readme_modal_body a:hover {
    text-decoration: underline;
}

#readme_modal_body blockquote {
    border-left: 0.25em solid #dfe2e5;
    color: #6a737d;
    padding: 0 1em;
    margin: 0 0 16px 0;
}

#readme_modal_body table {
    border-collapse: collapse;
    border-spacing: 0;
    margin-bottom: 16px;
}

#readme_modal_body table tr {
    background-color: #fff;
    border-top: 1px solid #c6cbd1;
}

#readme_modal_body table tr:nth-child(2n) {
    background-color: #f6f8fa;
}

#readme_modal_body table th, #readme_modal_body table td {
    border: 1px solid #dfe2e5;
    padding: 6px 13px;
}

#readme_modal_body table th {
    font-weight: 600;
}

#readme_modal_body hr {
    height: 0.25em;
    padding: 0;
    margin: 24px 0;
    background-color: #e1e4e8;
    border: 0;
}

#readme_modal_body strong {
    font-weight: 600;
}

#readme_modal_body em {
    font-style: italic;
}

/* Loading animation */
.readme-loading {
    text-align: center;
    padding: 40px;
    color: #666;
    font-size: 18px;
}

.readme-loading:after {
    content: '...';
    animation: dots 1.5s steps(4, end) infinite;
}

@keyframes dots {
    0%, 20% { content: '.'; }
    40% { content: '..'; }
    60%, 100% { content: '...'; }
}
</style>

<!-- README Modal Container -->
<div id="readme_modal">
    <div id="readme_modal_content">
        <div id="readme_modal_header">
            <h2 id="readme_modal_title">📖 README - Documentation</h2>
            <button id="readme_modal_close">&times;</button>
        </div>
        <div id="readme_modal_body">
            <div class="readme-loading">Loading README</div>
        </div>
    </div>
</div>

<script>
/*

README Modal Display

Shows the README.md file in a modal when the help icon is clicked

*/

// Close modal when clicking the close button
$('#readme_modal_close').click(function() {
    $('#readme_modal').fadeOut(200);
});

// Close modal when clicking outside the content
$('#readme_modal').click(function(e) {
    if (e.target.id === 'readme_modal') {
        $(this).fadeOut(200);
    }
});

// Close modal with Escape key
$(document).keyup(function(e) {
    if (e.keyCode === 27) { // Escape
        $('#readme_modal').fadeOut(200);
    }
});

// Function to open README modal
function openReadmeModal() {
    console.log('[README Modal] Opening README modal');
    $('#readme_modal').fadeIn(200);

    // Show loading state
    $('#readme_modal_body').html('<div class="readme-loading">Loading README</div>');

    // Request README content from server
    socket.emit('get_readme');
}

// Listen for README content from server
socket.on('readme_content', function(data) {
    console.log('[README Modal] Received README content');
    var response = JSON.parse(data);

    if (response.success) {
        // Display the rendered HTML
        $('#readme_modal_body').html(response.html);
    } else {
        $('#readme_modal_body').html(
            '<div style="color: #d73a49; padding: 20px;">' +
            '<h3>Error Loading README</h3>' +
            '<p>' + (response.error || 'Could not load README file') + '</p>' +
            '</div>'
        );
    }
});

console.log('[README Modal] README modal system loaded');
</script>
