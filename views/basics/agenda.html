function date_day(){

      /*

      Build the text date

      */

      var date = new Date()
      var day = date.getDate();
      var month = date.getMonth() + 1;
      var year = date.getFullYear();
      var txt_date = [year, month, day].join('_').slice(2)

      return txt_date

}

function calc_index_cell(i,j){

// Function to display notes in the panel
function displayNotesInPanel(notesJson){
      var notes = JSON.parse(notesJson)

      // Clear loading message and old content - keep only title and close icon
      $('#pan_day > div').each(function(){
          if ($(this).attr('id') !== 'pan_day_title' && $(this).attr('id') !== 'icon_close_pan_day') {
              $(this).remove()
          }
      })
      $('#notes_list').remove()
      $('#new_note_textarea').remove()
      $('#save_note_btn').remove()

      // Create notes list container
      var notesList = $('<div/>').attr('id', 'notes_list').css(css_notes_list)

      // Display existing notes in chronological order
      if (notes && notes.length > 0) {
          for (var i = 0; i < notes.length; i++) {
              var note = notes[i]
              var noteDiv = $('<div/>').css(css_single_note)

              // Format timestamp
              var date = new Date(note.timestamp)
              var timeStr = date.toLocaleString()
              var timestampDiv = $('<div/>').css(css_note_timestamp).text(timeStr)

              var textDiv = $('<div/>').text(note.text)

              noteDiv.append(timestampDiv).append(textDiv)
              notesList.append(noteDiv)
          }
      } else {
          notesList.append($('<div/>').css({'color': '#999', 'text-align': 'center', 'padding': '20px'})
                                       .text('Aucune note pour ce jour'))
      }

      // Add textarea for new note
      var textarea = $('<textarea/>').attr('id', 'new_note_textarea')
                                      .attr('placeholder', 'Entrez une nouvelle note...')
                                      .css(css_textarea)

      // Add save button
      var saveBtn = $('<button/>').attr('id', 'save_note_btn')
                                   .text('Enregistrer')
                                   .css(css_save_button)

      saveBtn.click(function(){
          var noteText = $('#new_note_textarea').val().trim()
          if (noteText) {
              var fullYear = new Date().getFullYear()
              var dayNum = $('#pan_day_title').text()
              var dateKey = fullYear + '_' + selected_month + '_' + dayNum

              var data = JSON.stringify({
                  dateKey: dateKey,
                  note: noteText
              })

              socket.emit('save_note', data)
              $('#new_note_textarea').val('')  // Clear textarea
          }
      })

      saveBtn.hover(
          function(){ $(this).css('background-color', '#218838') },
          function(){ $(this).css('background-color', '#28a745') }
      )

      // Add everything to the panel
      $('#pan_day').append(notesList)
      $('#pan_day').append(textarea)
      $('#pan_day').append(saveBtn)

}
