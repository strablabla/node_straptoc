<style>
/* Shutdown confirmation modal */
#shutdown_confirm_modal {
    display: none;
    position: fixed;
    z-index: 10001;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.5);
}

#shutdown_confirm_content {
    background-color: #fff;
    margin: 15% auto;
    padding: 25px;
    border-radius: 8px;
    width: 400px;
    max-width: 90%;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}

#shutdown_confirm_message {
    font-size: 15px;
    color: #333;
    margin-bottom: 25px;
    line-height: 1.6;
}

#shutdown_confirm_buttons {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
}

#shutdown_confirm_buttons button {
    padding: 10px 24px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s;
}

#shutdown_cancel_btn {
    background-color: #6c757d;
    color: white;
}

#shutdown_cancel_btn:hover {
    background-color: #5a6268;
}

#shutdown_confirm_btn {
    background-color: #dc3545;
    color: white;
}

#shutdown_confirm_btn:hover {
    background-color: #c82333;
}
</style>

<!-- Shutdown Confirmation Modal -->
<div id="shutdown_confirm_modal">
    <div id="shutdown_confirm_content">
        <div id="shutdown_confirm_message">
            <strong>Shutdown Server?</strong><br><br>
            This will:<br>
            • Stop the Node.js server<br>
            • Close all open browser pages<br><br>
            You will need to restart the server manually.
        </div>
        <div id="shutdown_confirm_buttons">
            <button id="shutdown_cancel_btn">Cancel</button>
            <button id="shutdown_confirm_btn">Shutdown</button>
        </div>
    </div>
</div>

<script>

/*

Server Shutdown Button

*/

var shutdown_button = $('<img/>').attr('src',"capicon/svg/086.svg")  // up arrow icon for shutdown
shutdown_button.attr('id','shutdown_button')
           .attr('title','Shutdown Server')
           .css({
                'position':'fixed',
                'top':'3px',
                'right':'20px',
                'width':'20px',
                'height':'20px',
                'z-index': '10',
                'cursor': 'pointer',
                'opacity': '0.8',
                'transition': 'opacity 0.2s, transform 0.2s'
              })

// Hover effect
shutdown_button.hover(
    function() {
        $(this).css({'opacity': '1', 'transform': 'scale(1.1)'});
    },
    function() {
        $(this).css({'opacity': '0.8', 'transform': 'scale(1)'});
    }
);

$('#content').append(shutdown_button)
console.log('Shutdown button created and appended to #content');

// Shutdown click handler
shutdown_button.click(function(){
    console.log('Shutdown button clicked!');
    $('#shutdown_confirm_modal').fadeIn(200);
})

// Cancel button
$('#shutdown_cancel_btn').click(function() {
    console.log('Cancel button clicked');
    $('#shutdown_confirm_modal').fadeOut(200);
});

// Confirm button
$('#shutdown_confirm_btn').click(function() {
    $('#shutdown_confirm_modal').fadeOut(200);

    // Show notification
    try {
        if (typeof alertify !== 'undefined') {
            alertify.warning('Shutting down server...');
        }
    } catch(e) {
        console.error('Alertify error:', e);
    }

    // Small delay to ensure fadeOut completes and socket is ready
    setTimeout(function() {
        var attemptShutdown = function() {
            if (typeof socket !== 'undefined' && socket.connected) {
                socket.emit('shutdown_server');
                console.log('Server shutdown request sent');
            } else if (typeof socket !== 'undefined' && !socket.connected) {
                console.warn('Socket not connected, waiting...');
                setTimeout(attemptShutdown, 100);
            } else {
                console.error('Socket not defined!');
                alert('Error: Socket not connected. Please refresh the page and try again.');
            }
        };

        attemptShutdown();
    }, 50); // 50ms delay ensures smooth operation
});

// Close on outside click
$('#shutdown_confirm_modal').click(function(e) {
    if (e.target.id === 'shutdown_confirm_modal') {
        $(this).fadeOut(200);
    }
})

// Listen for server shutdown broadcast - register when socket is ready
$(document).ready(function() {
    var registerShutdownListener = function() {
        if (typeof socket !== 'undefined') {
            console.log('Registering shutdown listener on socket');
            socket.on('server_shutting_down', function() {
                console.log('========================================');
                console.log('RECEIVED server_shutting_down BROADCAST');
                console.log('Attempting to close window...');
                console.log('========================================');

                // Try to close the window
                window.close();

                // If window.close() doesn't work (window not opened by script), redirect to about:blank
                setTimeout(function() {
                    console.log('window.close() did not work, redirecting to about:blank');
                    window.location.href = 'about:blank';
                }, 100);
            });
        } else {
            console.log('Socket not yet available, retrying in 100ms...');
            setTimeout(registerShutdownListener, 100);
        }
    };

    registerShutdownListener();
});

</script>
