<script>
/*
 * Parameters Editor - Color tags and paths configuration
 * Raccourci: Ctrl+C
 */

// Variables globales
var colorTagsData = {};
var modalOpen = false;

// Notification system
function showNotification(message, type) {
    var toast = $('#notification_toast');
    toast.removeClass('success error warning');
    if (type) {
        toast.addClass(type);
    }
    toast.text(message);
    toast.fadeIn(300);

    setTimeout(function() {
        toast.fadeOut(300);
    }, 2000);
}

// Initialisation
$(document).ready(function() {
    loadColorTags();
    setupEventHandlers();
    setupKeyboardShortcuts();
});

// Charger les color_tags depuis le serveur
function loadColorTags() {
    socket.emit('get_color_tags');
}

// Recevoir les color_tags du serveur
socket.on('color_tags_data', function(data) {
    colorTagsData = JSON.parse(data);
    renderColorTags();
});

// Afficher les color_tags dans la modal
function renderColorTags() {
    var container = $('#color_tags_list');
    container.empty();

    // Get tag names and sort alphabetically
    var tagNames = Object.keys(colorTagsData).sort();

    // Display tags in alphabetical order
    for (var i = 0; i < tagNames.length; i++) {
        var tagName = tagNames[i];
        var tag = colorTagsData[tagName];
        var tagElement = createColorTagElement(tagName, tag);
        container.append(tagElement);
    }
}

// Create HTML element for a color tag
function createColorTagElement(tagName, tagData) {
    var insideColor = tagData.inside ? tagData.inside.color : '#ffffff';
    var titleColor = tagData.title ? tagData.title.color : '#000000';

    var item = $('<div>').addClass('color_tag_item').attr('data-tag', tagName);

    // Tag name
    var nameSpan = $('<span>').addClass('color_tag_name').text(tagName);

    // Visual preview square (clickable)
    var previewSquare = $('<div>').addClass('color_preview_square')
                                   .css('background-color', insideColor)
                                   .attr('data-tag', tagName);

    // Native color picker input (hidden)
    var colorPicker = $('<input>').attr('type', 'color')
                                   .addClass('color_picker_input')
                                   .val(insideColor)
                                   .attr('data-tag', tagName);

    // Hex text input
    var hexInput = $('<input>').attr('type', 'text')
                               .addClass('color_input_text')
                               .val(insideColor)
                               .attr('data-tag', tagName)
                               .attr('data-type', 'inside');

    // Delete button
    var deleteBtn = $('<button>').addClass('color_tag_delete')
                                  .text('✕')
                                  .attr('data-tag', tagName);

    // Assemble: name - preview square - hidden picker - hex - delete
    item.append(nameSpan)
        .append(previewSquare)
        .append(colorPicker)
        .append(hexInput)
        .append(deleteBtn);

    return item;
}

// Gestion des événements
function setupEventHandlers() {
    // Fermer la modal
    $('.close_color_tags_modal').click(function() {
        closeModal();
    });

    // Fermer si clic en dehors de la modal
    $('#color_tags_modal').click(function(event) {
        if (event.target.id === 'color_tags_modal') {
            closeModal();
        }
    });

    // Click on preview square opens hidden color picker
    $(document).on('click', '.color_preview_square', function(e) {
        e.preventDefault();
        e.stopPropagation();
        var tagName = $(this).attr('data-tag');
        var picker = $('.color_picker_input[data-tag="' + tagName + '"]')[0];
        if (picker) {
            picker.click();
        }
    });

    // Native color picker change event
    $(document).on('input', '.color_picker_input', function() {
        var tagName = $(this).attr('data-tag');
        var color = $(this).val();

        // Update preview square
        $('.color_preview_square[data-tag="' + tagName + '"]').css('background-color', color);

        // Update hex text input
        $('.color_input_text[data-tag="' + tagName + '"]').val(color);

        // Calculate darker title color automatically
        var titleColor = darkenColor(color, 20);

        // Update data
        updateColorTagData(tagName, 'inside', color);
        updateColorTagData(tagName, 'title', titleColor);
    });

    // Sync text input changes
    $(document).on('input', '.color_input_text', function() {
        var tagName = $(this).attr('data-tag');
        var color = $(this).val();

        // Validate hexadecimal format
        if (/^#[0-9A-F]{6}$/i.test(color)) {
            // Update preview square
            $('.color_preview_square[data-tag="' + tagName + '"]').css('background-color', color);

            // Update native color picker
            $('.color_picker_input[data-tag="' + tagName + '"]').val(color);

            // Calculate darker title color automatically
            var titleColor = darkenColor(color, 20);

            // Update data
            updateColorTagData(tagName, 'inside', color);
            updateColorTagData(tagName, 'title', titleColor);
        }
    });

    // Double-click on tag name to rename
    $(document).on('dblclick', '.color_tag_name', function() {
        var $nameSpan = $(this);
        var oldTagName = $nameSpan.closest('.color_tag_item').attr('data-tag');
        var currentText = $nameSpan.text();

        // Create an input field to edit the name
        var $input = $('<input>')
            .attr('type', 'text')
            .val(currentText)
            .addClass('color_tag_name_edit')
            .css({
                'font-weight': 'bold',
                'font-size': '14px',
                'border': '1px solid #4CAF50',
                'border-radius': '3px',
                'padding': '2px 4px',
                'min-width': '80px',
                'margin-right': '10px'
            });

        // Replace span with input
        $nameSpan.replaceWith($input);
        $input.focus().select();

        // Handle rename on blur or enter
        var finishRename = function() {
            var newTagName = $input.val().trim();

            // If empty or unchanged, revert
            if (newTagName === '' || newTagName === oldTagName) {
                $input.replaceWith($nameSpan);
                return;
            }

            // Check if new name already exists
            if (colorTagsData.hasOwnProperty(newTagName)) {
                showNotification('Tag "' + newTagName + '" already exists', 'warning');
                $input.replaceWith($nameSpan);
                return;
            }

            // Rename the tag in data
            colorTagsData[newTagName] = colorTagsData[oldTagName];
            delete colorTagsData[oldTagName];

            // Re-render the list (will be sorted alphabetically)
            renderColorTags();
        };

        $input.on('blur', finishRename);
        $input.on('keypress', function(e) {
            if (e.which === 13) { // Enter key
                finishRename();
            }
        });
    });

    // Delete a tag
    $(document).on('click', '.color_tag_delete', function() {
        var tagName = $(this).attr('data-tag');
        if (confirm('Are you sure you want to delete tag "' + tagName + '"?')) {
            delete colorTagsData[tagName];
            renderColorTags();
        }
    });

    // Add a new tag
    $('#add_tag_button').click(function() {
        var newTagName = $('#new_tag_name').val().trim();
        if (newTagName === '') {
            showNotification('Please enter a tag name', 'warning');
            return;
        }

        if (colorTagsData.hasOwnProperty(newTagName)) {
            showNotification('This tag already exists', 'warning');
            return;
        }

        // Create a new tag with default colors
        colorTagsData[newTagName] = {
            inside: { color: '#ffffff' },
            title: { color: '#e6e6e6' }
        };

        renderColorTags();
        $('#new_tag_name').val('');

        // Scroller vers le nouveau tag
        var newTagElement = $('.color_tag_item[data-tag="' + newTagName + '"]');
        if (newTagElement.length) {
            newTagElement[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
            newTagElement.css('background-color', '#fffacd');
            setTimeout(function() {
                newTagElement.css('background-color', '');
            }, 2000);
        }
    });

    // Auto-save on close - manual save button removed
    // $('#save_color_tags_button').click(function() {
    //     saveColorTags();
    // });

    // Tab switching
    $('.tab-button').click(function() {
        var targetTab = $(this).attr('data-tab');

        // Update button states
        $('.tab-button').removeClass('active');
        $(this).addClass('active');

        // Update tab content visibility
        $('.tab-content').removeClass('active');
        $('#tab-' + targetTab).addClass('active');

        // Load paths when switching to paths tab
        if (targetTab === 'paths') {
            loadPaths();
        }
    });

    // Add path button
    $('#add_path_button').click(function() {
        var fullPath = $('#new_path_input').val().trim();
        if (fullPath === '') {
            showNotification('Please enter a path', 'warning');
            return;
        }
        addNewPath(fullPath);
    });

    // Add path on Enter key
    $('#new_path_input').keypress(function(e) {
        if (e.which === 13) { // Enter key
            $('#add_path_button').click();
        }
    });

    // Remove path button
    $(document).on('click', '.remove-path', function() {
        var pathToRemove = $(this).closest('.path-item').attr('data-path');
        if (confirm('Remove path "' + pathToRemove + '"?')) {
            removePath(pathToRemove);
        }
    });
}

// Darken a color by a percentage
function darkenColor(hex, percent) {
    // Convert hex to RGB
    var r = parseInt(hex.substring(1, 3), 16);
    var g = parseInt(hex.substring(3, 5), 16);
    var b = parseInt(hex.substring(5, 7), 16);

    // Darken by reducing each component
    r = Math.max(0, Math.floor(r * (1 - percent / 100)));
    g = Math.max(0, Math.floor(g * (1 - percent / 100)));
    b = Math.max(0, Math.floor(b * (1 - percent / 100)));

    // Convert back to hex
    var rr = r.toString(16).padStart(2, '0');
    var gg = g.toString(16).padStart(2, '0');
    var bb = b.toString(16).padStart(2, '0');

    return '#' + rr + gg + bb;
}

// Update tag data
function updateColorTagData(tagName, type, color) {
    if (!colorTagsData[tagName]) {
        colorTagsData[tagName] = {
            inside: { color: '#ffffff' },
            title: { color: '#e6e6e6' }
        };
    }

    if (type === 'inside') {
        colorTagsData[tagName].inside = { color: color };
    } else if (type === 'title') {
        colorTagsData[tagName].title = { color: color };
    }
}

// Save color_tags to server
function saveColorTags() {
    socket.emit('update_color_tags', JSON.stringify(colorTagsData));

    // Visual feedback
    var btn = $('#save_color_tags_button');
    var originalText = btn.text();
    btn.text('✅ Saved!').prop('disabled', true);

    setTimeout(function() {
        btn.text(originalText).prop('disabled', false);
    }, 2000);
}

// Save confirmation from server
socket.on('color_tags_updated', function(success) {
    if (success) {
        console.log('Color tags updated successfully');
        // Reload to get latest data
        loadColorTags();
    } else {
        showNotification('Error saving color tags', 'error');
    }
});

// ========== PATHS TAB FUNCTIONS ==========

var pathsData = [];

// Load paths from server
function loadPaths() {
    socket.emit('get_paths');
}

// Receive paths from server
socket.on('paths_data', function(data) {
    pathsData = JSON.parse(data);
    renderPaths();
});

// Render paths list
function renderPaths() {
    var container = $('#paths_list');
    container.empty();

    if (pathsData.length === 0) {
        container.html('<p style="color: #999; text-align: center; padding: 20px;">No paths added yet. Drag and drop files or folders above.</p>');
        return;
    }

    // Sort paths alphabetically
    var sortedPaths = pathsData.slice().sort();

    for (var i = 0; i < sortedPaths.length; i++) {
        var pathItem = createPathElement(sortedPaths[i]);
        container.append(pathItem);
    }
}

// Create HTML element for a path item
function createPathElement(pathStr) {
    var item = $('<div>').addClass('path-item').attr('data-path', pathStr);

    var pathText = $('<span>').addClass('path-text').text(pathStr);

    var removeBtn = $('<button>').addClass('remove-path')
                                  .html('&times;')
                                  .attr('title', 'Remove this path');

    item.append(pathText).append(removeBtn);

    return item;
}

// Add a new path
function addNewPath(fullPath) {
    // Send to server to calculate relative path
    socket.emit('add_path_from_input', fullPath);
}

// Add path response from server
socket.on('path_added', function(data) {
    var result = JSON.parse(data);

    if (result.success) {
        pathsData = result.paths;
        renderPaths();
        // Clear input field on success
        $('#new_path_input').val('');
        showNotification('Path added successfully', 'success');
    } else {
        showNotification('Error: ' + result.error, 'error');
    }
});

// Remove a path
function removePath(pathToRemove) {
    socket.emit('remove_path', pathToRemove);
}

// Remove path confirmation from server
socket.on('path_removed', function(data) {
    var result = JSON.parse(data);

    if (result.success) {
        pathsData = result.paths;
        renderPaths();
        showNotification('Path removed successfully', 'success');
    } else {
        showNotification('Error: ' + result.error, 'error');
    }
});

// Configuration des raccourcis clavier
function setupKeyboardShortcuts() {
    // Ctrl+C pour ouvrir/fermer la modal
    key('ctrl+c', function(e) {
        e.preventDefault();
        toggleModal();
        return false;
    });

    // Échap pour fermer la modal
    key('esc', function() {
        if (modalOpen) {
            closeModal();
            return false;
        }
    });
}

// Ouvrir/Fermer la modal
function toggleModal() {
    if (modalOpen) {
        closeModal();
    } else {
        openModal();
    }
}

function openModal() {
    $('#color_tags_modal').fadeIn(300);
    modalOpen = true;
    loadColorTags(); // Recharger les données à l'ouverture
}

function closeModal() {
    // Auto-save before closing
    saveColorTags();

    $('#color_tags_modal').fadeOut(300);
    modalOpen = false;
}

console.log('Color Tags Editor loaded - Press Ctrl+C to open');
</script>
