<style>

.pdfjs-annotation-layer .annotation-marker {

}

.pdfjs-text-layer {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    opacity: 1;
    line-height: 1.0;

    -webkit-user-select: text !important;

    pointer-events: auto !important;

<script type="module">

/*

PDF.js Custom Viewer with Annotation Support

This viewer provides:
- Full control over PDF rendering
- Page-by-page navigation
- Zoom controls
- Annotation layer support
- Integration with our annotation system

*/

import * as pdfjsLib from '/pdfjs/build/pdf.mjs';

// Configure PDF.js worker
pdfjsLib.GlobalWorkerOptions.workerSrc = '/pdfjs/build/pdf.worker.mjs';

// Global PDF viewer state
window.PDFViewer = {
    pdfDoc: null,
    currentPage: 1,
    totalPages: 0,
    scale: 1.5,
    rendering: false,
    currentPdfPath: null,
    namedBookmarks: []
};

// ---------- Cache and dedupe of rendered pages ----------

const MAX_CACHED_PAGES = 20;
const pageCache = new Map();        // pageNum -> HTMLElement (canvasContainer)
const pendingBuilds = new Map();    // pageNum -> Promise<HTMLElement>

function cacheGet(pageNum) {
    if (!pageCache.has(pageNum)) return null;
    const el = pageCache.get(pageNum);
    pageCache.delete(pageNum);
    pageCache.set(pageNum, el);  // LRU: refresh insertion order
    return el;
}

function cacheSet(pageNum, el) {
    if (pageCache.has(pageNum)) pageCache.delete(pageNum);
    pageCache.set(pageNum, el);
    while (pageCache.size > MAX_CACHED_PAGES) {
        const oldest = pageCache.keys().next().value;
        pageCache.delete(oldest);
    }
}

function clearPageCache() {
    pageCache.clear();
    pendingBuilds.clear();
}

// ---------- Accent tables (allocated once at module scope) ----------

const ACCENT_CHARS = new Set([
    '´', '´', '`', '`', '^', '^',
    '¨', '¨', '~', '~', '¸', '¸',
    '́', '̀', '̂', '̈', '̃', '̧'
]);

const ACCENT_MAP = {
    'A´': 'Á', 'E´': 'É', 'I´': 'Í', 'O´': 'Ó', 'U´': 'Ú',
    'a´': 'á', 'e´': 'é', 'i´': 'í', 'o´': 'ó', 'u´': 'ú',
    'A´': 'Á', 'E´': 'É', 'I´': 'Í', 'O´': 'Ó', 'U´': 'Ú',
    'a´': 'á', 'e´': 'é', 'i´': 'í', 'o´': 'ó', 'u´': 'ú',
    'R´': 'R´', 'r´': 'r´',
    'A`': 'À', 'E`': 'È', 'I`': 'Ì', 'O`': 'Ò', 'U`': 'Ù',
    'a`': 'à', 'e`': 'è', 'i`': 'ì', 'o`': 'ò', 'u`': 'ù',
    'A^': 'Â', 'E^': 'Ê', 'I^': 'Î', 'O^': 'Ô', 'U^': 'Û',
    'a^': 'â', 'e^': 'ê', 'i^': 'î', 'o^': 'ô', 'u^': 'û',
    'A¨': 'Ä', 'E¨': 'Ë', 'I¨': 'Ï', 'O¨': 'Ö', 'U¨': 'Ü',
    'a¨': 'ä', 'e¨': 'ë', 'i¨': 'ï', 'o¨': 'ö', 'u¨': 'ü',
    'A¨': 'Ä', 'E¨': 'Ë', 'I¨': 'Ï', 'O¨': 'Ö', 'U¨': 'Ü',
    'a¨': 'ä', 'e¨': 'ë', 'i¨': 'ï', 'o¨': 'ö', 'u¨': 'ü',
    'A~': 'Ã', 'N~': 'Ñ', 'O~': 'Õ',
    'a~': 'ã', 'n~': 'ñ', 'o~': 'õ',
    'C¸': 'Ç', 'c¸': 'ç',
    'C¸': 'Ç', 'c¸': 'ç'
};

function isAccent(str) {
    return str.length === 1 && ACCENT_CHARS.has(str);
}

function combineWithAccent(base, accent) {
    return ACCENT_MAP[base + accent] || (base + accent);
}

const COPY_ACCENT_COMBOS = {
    'A': 'Á', 'E': 'É', 'I': 'Í', 'O': 'Ó', 'U': 'Ú',
    'a': 'á', 'e': 'é', 'i': 'í', 'o': 'ó', 'u': 'ú'
};

function handleTextCopy(e) {
    const selectedText = window.getSelection().toString();
    let fixedText = '';
    for (let i = 0; i < selectedText.length; i++) {
        const c = selectedText[i];
        if (c.charCodeAt(0) === 0xB4) {
            const next = selectedText[i + 1];
            if (next && COPY_ACCENT_COMBOS[next]) {
                fixedText += COPY_ACCENT_COMBOS[next];
                i++;
            }
            continue;
        }
        fixedText += c;
    }
    fixedText = fixedText
        .replace(/A`/g, 'À').replace(/E`/g, 'È').replace(/a`/g, 'à').replace(/e`/g, 'è')
        .replace(/A\^/g, 'Â').replace(/E\^/g, 'Ê').replace(/I\^/g, 'Î').replace(/O\^/g, 'Ô').replace(/U\^/g, 'Û')
        .replace(/a\^/g, 'â').replace(/e\^/g, 'ê').replace(/i\^/g, 'î').replace(/o\^/g, 'ô').replace(/u\^/g, 'û')
        .normalize('NFC');
    if (e.clipboardData) {
        e.preventDefault();
        e.clipboardData.setData('text/plain', fixedText);
    }
}

// ---------- Bookmarks ----------

const DEBOUNCE_LAST_PAGE_MS = 800;
let lastPageSaveTimer = null;
let bookmarkListenersAttached = false;

function normalizePathClient(p) {
    return (!p || p === '/' || p === '') ? 'page-root' : p;
}

function getBookmarksFor(pdfPath) {
    if (!window.socket) return Promise.resolve({ lastPage: 1, named: [] });
    return new Promise((resolve) => {
        let done = false;
        const finish = (result) => {
            if (done) return;
            done = true;
            window.socket.off('bookmarks_loaded', handler);
            resolve(result);
        };
        const handler = (data) => {
            try { finish(JSON.parse(data)); }
            catch (e) { finish({ lastPage: 1, named: [] }); }
        };
        window.socket.on('bookmarks_loaded', handler);
        window.socket.emit('get_bookmarks', pdfPath);
        setTimeout(() => finish({ lastPage: 1, named: [] }), 2000);
    });
}

let pendingLastPageSave = null;  // { filePath, page } captured at schedule time

function scheduleSaveLastPage(page) {
    if (!window.socket || !window.PDFViewer.currentPdfPath) return;
    clearTimeout(lastPageSaveTimer);
    pendingLastPageSave = { filePath: window.PDFViewer.currentPdfPath, page: page };
    lastPageSaveTimer = setTimeout(() => {
        flushLastPageSave();
    }, DEBOUNCE_LAST_PAGE_MS);
}

function flushLastPageSave() {
    if (!pendingLastPageSave || !window.socket) return;
    clearTimeout(lastPageSaveTimer);
    window.socket.emit('save_last_page', JSON.stringify(pendingLastPageSave));
    pendingLastPageSave = null;
}

// Exposed so the modal's close handler can persist before tearing down.
window.flushPDFLastPage = flushLastPageSave;

function renderBookmarkList() {
    const $list = $('#pdfjs-bookmark-list');
    $list.empty();
    const named = window.PDFViewer.namedBookmarks || [];
    if (named.length === 0) {
        $list.append('<li class="pdfjs-bookmark-empty">No bookmarks yet</li>');
        return;
    }
    named.forEach(bm => {
        const $name = $('<span class="pdfjs-bookmark-name"></span>').text(bm.name).attr('title', bm.name);
        const $page = $('<span class="pdfjs-bookmark-page"></span>').text('p.' + bm.page);
        const $del = $('<button class="pdfjs-bookmark-del" title="Delete">×</button>');
        $name.on('click', () => {
            renderPage(bm.page);
            $('#pdfjs-bookmark-panel').removeClass('visible');
        });
        $del.on('click', (e) => {
            e.stopPropagation();
            if (!window.socket) return;
            window.socket.emit('delete_named_bookmark', JSON.stringify({
                filePath: window.PDFViewer.currentPdfPath,
                bookmarkId: bm.id
            }));
        });
        const $li = $('<li/>').append($name).append($page).append($del);
        $list.append($li);
    });
}

function wireBookmarkUI() {
    $('#pdfjs-bookmark-toggle').off('click').on('click', (e) => {
        e.stopPropagation();
        const $panel = $('#pdfjs-bookmark-panel');
        const wasVisible = $panel.hasClass('visible');
        $panel.toggleClass('visible');
        if (!wasVisible) {
            renderBookmarkList();
            $('#pdfjs-bookmark-name').focus();
        }
    });

    $('#pdfjs-bookmark-add-btn').off('click').on('click', () => {
        const name = $('#pdfjs-bookmark-name').val().trim();
        if (!name || !window.socket || !window.PDFViewer.currentPdfPath) return;
        window.socket.emit('save_named_bookmark', JSON.stringify({
            filePath: window.PDFViewer.currentPdfPath,
            bookmark: { name: name, page: window.PDFViewer.currentPage }
        }));
        $('#pdfjs-bookmark-name').val('');
    });

    $('#pdfjs-bookmark-name').off('keydown').on('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            $('#pdfjs-bookmark-add-btn').click();
        }
    });

    // Close panel on outside click
    $(document).off('click.pdfjs-bookmark').on('click.pdfjs-bookmark', (e) => {
        const $panel = $('#pdfjs-bookmark-panel');
        if (!$panel.hasClass('visible')) return;
        if ($(e.target).closest('#pdfjs-bookmark-panel, #pdfjs-bookmark-toggle').length === 0) {
            $panel.removeClass('visible');
        }
    });

    // Global socket listeners: attach once, reuse across PDFs
    if (window.socket && !bookmarkListenersAttached) {
        const currentMatches = (filePath) =>
            filePath === normalizePathClient(window.PDFViewer.currentPdfPath);
        window.socket.on('named_bookmark_saved', (data) => {
            try {
                const parsed = JSON.parse(data);
                if (!currentMatches(parsed.filePath)) return;
                window.PDFViewer.namedBookmarks = parsed.named || [];
                renderBookmarkList();
            } catch (e) {}
        });
        window.socket.on('named_bookmark_deleted', (data) => {
            try {
                const parsed = JSON.parse(data);
                if (!currentMatches(parsed.filePath)) return;
                window.PDFViewer.namedBookmarks = parsed.named || [];
                renderBookmarkList();
            } catch (e) {}
        });
        bookmarkListenersAttached = true;
    }
}

// Détecte si une URL est externe (cross-origin)
function isExternalUrl(url) {
    if (!url) return false;
    // URLs relatives ou commençant par / sont locales
    if (url.startsWith('/') || url.startsWith('./') || url.startsWith('../')) {
        return false;
    }
    // Vérifie si c'est une URL absolue vers un autre domaine
    try {
        const urlObj = new URL(url, window.location.origin);
        return urlObj.origin !== window.location.origin;
    } catch (e) {
        return false;
    }
}

// Retourne l'URL à utiliser (proxy si externe)
function getPdfUrl(pdfPath) {
    if (isExternalUrl(pdfPath)) {
        console.log('URL externe détectée, utilisation du proxy:', pdfPath);
        return `/proxy-pdf?url=${encodeURIComponent(pdfPath)}`;
    }
    return pdfPath;
}

// Initialize PDF viewer
async function initPDFViewer(pdfPath, containerId) {

    console.log('=== Initializing PDF.js viewer ===');
    console.log('PDF path:', pdfPath);
    console.log('Container ID:', containerId);

    try {
        // Load the PDF document (via proxy si URL externe)
        const actualUrl = getPdfUrl(pdfPath);
        const loadingTask = pdfjsLib.getDocument(actualUrl);

        const container = document.getElementById(containerId);
        if (!container) {
            console.error('Container not found:', containerId);
            return;
        }

        container.innerHTML = '<div class="pdfjs-loading">Loading PDF...</div>';

        const pdfDoc = await loadingTask.promise;

        clearPageCache();  // new PDF: drop everything cached from the previous one
        window.PDFViewer.pdfDoc = pdfDoc;
        window.PDFViewer.totalPages = pdfDoc.numPages;
        window.PDFViewer.currentPage = 1;
        window.PDFViewer.currentPdfPath = pdfPath;

        console.log('PDF loaded successfully. Pages:', pdfDoc.numPages);

        // Build viewer UI
        buildViewerUI(container);

        // Fetch bookmarks for this PDF (auto-resume + named list)
        const bookmarkData = await getBookmarksFor(pdfPath);
        window.PDFViewer.namedBookmarks = bookmarkData.named || [];
        const resumePage = Math.min(
            Math.max(1, parseInt(bookmarkData.lastPage, 10) || 1),
            pdfDoc.numPages
        );
        wireBookmarkUI();

        // Render the resume page
        await renderPage(resumePage);

        // Notify annotation system that PDF is ready
        if (window.annotationSystem) {
            window.annotationSystem.pdfReady = true;
            window.annotationSystem.currentFile = pdfPath;
            window.annotationSystem.fileType = 'pdf';
        }

    } catch (error) {
        console.error('Error loading PDF:', error);
        const container = document.getElementById(containerId);
        if (container) {
            container.innerHTML = `<div class="pdfjs-error">Error loading PDF: ${error.message}</div>`;
        }
    }
}

// Build viewer UI
function buildViewerUI(container) {

    const html = `
        <div class="pdfjs-viewer-container">
            <div class="pdfjs-viewer-controls">
                <button id="pdfjs-prev-page">◀</button>
                <span class="pdfjs-page-info">
                    <img src="capicon/svg/266.svg" alt="Page" title="Page" style="width: 18px; height: 18px; filter: invert(1); vertical-align: middle;">
                    <input type="number" id="pdfjs-page-num" min="1" max="${window.PDFViewer.totalPages}" value="1" style="width: 55px;">
                    <span>of <span id="pdfjs-page-count">${window.PDFViewer.totalPages}</span></span>
                </span>
                <button id="pdfjs-next-page">▶</button>
                <svg title="Zoom" viewBox="0 0 24 24" style="margin-left: 20px; width: 20px; height: 20px; vertical-align: middle;" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="6" style="fill: none; stroke: white; stroke-width: 2.5px; cursor: default;"></circle><polygon points="21,19 14.5,14.5 19,21" style="fill: white; stroke: white; stroke-width: 1.5px; stroke-linejoin: round;"></polygon></svg>
                <button id="pdfjs-zoom-out">−</button>
                <select id="pdfjs-scale">
                    <option value="0.5">50%</option>
                    <option value="0.75">75%</option>
                    <option value="1.0">100%</option>
                    <option value="1.5" selected>150%</option>
                    <option value="2.0">200%</option>
                    <option value="2.5">250%</option>
                </select>
                <button id="pdfjs-zoom-in">+</button>
                <button id="pdfjs-bookmark-toggle" class="pdfjs-bookmark-btn" title="Bookmarks"><img src="capicon/svg/355.svg" alt="Bookmarks" style="width: 16px; height: 16px; filter: invert(1); vertical-align: middle;"></button>
            </div>
            <div id="pdfjs-bookmark-panel">
                <div class="pdfjs-bookmark-add">
                    <input type="text" id="pdfjs-bookmark-name" placeholder="Bookmark name" maxlength="40">
                    <button id="pdfjs-bookmark-add-btn">+</button>
                </div>
                <ul id="pdfjs-bookmark-list"></ul>
            </div>
            <div id="pdfjs-viewer-content" style="position: relative; overflow: auto; height: 800px;">
                <!-- Pages will be rendered here -->
            </div>
        </div>
    `;

    container.innerHTML = html;

    // Attach event listeners
    document.getElementById('pdfjs-prev-page').addEventListener('click', () => {
        if (window.PDFViewer.currentPage > 1) {
            renderPage(window.PDFViewer.currentPage - 1);
        }
    });

    document.getElementById('pdfjs-next-page').addEventListener('click', () => {
        if (window.PDFViewer.currentPage < window.PDFViewer.totalPages) {
            renderPage(window.PDFViewer.currentPage + 1);
        }
    });

    document.getElementById('pdfjs-page-num').addEventListener('change', (e) => {
        const pageNum = parseInt(e.target.value);
        if (pageNum >= 1 && pageNum <= window.PDFViewer.totalPages) {
            renderPage(pageNum);
        }
    });

    document.getElementById('pdfjs-scale').addEventListener('change', (e) => {
        window.PDFViewer.scale = parseFloat(e.target.value);
        clearPageCache();  // cached canvases are at the previous scale
        renderPage(window.PDFViewer.currentPage);
    });

    document.getElementById('pdfjs-zoom-out').addEventListener('click', () => {
        const select = document.getElementById('pdfjs-scale');
        const currentIndex = select.selectedIndex;
        if (currentIndex > 0) {
            select.selectedIndex = currentIndex - 1;
            select.dispatchEvent(new Event('change'));
        }
    });

    document.getElementById('pdfjs-zoom-in').addEventListener('click', () => {
        const select = document.getElementById('pdfjs-scale');
        const currentIndex = select.selectedIndex;
        if (currentIndex < select.options.length - 1) {
            select.selectedIndex = currentIndex + 1;
            select.dispatchEvent(new Event('change'));
        }
    });
}

// Build the DOM (canvas + text layer + annotation layer) for a page, fully rendered.
// Does NOT insert into the live DOM — the caller decides when to attach.
async function buildPageDom(pageNum) {

    const page = await window.PDFViewer.pdfDoc.getPage(pageNum);
    const viewport = page.getViewport({ scale: window.PDFViewer.scale });

    const canvasContainer = document.createElement('div');
    canvasContainer.className = 'pdfjs-canvas-container';
    canvasContainer.dataset.pageNum = pageNum;
    canvasContainer.style.width = viewport.width + 'px';
    canvasContainer.style.height = viewport.height + 'px';

    const canvas = document.createElement('canvas');
    canvas.className = 'pdfjs-page-canvas';
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    canvasContainer.appendChild(canvas);

    const textLayer = document.createElement('div');
    textLayer.className = 'pdfjs-text-layer';
    textLayer.style.width = viewport.width + 'px';
    textLayer.style.height = viewport.height + 'px';
    canvasContainer.appendChild(textLayer);

    const annotationLayer = document.createElement('div');
    annotationLayer.className = 'pdfjs-annotation-layer';
    annotationLayer.id = 'pdfjs-annotation-layer';
    canvasContainer.appendChild(annotationLayer);

    // Rasterize the page + fetch text content in parallel
    const [_renderResult, textContent] = await Promise.all([
        page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise,
        page.getTextContent()
    ]);

    buildTextLayer(textContent, viewport, textLayer);
    textLayer.addEventListener('copy', handleTextCopy);

    return canvasContainer;
}

// Build the text layer spans using a DocumentFragment so the browser
// only reflows once instead of once per item.
function buildTextLayer(textContent, viewport, textLayer) {

    // Merge accent items with the preceding base letter
    const mergedItems = [];
    const items = textContent.items;
    const len = items.length;
    let i = 0;
    while (i < len) {
        const currentItem = items[i];
        let mergedStr = currentItem.str;
        if (i + 1 < len && mergedStr.length > 0) {
            const nextStr = items[i + 1].str;
            if (isAccent(nextStr)) {
                const lastChar = mergedStr[mergedStr.length - 1];
                const combined = combineWithAccent(lastChar, nextStr);
                mergedStr = mergedStr.substring(0, mergedStr.length - 1) + combined;
                i++;
            }
        }
        mergedItems.push({
            str: mergedStr.normalize('NFC'),
            transform: currentItem.transform
        });
        i++;
    }

    const fragment = document.createDocumentFragment();
    const scale = viewport.scale;
    const viewportHeight = viewport.height;
    for (const item of mergedItems) {
        const span = document.createElement('span');
        span.textContent = item.str;
        const tx = item.transform;
        const x = tx[4] * scale;
        const y = tx[5] * scale;
        const fontSize = Math.sqrt(tx[2] * tx[2] + tx[3] * tx[3]) * scale;
        const topPosition = viewportHeight - y - (fontSize * 0.85);
        const style = span.style;
        style.position = 'absolute';
        style.left = x + 'px';
        style.top = topPosition + 'px';
        style.fontSize = fontSize + 'px';
        style.fontFamily = 'sans-serif';
        fragment.appendChild(span);
    }
    textLayer.appendChild(fragment);
}

// Returns the DOM for a page, from cache if available, else builds+caches.
// Deduplicates concurrent calls (e.g. prefetch racing with a user click).
function getOrBuildPageDom(pageNum) {
    const cached = cacheGet(pageNum);
    if (cached) return Promise.resolve(cached);
    if (pendingBuilds.has(pageNum)) return pendingBuilds.get(pageNum);
    const promise = buildPageDom(pageNum).then(el => {
        cacheSet(pageNum, el);
        pendingBuilds.delete(pageNum);
        return el;
    }).catch(err => {
        pendingBuilds.delete(pageNum);
        throw err;
    });
    pendingBuilds.set(pageNum, promise);
    return promise;
}

// Pre-render neighboring pages during browser idle time so the next click
// becomes an instant cache hit.
function schedulePrefetch(currentPageNum) {
    const total = window.PDFViewer.totalPages;
    const candidates = [currentPageNum + 1, currentPageNum - 1]
        .filter(n => n >= 1 && n <= total && !pageCache.has(n) && !pendingBuilds.has(n));
    if (candidates.length === 0) return;
    const run = () => {
        for (const n of candidates) {
            getOrBuildPageDom(n).catch(err => console.warn('Prefetch failed for page', n, err));
        }
    };
    if (typeof requestIdleCallback === 'function') {
        requestIdleCallback(run, { timeout: 1000 });
    } else {
        setTimeout(run, 200);
    }
}

// Render a specific page into the viewer container.
async function renderPage(pageNum) {

    if (window.PDFViewer.rendering) return;

    window.PDFViewer.rendering = true;
    window.PDFViewer.currentPage = pageNum;

    if (window.closeAnnotationPanel) {
        window.closeAnnotationPanel();
    }

    try {
        const container = document.getElementById('pdfjs-viewer-content');
        const canvasContainer = await getOrBuildPageDom(pageNum);

        // Detach previously-displayed page from the live DOM.
        // If it was cached, it stays alive in pageCache — revisiting it is free.
        container.innerHTML = '';
        container.appendChild(canvasContainer);

        document.getElementById('pdfjs-page-num').value = pageNum;
        document.getElementById('pdfjs-prev-page').disabled = (pageNum === 1);
        document.getElementById('pdfjs-next-page').disabled = (pageNum === window.PDFViewer.totalPages);

        if (window.annotationSystem && window.annotationSystem.active) {
            window.reloadPDFAnnotations();
        }

        // Persist the current page as the auto-resume target (debounced)
        scheduleSaveLastPage(pageNum);

    } catch (error) {
        console.error('Error rendering page:', error);
    } finally {
        window.PDFViewer.rendering = false;

        if (window.annotationSystem && window.annotationSystem.active) {
            setTimeout(function() {
                $('.pdfjs-page-canvas, .pdfjs-text-layer, #pdfjs-annotation-layer').css('cursor', 'crosshair');
            }, 100);
        }

        schedulePrefetch(pageNum);
    }
}

// Make functions globally available
window.initPDFViewer = initPDFViewer;
window.renderPage = renderPage;

console.log('PDF.js viewer module loaded');

</script>
