
<script>

/*

Deal with a given folder

*/

// Define these variables and functions OUTSIDE of socket.on('make_elems')
// to avoid re-registration issues

String.prototype.format = function () {
      var i = 0, args = arguments;
      return this.replace(/{}/g, function () {
        return typeof args[i] != 'undefined' ? args[i++] : '';
      });
    };

// ebook extension
function ebook_ext(name) {
  return /\.(pdf|djvu|epub)$/i.test(name);
}

// image extension
function image_ext(name) {
  return /\.(png|jpg|webp)$/i.test(name);
}

// video extension
function video_ext(name) {
  return /\.(mp4|webm|ogg|mkv|avi)$/i.test(name);
}

function sort_list_pattern(array, list){
      /*
      Sort a list with patterns..
      */
      var arr = new Array(array.length);
      var supp_list = []
      for ( var i in array ){
          var ind = index_in_list(array[i], list)
          if ( ind != null ){
              arr[ind] = array[i]
          }
          else{
             supp_list.push(array[i])
          }
      }
      new_arr = []
      for ( var i in arr ){
          if ( arr[i].length >0 ){
            new_arr.push(arr[i])
          }
      }
      var arr = [...supp_list, ...new_arr]
      return arr
    }

var pdf_months = ['_janv_', '_fev_', '_mars_', '_avr_', '_mai_',
                  '_juin_', '_juill_', '_aout_', '_sept_', '_oct_',
                  '_nov_', '_dec_']

function index_in_list(a, list){
    for ( var i in list ){
          var m = a.match(list[i])
          if (m != null){
              var ind = list.indexOf(m[0]);
              break;
              }
            ind = m
          } // for
    return ind
    }

// Global state variables
var extract_folder_count_pdf = 0;
var extract_folder_current_li = {}
var extract_folder_addr_relat = []
var extract_folder_addr_abs = []
var extract_folder_toggle_elem_ok = false
var extract_folder_trig_epub = false
var extract_folder_trig_djvu = false
var extract_folder_initialized = false  // Guard to prevent multiple initializations

// Register folder_extract listener ONCE, outside of make_elems
// Track which counts have been processed to avoid duplicates
var extract_folder_processed_counts = {}

socket.on('folder_extract', function( strap_addr ){

    console.log('[extract_folder] Received folder_extract response:', strap_addr.substring(0, 200))
    var current_count = parseInt( strap_addr.split('§§')[0] )
    strap_addr = strap_addr.split('§§')[1]
    console.log('[extract_folder] current_count:', current_count, 'files:', strap_addr)

    // Guard: check if this count was already processed
    if (extract_folder_processed_counts[current_count]) {
        console.log('[extract_folder] Count', current_count, 'already processed, skipping')
        return
    }

    // Guard: check if the li element exists
    if (!extract_folder_current_li[current_count]) {
        console.log('[extract_folder] No li element for count', current_count, ', skipping')
        return
    }

    extract_folder_processed_counts[current_count] = true

    var new_ul = $('<ul/>')

    extract_folder_current_li[current_count].parent().find('ul, .tog_elem, .fold_epub, .fold_djvu').remove();

    var list_pdf = strap_addr.split('\n').slice(0,-1) // list of pdfs..
    console.log('[extract_folder] list_pdf:', list_pdf)

    // sorted list
    var sorted_list = sort_list_pattern(list_pdf, pdf_months)
    console.log('[extract_folder] sorted_list:', sorted_list)

    handle_docs(sorted_list, new_ul, current_count)

}) // socket on folder_extract

// open_epub and open_djvu are defined outside make_elems since they're called from handle_docs
function open_epub(){
      /*
      Open the epub file
      */
      $('.fold_epub').off('click').on('click', function(){
          var disp = $(this).parent().next()
          var obj = disp.find('object')
          var addr = obj.attr('data').split('? ')[0]
          var li = disp.parent().parent()
          if ( addr.search(/\.epub/ ) != -1){
                make_epub(li, addr)
          }
      }) // click
}

function open_djvu(){
        /*
        Open the djvu file
        */
        $('.fold_djvu').off('click').on('click', function(){
            var disp = $(this).parent().next()
            var obj = disp.find('object')
            var addr = obj.attr('data').split('? ')[0]
            var li = disp.parent().parent()
            if ( addr.search(/\.djvu/) != -1 ){
                  make_djvu(li, addr)
            }
        }) // click
}

socket.on('make_elems', function(){

    console.log('[extract_folder] Received make_elems signal')

    // Guard: only run once per page load
    if (extract_folder_initialized) {
        console.log('[extract_folder] Already initialized, skipping')
        return
    }
    extract_folder_initialized = true

    var all_li = $('li');
    console.log('[extract_folder] Scanning', all_li.length, 'li elements for !fold pattern')

    all_li.each(function(){

        /*

        Make the list of pdfs..
        Replace !fold by the list in question..
        Skip if !fold is followed by !inside (handled by list_folders_for_extract)

        */

        var reg = /\!fold/
        var reg_inside = /\!fold.+\!inside/  // Skip patterns handled by list_folders_for_extract

        var txt = $(this).html().split('\n')[0]

        // Skip if this is a !fold...!inside pattern (handled by list_folders_for_extract)
        if ( txt.match(reg_inside) ){
            console.log('[extract_folder] Skipping !fold...!inside pattern:', txt.substring(0, 100))
            return true  // continue to next iteration
        }

        if ( txt.match(reg) ){

            console.log('[extract_folder] Found !fold in:', txt.substring(0, 100))
            extract_folder_current_li[extract_folder_count_pdf] = $(this)
            var addr = txt.split('!fold')[1].trim()
            console.log('[extract_folder] Extracted address:', addr)
            addr_short = addr.split('/').slice(1).join('/')
            extract_folder_addr_relat[extract_folder_count_pdf] = relative_addr(addr, addr_short)
            extract_folder_addr_abs[extract_folder_count_pdf] = absolute_addr(addr)
            extract_folder_count_pdf += 1
            var count = extract_folder_count_pdf-1
            addr_sent = addr + '§§' + count
            console.log('[extract_folder] Emitting folder_extract:', addr_sent)
            socket.emit('folder_extract', addr + '§§' + count)


            } // if text.match

      }) // li each


}) // socket.on('make_elems')

// handle_docs is now OUTSIDE socket.on('make_elems') to be accessible from folder_extract listener
function handle_docs(sorted_list, new_ul, current_count){

          /*

          Deals with pdf, epub or djvu..

          */

          var first_elem = sorted_list[0]
          console.log('[extract_folder] handle_docs - first_elem:', first_elem)
          console.log('[extract_folder] handle_docs - ebook_ext result:', ebook_ext(first_elem))
          console.log('[extract_folder] handle_docs - addr_relat[current_count]:', extract_folder_addr_relat[current_count])
          console.log('[extract_folder] handle_docs - addr_abs[current_count]:', extract_folder_addr_abs[current_count])

          // detect ebook

          if ( ebook_ext(first_elem) ){
              console.log('[extract_folder] Processing as ebook, calling make_li_embed for each file')
              // Use addr_abs instead of addr_relat for web-accessible paths
              var web_path = extract_folder_addr_abs[current_count]
              console.log('[extract_folder] Using web_path:', web_path)
              sorted_list.forEach( function(elem){
                              make_li_embed(web_path, elem, new_ul)
                         })
              }

          // detect image

          else if ( image_ext(first_elem) ){

              var divportf = $('<div/>').addClass("row")
              sorted_list.forEach( function(elem){
                              divportf = make_li_imgs(divportf, elem, current_count)
                         })
               new_ul.append( divportf )

          }

          // detect video

          else if ( video_ext(first_elem) ){
              console.log('[extract_folder] Processing as video, calling make_li_video for each file')
              var web_path = extract_folder_addr_abs[current_count]
              console.log('[extract_folder] Using web_path for videos:', web_path)
              sorted_list.forEach( function(elem){
                              make_li_video(web_path, elem, new_ul)
                         })
          }
          //alert(sorted_list)
          // Check if this is inside a !fold...!inside structure (has .funf sibling with [+])
          var parentLi = extract_folder_current_li[current_count].parent().parent()
          var funfSpan = parentLi.find('> a > .funf')
          if (funfSpan.length > 0 && funfSpan.text().trim() === '[+]') {
              // This is a closed subfolder, keep it hidden
              new_ul.hide()
              console.log('[extract_folder] Hiding new_ul because parent has [+]')
          }
          // replace the tag with the list of li embed..
          extract_folder_current_li[current_count].parent().replaceWith(new_ul)
          if ( current_count == Object.keys(extract_folder_current_li).length-1 & !extract_folder_toggle_elem_ok){
              toggle_elem()            // when clicking on - or + open or close..
              extract_folder_toggle_elem_ok = true
          }

          $('figure').off('click').on('click', function(){
              if ($(this).parent().hasClass('thumbnail')){
                  //alert('figgg')
                  var addr_pic = $(this).find('img').attr('src')
                  if (one_img){

                      reset_bigpic()

                  }
                  if ( pic_yet_open.indexOf(addr_pic) == -1 ){

                      add_new_bigpic(addr_pic)
                      hook_slider()
                      save_pos_drag()

                     }
              }
          })


          // Note: epub and djvu handling is now integrated into toggle_elem()
          // The old open_epub() and open_djvu() functions are kept for backwards compatibility
          // but are no longer needed for !fold extracted files

} // end handle_docs

function relative_addr(addr, addr_short){

          /*

          Relative address, address used in the html code

          */

          try {
            var reg = /\.{2}\/\w+.+\//     // pattern ../aaa
            root = addr.match(reg)[0]      // root
            addr = addr.split(root)[1]     // remove the root
          }
          catch{
            //alert('...nothing found...')
            addr = addr_short
          }
          return addr
    }

    function absolute_addr(addr){

          /*

          Absolute address, address used in the html code
          Returns the web-accessible path (absolute URL starting with /)

          */

          // Helper to ensure leading slash
          function ensureLeadingSlash(path) {
              return path.startsWith('/') ? path : '/' + path
          }

          // For sdata pattern - keep full path after sdata/
          var reg_sdata = /sdata\/\w+.+/     // pattern /sdata/balblabla
          var match = addr.match(reg_sdata)
          if (match) {
              return ensureLeadingSlash(match[0])
          }

          // For public pattern - remove "public/" prefix since Express serves public/ at root
          // /home/.../public/pdfs -> pdfs (accessible via /pdfs/)
          var reg_public = /public\/(.+)/   // capture everything after public/
          match = addr.match(reg_public)
          if (match) {
              console.log('[extract_folder] absolute_addr: matched public/, returning:', match[1])
              return ensureLeadingSlash(match[1])
          }

          // Fallback: return the address with leading slash
          return ensureLeadingSlash(addr)
    }


    function make_li_embed(addr, elem, new_ul){

          /*

          List of files with embedding..
          Full address is addr + '/' + elem

          */
          console.log('[extract_folder] make_li_embed - addr:', addr, 'elem:', elem)
          var full_path = addr + '/' + elem
          console.log('[extract_folder] make_li_embed - full_path:', full_path)

          // Extract name without extension for any ebook type
          var display_name = elem.replace(/\.(pdf|epub|djvu)$/i, '')

          var div_format = $('<div/>').text(display_name).addClass('embed_pdf')
          var a_deploy = $('<a/>').text(' [+]')  // Start with [+] since content is hidden
          var span_tog = $('<span/>').addClass('tog_elem').append(a_deploy)

          var obj_html = ''

          // case epub
          if ( elem.search(/\.epub$/i ) != -1){
              a_deploy.addClass('fold_epub')
              // Create epub-specific container
              var viewerId = 'epub-viewer-' + Date.now() + '-' + Math.floor(Math.random() * 1000)
              obj_html = '<br><div class="lazy-epub-container" id="' + viewerId + '" data-epub-path="' + full_path + '" data-loaded="false" style="width: 100%; margin: 10px 0;">' +
                        '<div class="lazy-epub-viewer" style="display: none;"></div>' +
                        '</div><br>'
          }
          // case djvu
          else if ( elem.search(/\.djvu$/i ) != -1){
              a_deploy.addClass('fold_djvu')
              // Create djvu-specific container
              var viewerId = 'djvu-viewer-' + Date.now() + '-' + Math.floor(Math.random() * 1000)
              obj_html = '<br><div class="lazy-djvu-container" id="' + viewerId + '" data-djvu-path="' + full_path + '" data-loaded="false" style="width: 100%; margin: 10px 0;">' +
                        '<div class="lazy-djvu-viewer" style="display: none;"></div>' +
                        '</div><br>'
          }
          // case pdf (default)
          else {
              obj_html = embed_elem(full_path)
          }

          var divformat_plus = div_format.append(span_tog)
          var div_obj = $('<div/>').html(obj_html).hide()
          var curr_li = $('<li/>').addClass('fold_li')
          new_ul.append( curr_li.append( divformat_plus.append( div_obj ) ) )


    }

    function make_li_video(addr, elem, new_ul){

          /*

          List of video files with lazy loading.
          Full address is addr + '/' + elem

          */
          console.log('[extract_folder] make_li_video - addr:', addr, 'elem:', elem)
          var full_path = addr + '/' + elem
          console.log('[extract_folder] make_li_video - full_path:', full_path)

          // Get video name without extension
          var video_name = elem.replace(/\.(mp4|webm|ogg|mkv|avi)$/i, '')

          var div_format = $('<div/>').text(video_name).addClass('embed_video')
          var a_deploy = $('<a/>').text(' [+]')  // Start with [+] since video is hidden
          var span_tog = $('<span/>').addClass('tog_elem tog_video').append(a_deploy)

          // Create lazy loading placeholder for video
          var viewerId = 'video-viewer-' + Date.now() + '-' + Math.floor(Math.random() * 1000)
          var video_container = '<br><div class="lazy-video-container" id="' + viewerId + '" data-video-path="' + full_path + '" data-loaded="false" style="width: 100%; margin: 10px 0;">' +
                    '<div class="lazy-video-viewer" style="display: none;"></div>' +
                    '</div><br>'

          var divformat_plus = div_format.append(span_tog)
          var div_obj = $('<div/>').html(video_container).hide()
          var curr_li = $('<li/>').addClass('fold_li fold_video')
          new_ul.append( curr_li.append( divformat_plus.append( div_obj ) ) )

    }

    function toggle_elem(){

        /*

        Code for closing, opening the pdfs, videos, epubs and djvus.
        Lazy loading: content is loaded when user clicks [+] to open
        Note: We use <object> for PDFs, <video> for videos, and call make_epub/make_djvu for epubs/djvus.

        */

        $('.tog_elem').off('click').on('click', function(){

                var taga = $(this).find('a')
                var $pdfContainer = $(this).next().find('.lazy-pdfjs-container')
                var $videoContainer = $(this).next().find('.lazy-video-container')
                var $epubContainer = $(this).next().find('.lazy-epub-container')
                var $djvuContainer = $(this).next().find('.lazy-djvu-container')

                if (taga.text() == ' [-]'){
                    // Closing - just hide
                    taga.text(' [+]')
                    $(this).next().hide()

                } else {
                    // Opening - show and lazy load content if not already loaded
                    taga.text(' [-]')
                    $(this).next().show()

                    // Lazy load PDF with <object> tag
                    if ($pdfContainer.length > 0) {
                        var isLoaded = $pdfContainer.data('loaded')
                        if (!isLoaded || isLoaded === 'false') {
                            var pdfPath = $pdfContainer.data('pdf-path')
                            var $viewer = $pdfContainer.find('.lazy-pdfjs-viewer')

                            var obj = $('<object/>').attr('data', pdfPath)
                                                    .attr('type', 'application/pdf')
                                                    .attr('width', '100%')
                                                    .attr('height', '800px')
                            $viewer.empty().append(obj)
                            $viewer.show()
                            $pdfContainer.data('loaded', 'true')
                        }
                    }

                    // Lazy load Video with <video> tag
                    if ($videoContainer.length > 0) {
                        var isLoaded = $videoContainer.data('loaded')
                        if (!isLoaded || isLoaded === 'false') {
                            var videoPath = $videoContainer.data('video-path')
                            var $viewer = $videoContainer.find('.lazy-video-viewer')

                            var video = $('<video/>').attr('src', videoPath)
                                                     .attr('controls', true)
                                                     .attr('width', '100%')
                                                     .attr('style', 'max-width: 800px;')
                            $viewer.empty().append(video)
                            $viewer.show()
                            $videoContainer.data('loaded', 'true')
                        }
                    }

                    // Lazy load EPUB
                    if ($epubContainer.length > 0) {
                        var isLoaded = $epubContainer.data('loaded')
                        if (!isLoaded || isLoaded === 'false') {
                            var epubPath = $epubContainer.data('epub-path')
                            var $viewer = $epubContainer.find('.lazy-epub-viewer')

                            // Create epub content inline (don't use make_epub which replaces the li)
                            var epub_id = epubPath.split('/').at(-1).split('.epub')[0]
                            var block_epub = $('<div/>')
                            block_epub.append($('<div/>').attr('id', epubPath))
                                      .append($('<span/>').text('page 0 ').attr('id','first_page'+epub_id))
                                      .append($('<span/>').text('< prev').attr('id','prev_page'+epub_id))
                                      .append($('<span/>').text('.    .'))
                                      .append($('<span/>').text('next >').attr('id','next_page'+epub_id))
                                      .append($('<span/>').text('   '))
                                      .append($('<input/>').text('').attr('id','num_page'+epub_id).css({'width':'30px'}))
                                      .append($('<button/>').text('go').attr('id','go_page'+epub_id))
                                      .append($('<span/>').text('   curr page: '))
                                      .append($('<span/>').text('').attr('id','curr_page'+epub_id))
                                      .append($('<div/>'))
                                      .append($('<span/>').text('< ').attr('id','font_down'+epub_id))
                                      .append($('<span/>').text('> ').attr('id','font_up'+epub_id))
                                      .append($('<span/>').text('font percent: '))
                                      .append($('<span/>').text('').attr('id','font_percent'+epub_id))

                            $viewer.empty().append(block_epub)
                            $viewer.show()

                            // Initialize epub.js
                            if (typeof ePub !== 'undefined') {
                                var book = ePub(epubPath)
                                var rendition = book.renderTo(epubPath, {
                                    flow: "scrolled-doc",
                                    width: 600,
                                    height: 660
                                })
                                rendition.display()

                                // Navigation handlers
                                $('#first_page' + epub_id).click(function(){ rendition.display(0) })
                                $('#next_page' + epub_id).click(function(){ rendition.next() })
                                $('#prev_page' + epub_id).click(function(){ rendition.prev() })
                                $('#go_page' + epub_id).click(function(){
                                    var num = parseInt($('#num_page'+epub_id).val())
                                    rendition.display(num)
                                })
                                $('#font_up' + epub_id).click(function(){
                                    if (typeof incrFont === 'function') incrFont(rendition)
                                })
                                $('#font_down' + epub_id).click(function(){
                                    if (typeof decrFont === 'function') decrFont(rendition)
                                })
                            }

                            $epubContainer.data('loaded', 'true')
                        }
                    }

                    // Lazy load DJVU
                    if ($djvuContainer.length > 0) {
                        var isLoaded = $djvuContainer.data('loaded')
                        if (!isLoaded || isLoaded === 'false') {
                            var djvuPath = $djvuContainer.data('djvu-path')
                            var $viewer = $djvuContainer.find('.lazy-djvu-viewer')

                            // Create djvu content inline (don't use make_djvu which replaces the li)
                            var djvu_id = 'djvu-' + Date.now()
                            var djvuDiv = $('<div/>').attr('id', djvu_id)
                            $viewer.empty().append(djvuDiv)
                            $viewer.show()

                            // Initialize DjVu viewer
                            if (typeof DjVu !== 'undefined' && DjVu.Viewer) {
                                var viewer_instance = new DjVu.Viewer()
                                viewer_instance.render(document.getElementById(djvu_id))
                                viewer_instance.loadDocumentByUrl(djvuPath)
                            }

                            $djvuContainer.data('loaded', 'true')
                        }
                    }
                }
            })
    }

    function embed_elem(addr){         // embedded pdf..

        /*

        addr : folder + pdf name..

        Lazy loading: creates a placeholder container. The PDF viewer will only be
        initialized when the user clicks the [-]/[+] toggle button.

        */

        // Create unique ID for this PDF viewer
        var viewerId = 'pdf-viewer-' + Date.now() + '-' + Math.floor(Math.random() * 1000);

        // Create lazy loading placeholder (no button - triggered by toggle click)
        var htm = '<br><div class="lazy-pdfjs-container" id="{}" data-pdf-path="{}" data-loaded="false" style="width: 100%; margin: 10px 0;">' +
                  '<div class="lazy-pdfjs-viewer" style="display: none; min-height: 800px;"></div>' +
                  '</div><br>';

        return htm.format(viewerId, addr);

    }

    // Global function to lazy load PDF viewer
    window.lazyLoadPDFViewer = function(btn) {
        var $btn = $(btn);
        var $container = $btn.closest('.lazy-pdfjs-container');
        var $viewer = $container.find('.lazy-pdfjs-viewer');
        var pdfPath = $container.data('pdf-path');
        var viewerId = $container.attr('id');
        var isLoaded = $container.data('loaded');

        if (!isLoaded || isLoaded === 'false') {
            // First click: initialize the PDF viewer
            $btn.text('Chargement...');
            $btn.prop('disabled', true);

            // Give the viewer div a unique ID for PDF.js
            var innerViewerId = viewerId + '-inner';
            $viewer.attr('id', innerViewerId);

            // Show the viewer container
            $viewer.slideDown(300, function() {
                // Initialize PDF.js viewer
                if (pdfPath && window.initPDFViewer) {
                    window.initPDFViewer(pdfPath, innerViewerId);
                    $container.data('loaded', 'true');
                    $btn.text('Masquer le PDF');
                    $btn.prop('disabled', false);
                } else {
                    // Fallback to object tag if PDF.js not available
                    var obj = $('<object/>').attr('data', pdfPath)
                                            .attr('type', 'application/pdf')
                                            .attr('width', '100%')
                                            .attr('height', '800px');
                    $viewer.append(obj);
                    $container.data('loaded', 'true');
                    $btn.text('Masquer le PDF');
                    $btn.prop('disabled', false);
                }
            });
        } else if ($viewer.is(':visible')) {
            // PDF loaded and visible: hide it
            $viewer.slideUp(300);
            $btn.text('Afficher le PDF');
        } else {
            // PDF loaded but hidden: show it
            $viewer.slideDown(300);
            $btn.text('Masquer le PDF');
        }
    };


function make_li_imgs(divportf, elem, current_count){

      /*

      Portfolio

      */
      var $img = $("<img>", {
                    src: extract_folder_addr_abs[current_count] + '/' + elem,
                    alt: elem,
                  });
      var $caption = $("<figcaption>").text(elem);
      var $fig = $("<figure>")
      $fig.append($img).append($caption)

      var classportf = "col-md-4"

       var divportfinner = $('<div/>').addClass(classportf)
           .append(
                 $('<div/>').addClass("thumbnail")   // class thumbnail
                   .append($fig) // add image
                  ) // end append thumbnail
        divportf.append(divportfinner)


        return divportf
      }

</script>
