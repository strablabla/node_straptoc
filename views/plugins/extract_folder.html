
<script>

/*

Deal with a given folder — unified !fold handler.
Supports files (pdf, epub, djvu, images, videos) directly in folder,
in subfolders, and recursively in sub-subfolders.

*/

// Define these variables and functions OUTSIDE of socket.on('make_elems')
// to avoid re-registration issues

String.prototype.format = function () {
      var i = 0, args = arguments;
      return this.replace(/{}/g, function () {
        return typeof args[i] != 'undefined' ? args[i++] : '';
      });
    };

// ebook extension
function ebook_ext(name) {
  return /\.(pdf|djvu|epub)$/i.test(name);
}

// image extension
function image_ext(name) {
  return /\.(png|jpg|webp)$/i.test(name);
}

// video extension
function video_ext(name) {
  return /\.(mp4|webm|ogg|mkv|avi)$/i.test(name);
}

// any supported file extension
function supported_ext(name) {
  return ebook_ext(name) || image_ext(name) || video_ext(name);
}

function sort_list_pattern(array, list){
      /*
      Sort a list with patterns..
      Multiple files can share the same pattern bucket (e.g. dpls_fev_ and pls_fev_),
      so each bucket is an array; within a bucket, files are sorted alphabetically.
      */
      var buckets = []
      for ( var k = 0; k < list.length; k++ ) buckets.push([])
      var supp_list = []
      for ( var i in array ){
          var ind = index_in_list(array[i], list)
          if ( ind != null ){
              buckets[ind].push(array[i])
          }
          else{
             supp_list.push(array[i])
          }
      }
      var new_arr = []
      for ( var i = 0; i < buckets.length; i++ ){
          if ( buckets[i].length > 0 ){
              buckets[i].sort()
              new_arr = new_arr.concat(buckets[i])
          }
      }
      return [...supp_list, ...new_arr]
    }

var pdf_months = ['_janv_', '_fev_', '_mars_', '_avr_', '_mai_',
                  '_juin_', '_juill_', '_aout_', '_sept_', '_oct_',
                  '_nov_', '_dec_']

function index_in_list(a, list){
    for ( var i in list ){
          var m = a.match(list[i])
          if (m != null){
              var ind = list.indexOf(m[0]);
              break;
              }
            ind = m
          } // for
    return ind
    }

// Global state for folder_scan
var fold_scan_count = 0
var fold_scan_data = {}       // count -> { li, addr, addr_abs }
var fold_scan_initialized = false
var fold_scan_processed = {}  // Guard against duplicates

// =====================================================================
// folder_scan listener — handles typed entries (f: files, d: directories)
// =====================================================================

socket.on('folder_scan', function(strap_addr){

    var current_count = parseInt(strap_addr.split('§§')[0])
    strap_addr = strap_addr.split('§§')[1]

    // Guard: duplicates
    if (fold_scan_processed[current_count]) return
    fold_scan_processed[current_count] = true

    // Guard: check entry exists
    if (!fold_scan_data[current_count]) return

    var entry = fold_scan_data[current_count]
    var entries = strap_addr ? strap_addr.split('\n').filter(function(e){ return e.length > 0 }) : []

    // Separate files and directories
    var files = []
    var dirs = []
    entries.forEach(function(e){
        if (e.startsWith('d:')) {
            dirs.push(e.substring(2))
        } else if (e.startsWith('f:')) {
            files.push(e.substring(2))
        } else {
            files.push(e)  // fallback: treat as file
        }
    })

    // Filter only supported file types
    var supported_files = files.filter(function(f){ return supported_ext(f) })

    // Sort supported files
    var sorted_files = sort_list_pattern(supported_files, pdf_months)

    // Sort directories alphabetically
    dirs.sort(function(a, b){ return a.localeCompare(b) })

    // Build the content
    var container_ul = $('<ul/>')

    // --- Add directories as expandable items ---
    dirs.forEach(function(dir_name){
        var dir_li = $('<li/>')
        var dir_addr = entry.addr + '/' + dir_name
        var dir_addr_abs = entry.addr_abs + '/' + dir_name

        // Title with [+] toggle
        var title_span = $('<span/>').text(dir_name + ' ')
        var toggle_a = $('<a/>').append($('<span/>').addClass('funf-scan').text('[+]'))
        title_span.append(toggle_a)
        dir_li.append(title_span)

        // Hidden sub-container (will be filled on click)
        var sub_ul = $('<ul/>').hide()
        sub_ul.attr('data-fold-addr', dir_addr)
        sub_ul.attr('data-fold-addr-abs', dir_addr_abs)
        sub_ul.attr('data-fold-loaded', 'false')
        dir_li.append(sub_ul)

        container_ul.append(dir_li)
    })

    // --- Add files ---
    if (sorted_files.length > 0) {
        var first_file = sorted_files[0]
        var web_path = entry.addr_abs

        if (ebook_ext(first_file)) {
            sorted_files.forEach(function(elem){
                make_li_embed(web_path, elem, container_ul)
            })
        } else if (image_ext(first_file)) {
            var divportf = $('<div/>').addClass("row")
            sorted_files.forEach(function(elem){
                divportf = make_li_imgs_scan(divportf, elem, web_path)
            })
            container_ul.append(divportf)
        } else if (video_ext(first_file)) {
            sorted_files.forEach(function(elem){
                make_li_video(web_path, elem, container_ul)
            })
        }
    }

    // Replace the original element
    var target_li = entry.li
    if (target_li) {
        target_li.parent().replaceWith(container_ul)
    }

    // Bind toggle for this batch
    bind_fold_scan_toggles()
    // Also bind file toggles
    toggle_elem()

}) // socket.on folder_scan

// =====================================================================
// Click handler for directory toggles — lazy loads subdirectory content
// =====================================================================

function bind_fold_scan_toggles(){
    $('.funf-scan').off('click').on('click', function(e){
        e.stopPropagation()
        var toggle_span = $(this)
        var sub_ul = toggle_span.closest('li').children('ul')

        if (toggle_span.text() === '[+]') {
            toggle_span.text('[-]')
            sub_ul.show()

            // Lazy load if not yet loaded
            if (sub_ul.attr('data-fold-loaded') === 'false') {
                sub_ul.attr('data-fold-loaded', 'true')
                var addr = sub_ul.attr('data-fold-addr')
                var addr_abs = sub_ul.attr('data-fold-addr-abs')

                // Create a placeholder li and request scan
                var placeholder_li = $('<li/>').text('...')
                sub_ul.append(placeholder_li)

                var count = fold_scan_count
                fold_scan_data[count] = {
                    li: placeholder_li,
                    addr: addr,
                    addr_abs: addr_abs
                }
                fold_scan_count++
                socket.emit('folder_scan', addr + '§§' + count)
            }
        } else {
            toggle_span.text('[+]')
            sub_ul.hide()
        }
    })
}

// =====================================================================
// make_elems — initial scan of !fold patterns in the document
// =====================================================================

socket.on('make_elems', function(){

    // Guard: only run once per page load
    if (fold_scan_initialized) return
    fold_scan_initialized = true

    var all_li = $('li');

    all_li.each(function(){

        /*
        Replace !fold by the folder content.
        Now handles everything: files directly, subfolders, sub-subfolders (recursively).
        !inside is no longer needed.
        */

        var reg = /\!fold/
        var txt = $(this).html().split('\n')[0]

        if ( txt.match(reg) ){

            // Extract path — strip !inside if present (backward compat)
            var addr = txt.split('!fold')[1]
            if (addr.indexOf('!inside') !== -1) {
                addr = addr.split('!inside')[0]
            }
            addr = addr.trim()

            var addr_short = addr.split('/').slice(1).join('/')
            var addr_abs = absolute_addr(addr)

            var count = fold_scan_count
            fold_scan_data[count] = {
                li: $(this),
                addr: addr,
                addr_abs: addr_abs
            }
            fold_scan_count++
            socket.emit('folder_scan', addr + '§§' + count)

        } // if text.match

    }) // li each

}) // socket.on('make_elems')

// =====================================================================
// File display helpers
// =====================================================================

function handle_docs(sorted_list, new_ul, current_count){
    // kept for backward compat if needed
}

function relative_addr(addr, addr_short){
      try {
        var reg = /\.{2}\/\w+.+\//     // pattern ../aaa
        root = addr.match(reg)[0]      // root
        addr = addr.split(root)[1]     // remove the root
      }
      catch{
        addr = addr_short
      }
      return addr
    }

    function absolute_addr(addr){

          /*
          Absolute address, address used in the html code
          Returns the web-accessible path (absolute URL starting with /)
          */

          function ensureLeadingSlash(path) {
              return path.startsWith('/') ? path : '/' + path
          }

          // For sdata pattern
          var reg_sdata = /sdata\/\w+.+/
          var match = addr.match(reg_sdata)
          if (match) {
              return ensureLeadingSlash(match[0])
          }

          // For public pattern
          var reg_public = /public\/(.+)/
          match = addr.match(reg_public)
          if (match) {
              return ensureLeadingSlash(match[1])
          }

          // Fallback
          return ensureLeadingSlash(addr)
    }


    function make_li_embed(addr, elem, new_ul){

          /*
          List of files with embedding..
          Full address is addr + '/' + elem
          */
          var full_path = addr + '/' + elem

          // Extract name without extension for any ebook type
          var display_name = elem.replace(/\.(pdf|epub|djvu)$/i, '')

          var div_format = $('<div/>').text(display_name).addClass('embed_pdf')

          // case pdf — opens in PDF.js modal on click, no inline embed
          if ( elem.search(/\.pdf$/i) != -1 ){
              div_format.css('cursor', 'pointer')
                        .attr('title', 'Open PDF')
                        .addClass('pdf-link')
                        .attr('data-pdf-path', full_path)
                        .on('click', function() {
                            if (window.annotationSystem) {
                                window.annotationSystem.currentFile = full_path;
                                window.annotationSystem.fileType = 'pdf';
                            }
                            if (window.openPDFViewer) {
                                window.openPDFViewer(full_path);
                                setTimeout(function() {
                                    if (window.socket) window.socket.emit('get_annotations', full_path);
                                    if (window.setupPDFJSAnnotationHandlers) window.setupPDFJSAnnotationHandlers();
                                    if (window.reloadPDFAnnotations) {
                                        setTimeout(function() { window.reloadPDFAnnotations(); }, 500);
                                    }
                                }, 1500);
                            } else {
                                console.error('PDF.js viewer not available');
                            }
                        })
              var curr_li = $('<li/>').addClass('fold_li')
              new_ul.append(curr_li.append(div_format))
              return
          }

          var a_deploy = $('<a/>').text(' [+]')
          var span_tog = $('<span/>').addClass('tog_elem').append(a_deploy)

          var obj_html = ''

          // case epub
          if ( elem.search(/\.epub$/i ) != -1){
              a_deploy.addClass('fold_epub')
              var viewerId = 'epub-viewer-' + Date.now() + '-' + Math.floor(Math.random() * 1000)
              obj_html = '<br><div class="lazy-epub-container" id="' + viewerId + '" data-epub-path="' + full_path + '" data-loaded="false" style="width: 100%; margin: 10px 0;">' +
                        '<div class="lazy-epub-viewer" style="display: none;"></div>' +
                        '</div><br>'
          }
          // case djvu
          else if ( elem.search(/\.djvu$/i ) != -1){
              a_deploy.addClass('fold_djvu')
              var viewerId = 'djvu-viewer-' + Date.now() + '-' + Math.floor(Math.random() * 1000)
              obj_html = '<br><div class="lazy-djvu-container" id="' + viewerId + '" data-djvu-path="' + full_path + '" data-loaded="false" style="width: 100%; margin: 10px 0;">' +
                        '<div class="lazy-djvu-viewer" style="display: none;"></div>' +
                        '</div><br>'
          }

          var divformat_plus = div_format.append(span_tog)
          var div_obj = $('<div/>').html(obj_html).hide()
          var curr_li = $('<li/>').addClass('fold_li')
          new_ul.append( curr_li.append( divformat_plus.append( div_obj ) ) )
    }

    function make_li_video(addr, elem, new_ul){

          /*
          List of video files with lazy loading.
          Full address is addr + '/' + elem
          */
          var full_path = addr + '/' + elem

          var video_name = elem.replace(/\.(mp4|webm|ogg|mkv|avi)$/i, '')

          var div_format = $('<div/>').text(video_name).addClass('embed_video')
          var a_deploy = $('<a/>').text(' [+]')
          var span_tog = $('<span/>').addClass('tog_elem tog_video').append(a_deploy)

          var viewerId = 'video-viewer-' + Date.now() + '-' + Math.floor(Math.random() * 1000)
          var video_container = '<br><div class="lazy-video-container" id="' + viewerId + '" data-video-path="' + full_path + '" data-loaded="false" style="width: 100%; margin: 10px 0;">' +
                    '<div class="lazy-video-viewer" style="display: none;"></div>' +
                    '</div><br>'

          var divformat_plus = div_format.append(span_tog)
          var div_obj = $('<div/>').html(video_container).hide()
          var curr_li = $('<li/>').addClass('fold_li fold_video')
          new_ul.append( curr_li.append( divformat_plus.append( div_obj ) ) )
    }

    function toggle_elem(){

        /*
        Code for closing, opening the pdfs, videos, epubs and djvus.
        Lazy loading: content is loaded when user clicks [+] to open
        */

        $('.tog_elem').off('click').on('click', function(){

                var taga = $(this).find('a')
                var $videoContainer = $(this).next().find('.lazy-video-container')
                var $epubContainer = $(this).next().find('.lazy-epub-container')
                var $djvuContainer = $(this).next().find('.lazy-djvu-container')

                if (taga.text() == ' [-]'){
                    taga.text(' [+]')
                    $(this).next().hide()

                } else {
                    taga.text(' [-]')
                    $(this).next().show()

                    // Lazy load Video
                    if ($videoContainer.length > 0) {
                        var isLoaded = $videoContainer.data('loaded')
                        if (!isLoaded || isLoaded === 'false') {
                            var videoPath = $videoContainer.data('video-path')
                            var $viewer = $videoContainer.find('.lazy-video-viewer')
                            var video = $('<video/>').attr('src', videoPath)
                                                     .attr('controls', true)
                                                     .attr('width', '100%')
                                                     .attr('style', 'max-width: 800px;')
                            $viewer.empty().append(video)
                            $viewer.show()
                            $videoContainer.data('loaded', 'true')
                        }
                    }

                    // Lazy load EPUB
                    if ($epubContainer.length > 0) {
                        var isLoaded = $epubContainer.data('loaded')
                        if (!isLoaded || isLoaded === 'false') {
                            var epubPath = $epubContainer.data('epub-path')
                            var $viewer = $epubContainer.find('.lazy-epub-viewer')
                            $viewer.empty().show()
                            if (typeof ePub !== 'undefined' && window.initEpubViewer) {
                                window.initEpubViewer($viewer[0], epubPath)
                            }
                            $epubContainer.data('loaded', 'true')
                        }
                    }

                    // Lazy load DJVU
                    if ($djvuContainer.length > 0) {
                        var isLoaded = $djvuContainer.data('loaded')
                        if (!isLoaded || isLoaded === 'false') {
                            var djvuPath = $djvuContainer.data('djvu-path')
                            var $viewer = $djvuContainer.find('.lazy-djvu-viewer')
                            var djvu_id = 'djvu-' + Date.now()
                            var djvuDiv = $('<div/>').attr('id', djvu_id)
                            $viewer.empty().append(djvuDiv)
                            $viewer.show()

                            if (typeof DjVu !== 'undefined' && DjVu.Viewer) {
                                var viewer_instance = new DjVu.Viewer()
                                viewer_instance.render(document.getElementById(djvu_id))
                                viewer_instance.loadDocumentByUrl(djvuPath)
                            }

                            $djvuContainer.data('loaded', 'true')
                        }
                    }
                }
            })
    }

function make_li_imgs_scan(divportf, elem, web_path){

      /*
      Portfolio
      */
      var $img = $("<img>", {
                    src: web_path + '/' + elem,
                    alt: elem,
                  });
      var $caption = $("<figcaption>").text(elem);
      var $fig = $("<figure>")
      $fig.append($img).append($caption)

      var classportf = "col-md-4"

       var divportfinner = $('<div/>').addClass(classportf)
           .append(
                 $('<div/>').addClass("thumbnail")
                   .append($fig)
                  )
        divportf.append(divportfinner)

        return divportf
      }

</script>
