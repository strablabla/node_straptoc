
<style>
.reading-status-buttons {
    display: inline-block;
    position: relative;
    width: 0;
    height: 0;
    margin-left: 6px;
    overflow: visible;
    opacity: 0;
    pointer-events: none;
    user-select: none;
    vertical-align: middle;
    white-space: nowrap;
    transition: opacity 0.22s ease;
}
li.rs-near-bullet .reading-status-buttons,
li.reading-status-reading .reading-status-buttons {
    opacity: 1 !important;
    pointer-events: auto !important;
}
/* Force-collapse right after a deactivation click, until the mouse leaves */
li.rs-suppress .reading-status-buttons {
    opacity: 0 !important;
    pointer-events: none !important;
}
.reading-status-buttons .rs-btn {
    position: absolute;
    top: -8px;          /* slight downward overflow below the line */
    left: 0;
    display: inline-block;
    width: 20px;
    height: 22px;
    text-align: center;
    line-height: 22px;
    cursor: pointer;
    opacity: 0.4;
    transition: opacity 0.1s;
}
.reading-status-buttons .rs-btn:hover {
    opacity: 0.85;
}
.reading-status-buttons .rs-btn.rs-active {
    opacity: 1;
}
.reading-status-buttons .rs-bookmark-icon {
    width: 14px;
    height: 18px;
    vertical-align: middle;
}

/* Orange title styling for !fold items, matching the $pdf markdown style */
li.fold_li > .embed_pdf {
    color: #ff6600;
    cursor: pointer;
}
li.fold_li > .embed_pdf a,
li.fold_li > .embed_pdf .fold_toggle {
    color: #ff6600;
    text-decoration: none;
}
</style>

<script>

/*

Deal with a given folder — unified !fold handler.
Supports files (pdf, epub, djvu, images, videos) directly in folder,
in subfolders, and recursively in sub-subfolders.

*/

// Reading status: client-side cache filled by 'reading_statuses_loaded'.
// Map: filePath -> 'reading' | 'finished' | 'to-read'
window._reading_statuses = window._reading_statuses || {}
window._reading_statuses_loaded = window._reading_statuses_loaded || false

function apply_reading_status_class(li, status) {
    li.removeClass('reading-status-reading reading-status-finished reading-status-to-read')
    if (status) li.addClass('reading-status-' + status)
    // A book that's being read must stay visible: open every enclosing '::'
    // fold (parent lists collapsed by default would otherwise hide it), plus
    // any fold on its own line. This re-asserts on every status refresh (incl.
    // the click-driven safety net), so the book stays revealed as long as it's
    // 'reading'; clearing the status leaves the folds wherever the reader left them.
    if (status === 'reading') reveal_colon_fold_for_reading(li)
}

// Reveal a reading book that's tucked inside collapsed '::' folds. The book's
// <li> is nested in the folded <ul> of one or more ANCESTOR '::' lines, so we
// walk from the book's li up through every enclosing li and open each one that
// carries a '::' fold. straptoc.js renders a fold as <a><span class="::">[+]
// </span></a> (sometimes inside a <p>, the code-block case) next to the <li>'s
// child <ul>, which it hides by default; here we show that <ul> and flip the
// indicator to [-], mirroring straptoc.js's own toggle. The book's own line is
// included too, so notes folded directly under it open as well.
function reveal_colon_fold_for_reading($li) {
    $li.add($li.parents('li')).each(function() {
        var $foldLi = $(this)
        var $ind = $foldLi.children('a, p').find('span.\\:\\:').first()
        if (!$ind.length) return  // not a '::' fold line — leave it alone
        $foldLi.children('ul').show()
        $ind.text(' [-]')
    })
}

function build_reading_status_buttons(full_path) {
    var current = window._reading_statuses[full_path] || null
    var $wrap = $('<span/>').addClass('reading-status-buttons')
                            .attr('data-rs-path', full_path)
    var $btn = $('<span/>').addClass('rs-btn')
                           .attr('data-status', 'reading')
                           .attr('title', 'En cours de lecture')
                           .append($('<img/>').addClass('rs-bookmark-icon')
                                              .attr('src', 'capicon/svg/355.svg')
                                              .attr('alt', ''))
    if (current === 'reading') $btn.addClass('rs-active')
    $btn.on('click', function(e) {
        e.stopPropagation()
        var $clicked = $(this)
        var $group = $clicked.closest('.reading-status-buttons')
        var $li = $group.closest('li')
        var path = $group.attr('data-rs-path')
        var was_active = $clicked.hasClass('rs-active')
        var new_status = was_active ? null : 'reading'
        // Optimistic UI update
        if (new_status) {
            $clicked.addClass('rs-active')
            window._reading_statuses[path] = new_status
            $li.removeClass('rs-suppress')
        } else {
            $clicked.removeClass('rs-active')
            delete window._reading_statuses[path]
            // Slide the title back toward the bullet right away, even though
            // the cursor is still on the li. Lift the suppression on mouseleave.
            $li.addClass('rs-suppress')
            $li.one('mouseleave', function() {
                $(this).removeClass('rs-suppress')
            })
        }
        apply_reading_status_class($li, new_status)
        socket.emit('set_reading_status', JSON.stringify({
            filePath: path,
            status: new_status
        }))
    })
    $wrap.append($btn)
    return $wrap
}

// Re-apply status to all currently rendered <li> that hold reading-status-buttons.
// Uses descendant selector + closest('li') so it also finds wrappers nested in
// .embed_pdf (the !fold case), not just direct children of <li>.
function refresh_all_reading_statuses() {
    $('li .reading-status-buttons').each(function() {
        var $group = $(this)
        var $li = $group.closest('li')
        var path = $group.attr('data-rs-path')
        var status = window._reading_statuses[path] || null
        $group.find('.rs-btn').removeClass('rs-active')
        if (status) $group.find('.rs-btn[data-status="' + status + '"]').addClass('rs-active')
        // Clear any inline display:none (e.g. accidentally set by some
        // parent's .toggle() on a sibling collision) — visibility is then
        // governed by our CSS opacity rules alone.
        if ($group[0].style.display === 'none') $group[0].style.display = ''
        apply_reading_status_class($li, status)
    })
}

// Inject status buttons into <li> containing an <a class="pdf-link"> (markdown
// $pdf syntax produced by straptoc.js). NOTE: !fold PDFs also wear .pdf-link
// but on a <div class="embed_pdf"> — those are already handled by make_li_embed,
// so we restrict the selector to anchors to avoid double-injection.
function inject_reading_status_into_pdflinks() {
    $('li > a.pdf-link').each(function() {
        var $link = $(this)
        var $li = $link.parent()
        if ($li.find('.reading-status-buttons').length > 0) return
        var path = $link.attr('data-pdf-path')
        if (!path) return
        var $buttons = build_reading_status_buttons(path)
        // Append INSIDE the <a>, not as sibling. straptoc.js binds a click
        // handler to every <a> that does $(this).parent().next().toggle()
        // (meant to toggle the EPUB embed <ul>) — if our wrapper sits next
        // to the link, that toggle hides it (display:none) and nothing can
        // bring it back via opacity. Placing it inside the link keeps it
        // out of the .next() target.
        $link.append($buttons)
        apply_reading_status_class($li, window._reading_statuses[path] || null)
        bind_rs_hover_detection($li)
    })
}

// Reveal the buttons only when the cursor is in a small zone around where
// the button sits (end of the title line) — not whenever it's on the line.
// Class name 'rs-near-bullet' kept for CSS compatibility.
function bind_rs_hover_detection($li) {
    $li.on('mousemove.rs', function(e) {
        var $self = $(this)
        var $buttons = $self.find('.reading-status-buttons').first()
        if (!$buttons.length) return
        // Anchor on the element preceding the buttons (the [+] toggle or
        // the title link). Its right edge tells us where the button starts.
        // Skip zero-sized siblings (e.g. the hidden .tag_a_to_text span
        // injected by modif_css.html), otherwise the hot zone collapses to (0,0).
        var $anchor = $buttons.prevAll().filter(function() {
            if (!this.getBoundingClientRect) return false
            var r = this.getBoundingClientRect()
            return r.width > 0 && r.height > 0
        }).first()
        if (!$anchor.length || !$anchor[0].getBoundingClientRect) {
            $anchor = $buttons.parent()
        }
        var rect = $anchor[0].getBoundingClientRect()
        var was_near = $self.hasClass('rs-near-bullet')
        // Hot zone: just to the right of the title, vertically tight around
        // the line. Widens to include the visible button when already shown.
        var x_min = rect.right - 4
        var x_max = rect.right + (was_near ? 40 : 30)
        var y_min = rect.top - 4
        var y_max = rect.bottom + 16     // a bit below to cover overflow
        var x = e.clientX, y = e.clientY
        if (x >= x_min && x <= x_max && y >= y_min && y <= y_max) {
            if (!was_near) $self.addClass('rs-near-bullet')
        } else {
            if (was_near) $self.removeClass('rs-near-bullet')
        }
    })
    $li.on('mouseleave.rs', function() {
        $(this).removeClass('rs-near-bullet')
    })
}

socket.on('reading_statuses_loaded', function(payload) {
    try {
        window._reading_statuses = JSON.parse(payload) || {}
        // Flatten { path: { status, updated } } -> { path: status }
        var flat = {}
        for (var k in window._reading_statuses) {
            var v = window._reading_statuses[k]
            if (v && typeof v === 'object' && v.status) flat[k] = v.status
            else if (typeof v === 'string') flat[k] = v
        }
        window._reading_statuses = flat
        window._reading_statuses_loaded = true
        inject_reading_status_into_pdflinks()
        refresh_all_reading_statuses()
        // Statuses may arrive AFTER the !fold blocks were already built (the two
        // socket round-trips race). folder_scan's own surface call would have
        // early-returned while _reading_statuses_loaded was still false, so
        // re-run it now that the data is here and roots are registered.
        surface_reading_books()
    } catch (e) {
        console.error('reading_statuses_loaded parse error', e)
    }
})

socket.on('reading_status_updated', function(payload) {
    try {
        var data = JSON.parse(payload)
        if (!data || !data.filePath) return
        if (data.status) window._reading_statuses[data.filePath] = data.status
        else delete window._reading_statuses[data.filePath]
        // Update any rendered li for this path (filter handles paths with special chars)
        $('.reading-status-buttons').filter(function() {
            return $(this).attr('data-rs-path') === data.filePath
        }).each(function() {
            var $group = $(this)
            $group.find('.rs-btn').removeClass('rs-active')
            if (data.status) $group.find('.rs-btn[data-status="' + data.status + '"]').addClass('rs-active')
            apply_reading_status_class($group.closest('li'), data.status)
        })
        // Keep surfaced books in sync: a book turning 'reading' in a collapsed
        // subfolder should appear, and one leaving 'reading' should disappear.
        // The rebuild is idempotent so this is safe to call on every update.
        surface_reading_books()
    } catch (e) {
        console.error('reading_status_updated parse error', e)
    }
})

// Request statuses once per page load
$(function() { socket.emit('get_reading_statuses') })

// Safety net: after any click in the page, re-apply cached statuses. Keeps
// the bookmark icon visible for files marked 'reading' even if some other
// code path (PDF modal teardown, folder re-render, etc.) accidentally
// strips the reading-status-* class from the <li>. Debounced.
var rs_refresh_timer = null
$(document).on('click.rs_refresh', function() {
    clearTimeout(rs_refresh_timer)
    rs_refresh_timer = setTimeout(refresh_all_reading_statuses, 300)
})

// Define these variables and functions OUTSIDE of socket.on('make_elems')
// to avoid re-registration issues

String.prototype.format = function () {
      var i = 0, args = arguments;
      return this.replace(/{}/g, function () {
        return typeof args[i] != 'undefined' ? args[i++] : '';
      });
    };

// ebook extension
function ebook_ext(name) {
  return /\.(pdf|djvu|epub)$/i.test(name);
}

// image extension
function image_ext(name) {
  return /\.(png|jpg|webp)$/i.test(name);
}

// video extension
function video_ext(name) {
  return /\.(mp4|webm|ogg|mkv|avi)$/i.test(name);
}

// any supported file extension
function supported_ext(name) {
  return ebook_ext(name) || image_ext(name) || video_ext(name);
}

function sort_list_pattern(array, list){
      /*
      Sort a list with patterns..
      Multiple files can share the same pattern bucket (e.g. dpls_fev_ and pls_fev_),
      so each bucket is an array; within a bucket, files are sorted alphabetically.
      */
      var buckets = []
      for ( var k = 0; k < list.length; k++ ) buckets.push([])
      var supp_list = []
      for ( var i in array ){
          var ind = index_in_list(array[i], list)
          if ( ind != null ){
              buckets[ind].push(array[i])
          }
          else{
             supp_list.push(array[i])
          }
      }
      var new_arr = []
      for ( var i = 0; i < buckets.length; i++ ){
          if ( buckets[i].length > 0 ){
              buckets[i].sort()
              new_arr = new_arr.concat(buckets[i])
          }
      }
      return [...supp_list, ...new_arr]
    }

var pdf_months = ['_janv_', '_fev_', '_mars_', '_avr_', '_mai_',
                  '_juin_', '_juill_', '_aout_', '_sept_', '_oct_',
                  '_nov_', '_dec_']

function index_in_list(a, list){
    for ( var i in list ){
          var m = a.match(list[i])
          if (m != null){
              var ind = list.indexOf(m[0]);
              break;
              }
            ind = m
          } // for
    return ind
    }

// Global state for folder_scan
var fold_scan_count = 0
var fold_scan_data = {}       // count -> { li, addr, addr_abs, isRoot }
var fold_scan_initialized = false
var fold_scan_processed = {}  // Guard against duplicates

// Visible top-level !fold containers, used to "surface" reading books that live
// in collapsed (lazy, unloaded) subfolders. Each entry: { addr_abs, $container }.
window._fold_surface_roots = window._fold_surface_roots || []

// =====================================================================
// folder_scan listener — handles typed entries (f: files, d: directories)
// =====================================================================

socket.on('folder_scan', function(strap_addr){

    var current_count = parseInt(strap_addr.split('§§')[0])
    strap_addr = strap_addr.split('§§')[1]

    // Guard: duplicates
    if (fold_scan_processed[current_count]) return
    fold_scan_processed[current_count] = true

    // Guard: check entry exists
    if (!fold_scan_data[current_count]) return

    var entry = fold_scan_data[current_count]
    var entries = strap_addr ? strap_addr.split('\n').filter(function(e){ return e.length > 0 }) : []

    // Separate files and directories
    var files = []
    var dirs = []
    entries.forEach(function(e){
        if (e.startsWith('d:')) {
            dirs.push(e.substring(2))
        } else if (e.startsWith('f:')) {
            files.push(e.substring(2))
        } else {
            files.push(e)  // fallback: treat as file
        }
    })

    // Filter only supported file types
    var supported_files = files.filter(function(f){ return supported_ext(f) })

    // Sort supported files
    var sorted_files = sort_list_pattern(supported_files, pdf_months)

    // Sort directories alphabetically
    dirs.sort(function(a, b){ return a.localeCompare(b) })

    // Build the content
    var container_ul = $('<ul/>')

    // --- Add directories as expandable items ---
    dirs.forEach(function(dir_name){
        var dir_li = $('<li/>')
        var dir_addr = entry.addr + '/' + dir_name
        var dir_addr_abs = entry.addr_abs + '/' + dir_name

        // Stamp the folder's web path on the <li> itself. The inner <ul> carries
        // data-fold-addr-abs too, but lazy loading replaceWith's that <ul> away,
        // dropping the attribute — whereas this <li> survives, so book-surfacing
        // can still locate the right folder after it has been expanded once.
        dir_li.attr('data-subfolder-abs', dir_addr_abs)

        // Title with [+] toggle
        var title_span = $('<span/>').text(dir_name + ' ')
        var toggle_a = $('<a/>').append($('<span/>').addClass('funf-scan').text('[+]'))
        title_span.append(toggle_a)
        dir_li.append(title_span)

        // Hidden sub-container (will be filled on click)
        var sub_ul = $('<ul/>').hide()
        sub_ul.attr('data-fold-addr', dir_addr)
        sub_ul.attr('data-fold-addr-abs', dir_addr_abs)
        sub_ul.attr('data-fold-loaded', 'false')
        dir_li.append(sub_ul)

        container_ul.append(dir_li)
    })

    // --- Add files ---
    if (sorted_files.length > 0) {
        var first_file = sorted_files[0]
        var web_path = entry.addr_abs

        if (ebook_ext(first_file)) {
            sorted_files.forEach(function(elem){
                make_li_embed(web_path, elem, container_ul)
            })
        } else if (image_ext(first_file)) {
            var divportf = $('<div/>').addClass("row")
            sorted_files.forEach(function(elem){
                divportf = make_li_imgs_scan(divportf, elem, web_path)
            })
            container_ul.append(divportf)
        } else if (video_ext(first_file)) {
            sorted_files.forEach(function(elem){
                make_li_video(web_path, elem, container_ul)
            })
        }
    }

    // Replace the original element
    // Preserve the inline display:none set by the :: fold mechanism in straptoc.js
    // (otherwise wrapping a !fold inside a ::-folded list would render expanded)
    var target_li = entry.li
    if (target_li) {
        var oldParent = target_li.parent()
        var wasHidden = oldParent.length > 0 && oldParent[0].style.display === 'none'
        oldParent.replaceWith(container_ul)
        if (wasHidden) container_ul.hide()
    }

    // Register this as a surfacing root only for top-level !fold blocks (not
    // lazy subfolder expansions): its container stays visible, so reading
    // books from its collapsed subfolders can be lifted into it without
    // expanding anything. addr_abs is the folder's web path — a prefix of the
    // full paths under which reading_status keys the books inside it.
    if (entry.isRoot) {
        window._fold_surface_roots.push({ addr_abs: entry.addr_abs, $container: container_ul })
    }

    // Bind toggle for this batch
    bind_fold_scan_toggles()
    // Also bind file toggles
    toggle_elem()

    // Now that this folder's direct files are in the DOM, (re)surface reading
    // books from still-collapsed subfolders. Runs after every scan so expanding
    // a subfolder later de-duplicates the surfaced copy automatically.
    surface_reading_books()

}) // socket.on folder_scan

// =====================================================================
// Click handler for directory toggles — lazy loads subdirectory content
// =====================================================================

function bind_fold_scan_toggles(){
    $('.funf-scan').off('click').on('click', function(e){
        e.stopPropagation()
        var toggle_span = $(this)
        var $li = toggle_span.closest('li')
        // The real fold container — every <ul> child EXCEPT the visible
        // .reading-surfaced-ul we may have appended to this same <li>. We can't
        // key on [data-fold-addr] because lazy loading replaceWith's the original
        // <ul> with a fresh container that no longer carries that attribute, and
        // we'd then fail to hide it on collapse.
        var sub_ul = $li.children('ul').not('.reading-surfaced-ul')

        if (toggle_span.text() === '[+]') {
            toggle_span.text('[-]')
            // Opening the folder shows the real files (incl. the reading book),
            // so drop the surfaced copy to avoid a duplicate.
            $li.children('.reading-surfaced-ul').remove()
            sub_ul.show()

            // Lazy load if not yet loaded
            if (sub_ul.attr('data-fold-loaded') === 'false') {
                sub_ul.attr('data-fold-loaded', 'true')
                var addr = sub_ul.attr('data-fold-addr')
                var addr_abs = sub_ul.attr('data-fold-addr-abs')

                // Create a placeholder li and request scan
                var placeholder_li = $('<li/>').text('...')
                sub_ul.append(placeholder_li)

                var count = fold_scan_count
                fold_scan_data[count] = {
                    li: placeholder_li,
                    addr: addr,
                    addr_abs: addr_abs
                }
                fold_scan_count++
                socket.emit('folder_scan', addr + '§§' + count)
            }
        } else {
            toggle_span.text('[+]')
            sub_ul.hide()
            // Collapsing hides the real (loaded) files again — re-surface any
            // reading book so it stays visible under this folder's name.
            surface_reading_books()
        }
    })
}

// =====================================================================
// make_elems — initial scan of !fold patterns in the document
// =====================================================================

function run_fold_scan(){

    // Guard: only run once per page load
    if (fold_scan_initialized) return
    fold_scan_initialized = true

    var all_li = $('li');

    all_li.each(function(){

        /*
        Replace !fold by the folder content.
        Now handles everything: files directly, subfolders, sub-subfolders (recursively).
        !inside is no longer needed.
        */

        var reg = /\!fold/
        var txt = $(this).html().split('\n')[0]

        if ( txt.match(reg) ){

            // Extract path — strip !inside if present (backward compat)
            var addr = txt.split('!fold')[1]
            if (addr.indexOf('!inside') !== -1) {
                addr = addr.split('!inside')[0]
            }
            addr = addr.trim()

            var addr_short = addr.split('/').slice(1).join('/')
            var addr_abs = absolute_addr(addr)

            var count = fold_scan_count
            fold_scan_data[count] = {
                li: $(this),
                addr: addr,
                addr_abs: addr_abs,
                isRoot: true
            }
            fold_scan_count++
            socket.emit('folder_scan', addr + '§§' + count)

        } // if text.match

    }) // li each

}

// Trigger the scan. The DOM (built synchronously by maketoc) is already in
// place by the time this script runs, so we don't actually need the server.
// Previously the scan ran ONLY on the 'make_elems' echo bounced back by the
// server (list_folders_for_extract.html -> server -> here). That round-trip is
// fire-and-forget with no retry: if the echo is ever lost (socket reconnect,
// polling->websocket upgrade, timing), the scan never ran and !fold stayed
// literal until a manual page reload. We now drive it directly on DOM-ready and
// keep the echo as a harmless fallback; the fold_scan_initialized guard makes
// sure it still runs exactly once.
socket.on('make_elems', run_fold_scan)   // legacy server echo (fallback)
$(function(){ run_fold_scan() })          // direct, reload-proof trigger

// =====================================================================
// File display helpers
// =====================================================================

function handle_docs(sorted_list, new_ul, current_count){
    // kept for backward compat if needed
}

function relative_addr(addr, addr_short){
      try {
        var reg = /\.{2}\/\w+.+\//     // pattern ../aaa
        root = addr.match(reg)[0]      // root
        addr = addr.split(root)[1]     // remove the root
      }
      catch{
        addr = addr_short
      }
      return addr
    }

    function absolute_addr(addr){

          /*
          Absolute address, address used in the html code
          Returns the web-accessible path (absolute URL starting with /)
          */

          function ensureLeadingSlash(path) {
              return path.startsWith('/') ? path : '/' + path
          }

          // For sdata pattern
          var reg_sdata = /sdata\/\w+.+/
          var match = addr.match(reg_sdata)
          if (match) {
              return ensureLeadingSlash(match[0])
          }

          // For public pattern
          var reg_public = /public\/(.+)/
          match = addr.match(reg_public)
          if (match) {
              return ensureLeadingSlash(match[1])
          }

          // Fallback
          return ensureLeadingSlash(addr)
    }


    function make_li_embed(addr, elem, new_ul){

          /*
          List of files with embedding..
          Full address is addr + '/' + elem
          */
          var full_path = addr + '/' + elem

          // Extract name without extension for any ebook type
          var display_name = elem.replace(/\.(pdf|epub|djvu)$/i, '')

          var div_format = $('<div/>').text(display_name).addClass('embed_pdf')

          // case pdf — opens in PDF.js modal on click, no inline embed
          if ( elem.search(/\.pdf$/i) != -1 ){
              div_format.attr('title', 'Open PDF')
                        .addClass('pdf-link')
                        .attr('data-pdf-path', full_path)
                        .on('click', function() {
                            var $tog = $(this).find('.fold_toggle')
                            $tog.text($tog.text().trim() === '[+]' ? ' [-]' : ' [+]')
                            if (window.annotationSystem) {
                                window.annotationSystem.currentFile = full_path;
                                window.annotationSystem.fileType = 'pdf';
                            }
                            if (window.openPDFViewer) {
                                window.openPDFViewer(full_path);
                                setTimeout(function() {
                                    if (window.socket) window.socket.emit('get_annotations', full_path);
                                    if (window.setupPDFJSAnnotationHandlers) window.setupPDFJSAnnotationHandlers();
                                    if (window.reloadPDFAnnotations) {
                                        setTimeout(function() { window.reloadPDFAnnotations(); }, 500);
                                    }
                                }, 1500);
                            } else {
                                console.error('PDF.js viewer not available');
                            }
                        })
              div_format.append($('<span/>').addClass('fold_toggle').text(' [+]'))
              div_format.append(build_reading_status_buttons(full_path))
              var curr_li = $('<li/>').addClass('fold_li')
              curr_li.append(div_format)
              apply_reading_status_class(curr_li, window._reading_statuses[full_path] || null)
              bind_rs_hover_detection(curr_li)
              new_ul.append(curr_li)
              return
          }

          var a_deploy = $('<a/>').text(' [+]')
          var span_tog = $('<span/>').addClass('tog_elem').append(a_deploy)

          var obj_html = ''

          // case epub
          if ( elem.search(/\.epub$/i ) != -1){
              a_deploy.addClass('fold_epub')
              var viewerId = 'epub-viewer-' + Date.now() + '-' + Math.floor(Math.random() * 1000)
              obj_html = '<br><div class="lazy-epub-container" id="' + viewerId + '" data-epub-path="' + full_path + '" data-loaded="false" style="width: 100%; margin: 10px 0;">' +
                        '<div class="lazy-epub-viewer" style="display: none;"></div>' +
                        '</div><br>'
          }
          // case djvu
          else if ( elem.search(/\.djvu$/i ) != -1){
              a_deploy.addClass('fold_djvu')
              var viewerId = 'djvu-viewer-' + Date.now() + '-' + Math.floor(Math.random() * 1000)
              obj_html = '<br><div class="lazy-djvu-container" id="' + viewerId + '" data-djvu-path="' + full_path + '" data-loaded="false" style="width: 100%; margin: 10px 0;">' +
                        '<div class="lazy-djvu-viewer" style="display: none;"></div>' +
                        '</div><br>'
          }

          var divformat_plus = div_format.append(span_tog).append(build_reading_status_buttons(full_path))
          var div_obj = $('<div/>').html(obj_html).hide()
          var curr_li = $('<li/>').addClass('fold_li')
          curr_li.append( divformat_plus.append( div_obj ) )
          apply_reading_status_class(curr_li, window._reading_statuses[full_path] || null)
          bind_rs_hover_detection(curr_li)
          new_ul.append( curr_li )
    }

    // Lift reading books out of collapsed (unloaded) !fold subfolders WITHOUT
    // expanding anything. We already know each reading book's full path from
    // window._reading_statuses, so we render it directly with make_li_embed into
    // the visible top-level !fold container that owns its path. Rebuilt from
    // scratch each call (idempotent): all previously surfaced lists are dropped
    // first, and a book that is already rendered normally (direct file, or in a
    // subfolder the user expanded) is left alone so we never duplicate it.
    function surface_reading_books(){
        if (!window._reading_statuses_loaded) return
        // Drop roots whose container was detached (page re-render).
        window._fold_surface_roots = (window._fold_surface_roots || []).filter(function(r){
            return r.$container && r.$container.closest('body').length > 0
        })
        var roots = window._fold_surface_roots
        if (!roots.length) return

        // Clear prior surfaced lists so the "already rendered elsewhere" test
        // below only sees genuine, in-place renderings.
        $('.reading-surfaced-ul').remove()

        var readingPaths = Object.keys(window._reading_statuses).filter(function(p){
            return window._reading_statuses[p] === 'reading'
        })

        readingPaths.forEach(function(path){
            // Most specific root containing this book (longest matching prefix).
            var root = null
            roots.forEach(function(r){
                if (path.indexOf(r.addr_abs + '/') === 0 &&
                    (!root || r.addr_abs.length > root.addr_abs.length)) {
                    root = r
                }
            })
            if (!root) return

            // Already rendered AND VISIBLE in place (direct file or an expanded
            // subfolder)? Leave it. We test visibility of the ROW (li.fold_li),
            // not of the attribute-bearing element: for epub/djvu the
            // data-epub-path / data-djvu-path sits on the .lazy-*-container which
            // lives inside a permanently-hidden viewer <div>, so :visible on it
            // would always be false and we'd duplicate the book on every pass.
            // Testing the row also keeps the intended behaviour for collapsed
            // subfolders (row hidden -> not deduped -> surfaced). PDFs carry
            // data-pdf-path on their visible row directly.
            var already = false
            $('[data-pdf-path],[data-epub-path],[data-djvu-path]').each(function(){
                var $e = $(this)
                var $row = $e.closest('li.fold_li')
                var visible = $row.length ? $row.is(':visible') : $e.is(':visible')
                if (!visible) return
                if ($e.attr('data-pdf-path') === path ||
                    $e.attr('data-epub-path') === path ||
                    $e.attr('data-djvu-path') === path) already = true
            })
            if (already) return

            var elem = path.split('/').pop()
            var dir = path.slice(0, path.length - elem.length - 1)

            // Hang the book off the ORIGINAL subfolder element so it shows under
            // that folder's existing name — no synthetic folder <li>. Find the
            // deepest already-rendered subfolder <li> whose path is a prefix of
            // the book's dir and attach a visible list to it. We match on the
            // <li>'s data-subfolder-abs (survives lazy-load), not the inner
            // <ul>'s data-fold-addr-abs (destroyed by replaceWith on expand). If
            // no subfolder is rendered yet (e.g. book sits directly under the
            // root), fall back to the root container.
            var $host = root.$container
            var bestLen = -1
            root.$container.find('li[data-subfolder-abs]').each(function(){
                var a = $(this).attr('data-subfolder-abs')
                if ((dir === a || dir.indexOf(a + '/') === 0) && a.length > bestLen) {
                    bestLen = a.length
                    $host = $(this)
                }
            })

            // One visible surfaced list per host, reused across its books.
            var $surf = $host.children('.reading-surfaced-ul').first()
            if (!$surf.length) {
                $surf = $('<ul/>').addClass('reading-surfaced-ul')
                $host.append($surf)
            }
            make_li_embed(dir, elem, $surf)
        })
    }

    function make_li_video(addr, elem, new_ul){

          /*
          List of video files with lazy loading.
          Full address is addr + '/' + elem
          */
          var full_path = addr + '/' + elem

          var video_name = elem.replace(/\.(mp4|webm|ogg|mkv|avi)$/i, '')

          var div_format = $('<div/>').text(video_name).addClass('embed_video')
          var a_deploy = $('<a/>').text(' [+]')
          var span_tog = $('<span/>').addClass('tog_elem tog_video').append(a_deploy)

          var viewerId = 'video-viewer-' + Date.now() + '-' + Math.floor(Math.random() * 1000)
          var video_container = '<br><div class="lazy-video-container" id="' + viewerId + '" data-video-path="' + full_path + '" data-loaded="false" style="width: 100%; margin: 10px 0;">' +
                    '<div class="lazy-video-viewer" style="display: none;"></div>' +
                    '</div><br>'

          var divformat_plus = div_format.append(span_tog)
          var div_obj = $('<div/>').html(video_container).hide()
          var curr_li = $('<li/>').addClass('fold_li fold_video')
          new_ul.append( curr_li.append( divformat_plus.append( div_obj ) ) )
    }

    function toggle_elem(){

        /*
        Code for closing, opening the pdfs, videos, epubs and djvus.
        Lazy loading: content is loaded when user clicks [+] to open
        */

        $('.tog_elem').off('click').on('click', function(){

                var taga = $(this).find('a')
                // First next sibling that is NOT our reading-status-buttons wrapper.
                // The wrapper now sits between .tog_elem and the lazy container.
                var $wrapper = $(this).nextAll().not('.reading-status-buttons').first()
                var $videoContainer = $wrapper.find('.lazy-video-container')
                var $epubContainer = $wrapper.find('.lazy-epub-container')
                var $djvuContainer = $wrapper.find('.lazy-djvu-container')

                if (taga.text() == ' [-]'){
                    taga.text(' [+]')
                    $wrapper.hide()

                } else {
                    taga.text(' [-]')
                    $wrapper.show()

                    // Lazy load Video
                    if ($videoContainer.length > 0) {
                        var isLoaded = $videoContainer.data('loaded')
                        if (!isLoaded || isLoaded === 'false') {
                            var videoPath = $videoContainer.data('video-path')
                            var $viewer = $videoContainer.find('.lazy-video-viewer')
                            var video = $('<video/>').attr('src', videoPath)
                                                     .attr('controls', true)
                                                     .attr('width', '100%')
                                                     .attr('style', 'max-width: 800px;')
                            $viewer.empty().append(video)
                            $viewer.show()
                            $videoContainer.data('loaded', 'true')
                        }
                    }

                    // Lazy load EPUB
                    if ($epubContainer.length > 0) {
                        var isLoaded = $epubContainer.data('loaded')
                        if (!isLoaded || isLoaded === 'false') {
                            var epubPath = $epubContainer.data('epub-path')
                            var $viewer = $epubContainer.find('.lazy-epub-viewer')
                            $viewer.empty().show()
                            if (typeof ePub !== 'undefined' && window.initEpubViewer) {
                                window.initEpubViewer($viewer[0], epubPath)
                            }
                            $epubContainer.data('loaded', 'true')
                        }
                    }

                    // Lazy load DJVU
                    if ($djvuContainer.length > 0) {
                        var isLoaded = $djvuContainer.data('loaded')
                        if (!isLoaded || isLoaded === 'false') {
                            var djvuPath = $djvuContainer.data('djvu-path')
                            var $viewer = $djvuContainer.find('.lazy-djvu-viewer')
                            var djvu_id = 'djvu-' + Date.now()
                            var djvuDiv = $('<div/>').attr('id', djvu_id)
                            $viewer.empty().append(djvuDiv)
                            $viewer.show()

                            if (typeof DjVu !== 'undefined' && DjVu.Viewer) {
                                var viewer_instance = new DjVu.Viewer()
                                viewer_instance.render(document.getElementById(djvu_id))
                                viewer_instance.loadDocumentByUrl(djvuPath)
                            }

                            $djvuContainer.data('loaded', 'true')
                        }
                    }
                }
            })
    }

function make_li_imgs_scan(divportf, elem, web_path){

      /*
      Portfolio
      */
      var $img = $("<img>", {
                    src: web_path + '/' + elem,
                    alt: elem,
                  });
      var $caption = $("<figcaption>").text(elem);
      var $fig = $("<figure>")
      $fig.append($img).append($caption)

      var classportf = "col-md-4"

       var divportfinner = $('<div/>').addClass(classportf)
           .append(
                 $('<div/>').addClass("thumbnail")
                   .append($fig)
                  )
        divportf.append(divportfinner)

        return divportf
      }
