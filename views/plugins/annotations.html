<style>

/* Annotation System Styles */

#annotation_toggle_navbar {
    width: 20px;
    height: 20px;
    cursor: pointer;
    margin-left: 10px;
    vertical-align: middle;
    display: none;  /* Hidden by default */
}

/* Crosshair cursor for PDF in annotation mode */
.annotation-mode-active .pdfjs-page-canvas,
.annotation-mode-active .pdfjs-text-layer,
.annotation-mode-active #pdfjs-annotation-layer,
.annotation-mode-active #pdfjs-viewer-content {
    cursor: crosshair !important;
}

#annotation_panel {
    display: none;
    position: fixed;
    background-color: #fbf6ea;
    padding: 20px;
    box-shadow: none;
    border: none;
    border-radius: 5px;
    z-index: 10001;  /* Above PDF overlay */
    min-width: 350px;
    max-width: 450px;
}

#annotation_content {
    display: block;
}

.annotation-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    font-size: 14px;
    font-weight: bold;
}

.annotation-controls {
    display: flex;
    gap: 5px;
}

.annotation-btn {
    cursor: pointer;
    background: transparent;
    border: none;
    padding: 2px 6px;
    border-radius: 3px;
    font-size: 12px;
}

.annotation-btn:hover {
    background: #f0f0f0;
}

#annotation_textarea {
    width: 100%;
    min-height: 120px;
    padding: 10px;
    border: none;
    border-radius: 4px;
    font-family: monospace;
    font-size: 13px;
    resize: vertical;
    margin-bottom: 10px;
    background-color: #fbf6ea;
    display: block !important;
    visibility: visible !important;
    opacity: 1 !important;
    z-index: 10002 !important;
    pointer-events: auto !important;
}

#annotation_textarea:focus {
    outline: none;
    box-shadow: none;
    border: none;
}

.annotation-footer {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
}

.annotation-save-btn,
.annotation-delete-btn {
    padding: 4px 10px;
    background: #fbf6ea;
    color: black;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
    font-size: 18px;
    line-height: 1;
}

.annotation-save-btn:hover,
.annotation-delete-btn:hover {
    background: #f0e8d4;
}

/* Annotation markers on content */
.annotation-marker {
    position: absolute;
    width: 24px;
    height: 24px;
    background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23ff6b6b"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>') no-repeat center;
    background-size: contain;
    cursor: pointer;
    z-index: 10002 !important;  /* Above annotation panel (10001) */
    opacity: 0.9;
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: auto !important;  /* Ensure clickable */
}

.annotation-marker:hover {
    opacity: 1;
    transform: scale(1.2);
}

/* Canvas overlay for drawing annotations */
.annotation-canvas-overlay {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
    z-index: 50;
}

</style>

<!-- No icon here, will be added to navbar dynamically -->

<div id="annotation_panel">
    <div class="annotation-header">
        <span id="annotation_title">New Note</span>
        <div class="annotation-controls">
            <span class="annotation-btn" id="annotation_close" title="Close">×</span>
        </div>
    </div>
    <div id="annotation_content">
        <textarea id="annotation_textarea" placeholder="Enter your note..."></textarea>
        <div class="annotation-footer">
            <button class="annotation-delete-btn" id="annotation_delete" title="Delete" style="display:none;">×</button>
            <button class="annotation-save-btn" id="annotation_save" title="Save">↵</button>
        </div>
    </div>
</div>

<script src="lib/keymaster.js"></script>

<script>

/*

Unified Annotation System
Works with PDFs, EPUBs, and other content
Uses canvas overlay for format-independent annotations

*/

// Make annotationSystem globally accessible
window.annotationSystem = {
    active: false,
    currentFile: null,
    fileType: null,
    annotations: [],
    currentAnnotation: null,
    pdfReady: false,  // For PDF.js viewer
    currentPdfPage: 1,  // Current page in PDF.js viewer
    saving: false  // Flag to prevent double saves
};

// Alias for backward compatibility
var annotationSystem = window.annotationSystem;

// Initialize annotation system
function initAnnotationSystem() {

    // Make the panel draggable once, at boot, instead of re-running this
    // setup on every showAnnotationPanel call (jQuery UI's draggable() init
    // is non-trivial work).
    var panelEl = $('#annotation_panel');
    if (panelEl.length && !panelEl.data('ui-draggable')) {
        panelEl.draggable({
            cancel: '.annotation-btn, .annotation-save-btn, .annotation-delete-btn, #annotation_textarea, button, textarea'
        });
    }

    // Set up toggle button in navbar (will be shown/hidden dynamically)
    $(document).on('click', '#annotation_toggle_navbar', function() {
        $('#id_view_image').hide();
        $('#id_view_image_body').hide();
        toggleAnnotationMode();
    });

    // Panel controls (event delegation so handlers survive any DOM re-render)
    $(document).off('click.annotations_controls');
    $(document).on('click.annotations_controls', '#annotation_close', function(e) {
        e.stopPropagation();
        closeAnnotationPanel();
    });
    $(document).on('click.annotations_controls', '#annotation_save', function(e) {
        e.stopPropagation();
        saveCurrentAnnotation();
    });
    $(document).on('click.annotations_controls', '#annotation_delete', function(e) {
        e.stopPropagation();
        deleteCurrentAnnotation();
    });

    // Detect current file context
    detectCurrentFile();
}

// Detect what file/content is currently being viewed
function detectCurrentFile() {

    // Store previous file to detect changes
    var previousFile = annotationSystem.currentFile;

    // EPUB takes priority when an active EPUB viewer is registered AND the
    // PDF.js modal isn't currently open. Without this, a PDF.js viewer that
    // was opened earlier in the session (and whose pdfDoc is still in
    // memory) would steal context away from the EPUB the user is actually
    // reading right now.
    var pdfModalVisible = $('#pdf-viewer-modal').is(':visible');
    if (!pdfModalVisible &&
        window.activeEpubViewerId &&
        window.EPUBViewers &&
        window.EPUBViewers[window.activeEpubViewerId]) {
        var activeViewerEarly = window.EPUBViewers[window.activeEpubViewerId];
        if (activeViewerEarly && activeViewerEarly.epubPath) {
            if (activeViewerEarly.epubPath !== previousFile) {
                annotationSystem.annotationsLoaded = false;
            }
            annotationSystem.currentFile = activeViewerEarly.epubPath;
            annotationSystem.fileType = 'epub';
            annotationSystem.currentEpubViewer = activeViewerEarly;
            return;
        }
    }

    // Check for PDF.js viewer modal (preferred when its modal is the
    // currently visible reader)
    if (window.PDFViewer && window.PDFViewer.pdfDoc && annotationSystem.currentFile &&
        annotationSystem.currentFile.includes('.pdf')) {
        // Already set by PDF.js viewer, don't change it
        annotationSystem.fileType = 'pdf';
        return;
    }

    // Check for PDF embedded via markdown (with pdf-link class)
    var pdfObject = $('object[type="application/pdf"]:visible').first();
    if (pdfObject.length > 0) {
        var pdfSrc = pdfObject.attr('data');
        if (pdfSrc) {
            // Reset annotations loaded flag if file changed
            if (pdfSrc !== previousFile) {
                annotationSystem.annotationsLoaded = false;
            }
            annotationSystem.currentFile = pdfSrc;
            annotationSystem.fileType = 'pdf';
            return;
        }
    }

    // Check for PDF embed
    var pdfEmbed = $('.embed_pdf:visible').first();
    if (pdfEmbed.length > 0) {
        var pdfText = pdfEmbed.text().trim();
        if (pdfText) {
            if (pdfText !== previousFile) {
                annotationSystem.annotationsLoaded = false;
            }
            annotationSystem.currentFile = pdfText;
            annotationSystem.fileType = 'pdf';
            return;
        }
    }

    // Check for EPUB — prefer the most-recently-active viewer (set by epub.html on render).
    if (window.activeEpubViewerId && window.EPUBViewers && window.EPUBViewers[window.activeEpubViewerId]) {
        var activeViewer = window.EPUBViewers[window.activeEpubViewerId];
        if (activeViewer && activeViewer.epubPath) {
            if (activeViewer.epubPath !== previousFile) {
                annotationSystem.annotationsLoaded = false;
            }
            annotationSystem.currentFile = activeViewer.epubPath;
            annotationSystem.fileType = 'epub';
            annotationSystem.currentEpubViewer = activeViewer;
            return;
        }
    }
    // Fallback: legacy markup-based detection (kept for templates that don't go through EPUBViewers)
    var epubContainer = $('#epub-viewer:visible, .epub-container:visible, .lazy-epub-container:visible').first();
    if (epubContainer.length > 0) {
        var epubSrc = epubContainer.attr('data-epub-path') || epubContainer.attr('src');
        if (epubSrc) {
            if (epubSrc !== previousFile) {
                annotationSystem.annotationsLoaded = false;
            }
            annotationSystem.currentFile = epubSrc;
            annotationSystem.fileType = 'epub';
            return;
        }
    }

    // Check for YouTube
    var youtube = $('.youtube:visible').first();
    if (youtube.length > 0) {
        var youtubeId = youtube.attr('id');
        if (youtubeId) {
            if (youtubeId !== previousFile) {
                annotationSystem.annotationsLoaded = false;
            }
            annotationSystem.currentFile = youtubeId;
            annotationSystem.fileType = 'youtube';
            return;
        }
    }

    // Check for any link
    var link = $('a:hover').last();
    if (link.length > 0) {
        var href = link.attr('href');
        if (href) {
            if (href !== previousFile) {
                annotationSystem.annotationsLoaded = false;
            }
            annotationSystem.currentFile = href;
            annotationSystem.fileType = 'link';
            return;
        }
    }

    var currentPath = window.location.pathname;
    if (currentPath !== previousFile) {
        annotationSystem.annotationsLoaded = false;
    }
    annotationSystem.currentFile = currentPath;
    annotationSystem.fileType = 'page';
}

// Toggle annotation mode on/off
function toggleAnnotationMode() {

    if (annotationSystem.active) {
        // Deactivate
        annotationSystem.active = false;
        $('#annotation_toggle_navbar').attr('src', 'capicon/svg/353.svg').hide();

        hideAllAnnotationMarkers();
        closeAnnotationPanel();
        removePdfEpubClickHandlers();

        // Remove crosshair cursor by removing class from modal and viewer
        $('#pdf-viewer-modal, #pdf-viewer-modal-content').removeClass('annotation-mode-active');

        if (window.syncPDFJSAnnotBtnState) window.syncPDFJSAnnotBtnState();
        if (window.syncEpubAnnotationCursor) window.syncEpubAnnotationCursor();
        if (window.syncAllEpubAnnotBtnStates) window.syncAllEpubAnnotBtnStates();

        console.log('Annotation mode deactivated');
    } else {
        // Activate
        detectCurrentFile();
        socket.emit('get_annotations', annotationSystem.currentFile);
        annotationSystem.active = true;

        $('#annotation_toggle_navbar').attr('src', 'capicon/svg/354.svg').show();

        // Add crosshair cursor by adding class to modal and viewer
        $('#pdf-viewer-modal, #pdf-viewer-modal-content').addClass('annotation-mode-active');

        if (window.syncPDFJSAnnotBtnState) window.syncPDFJSAnnotBtnState();

        // Wait a bit for DOM to be ready, then attach handlers
        setTimeout(function() {
            attachPdfEpubClickHandlers();
            // Reapply class in case modal was just created
            $('#pdf-viewer-modal, #pdf-viewer-modal-content').addClass('annotation-mode-active');
            console.log('Reapplied annotation-mode-active class');
        }, 500);

        if (window.syncEpubAnnotationCursor) window.syncEpubAnnotationCursor();
        if (window.syncAllEpubAnnotBtnStates) window.syncAllEpubAnnotBtnStates();

        console.log('Annotation mode activated for file:', annotationSystem.currentFile);
    }
}

// Attach click handlers to PDF and EPUB elements
function attachPdfEpubClickHandlers() {

    console.log('Attaching PDF/EPUB click handlers...');

    // Handle PDFs (object elements)
    var pdfObjects = $('object[type="application/pdf"]');
    console.log('Found ' + pdfObjects.length + ' PDF objects');

    pdfObjects.each(function() {
        var $obj = $(this);
        var $parent = $obj.parent();

        console.log('PDF object parent:', $parent[0]);

        // Make parent position relative if not already
        if ($parent.css('position') === 'static') {
            $parent.css('position', 'relative');
        }

        // Add click overlay
        var $overlay = $('<div/>')
            .addClass('pdf-click-overlay')
            .css({
                'position': 'absolute',
                'top': '0',
                'left': '0',
                'width': '100%',
                'height': '100%',
                'z-index': '1000',
                'cursor': 'crosshair',
                'background': 'rgba(255, 0, 0, 0.05)',  // Very subtle red for debugging
                'pointer-events': 'auto'  // Allow all pointer events
            });

        // Single click to potentially click markers
        $overlay.on('click', function(e) {
            // Check if we clicked on a marker
            if ($(e.target).hasClass('annotation-marker')) {
                // Let the marker handle it
                return;
            }
        });

        // Double click to create annotation
        $overlay.on('dblclick', function(e) {
            console.log('PDF overlay double-clicked!');

            // Check if we clicked on a marker
            if ($(e.target).hasClass('annotation-marker')) {
                return;  // Don't create new annotation
            }

            e.preventDefault();
            e.stopPropagation();

            var offset = $(this).offset();
            var location = {
                x: e.pageX - offset.left,
                y: e.pageY - offset.top,
                width: 0,
                height: 0
            };

            console.log('Creating annotation at:', location);
            detectCurrentFile();
            createNewAnnotation(location);
        });

        $parent.append($overlay);
        console.log('Overlay added to parent');
    });

    // Handle embed PDFs.
    //
    // The `.embed_pdf` class is misleading: extract_folder.html adds it to
    // EVERY file row (PDF, EPUB, DJVU). For EPUB/DJVU rows the row contains
    // a lazy viewer as a descendant, so a 100%×100% overlay would smother
    // the actual EPUB iframe and freeze the cursor on crosshair. Skip those.
    $('.embed_pdf').each(function() {
        var $elem = $(this);

        if ($elem.find('.lazy-epub-container, .lazy-djvu-container, .epubjs-viewer-wrap').length > 0) {
            return;  // EPUB/DJVU row — handled by their own dedicated hooks
        }

        if ($elem.css('position') === 'static') {
            $elem.css('position', 'relative');
        }

        var $overlay = $('<div/>')
            .addClass('pdf-click-overlay')
            .css({
                'position': 'absolute',
                'top': '0',
                'left': '0',
                'width': '100%',
                'height': '100%',
                'z-index': '10',
                'cursor': 'crosshair',
                'background': 'transparent'
            });

        $overlay.on('dblclick', function(e) {
            e.preventDefault();
            e.stopPropagation();

            var offset = $(this).offset();
            var location = {
                x: e.pageX - offset.left,
                y: e.pageY - offset.top,
                width: 0,
                height: 0
            };

            detectCurrentFile();
            createNewAnnotation(location);
        });

        $elem.append($overlay);
    });

    // EPUBs handle dblclick via the rendition's content hook (registered when
    // initEpubViewer creates the rendition). An overlay over the iframe doesn't
    // work because the iframe swallows the events; see attachEpubAnnotationHooks.
    // Marker rendering is triggered by `annotations_loaded` after the server
    // returns the data, so nothing extra to do here for EPUBs.
}

// Remove click handlers from PDF and EPUB elements
function removePdfEpubClickHandlers() {
    $('.pdf-click-overlay, .epub-click-overlay').remove();
}

// Load annotations from server
socket.on('annotations_loaded', function(data) {
    var result = JSON.parse(data);
    annotationSystem.annotations = result.annotations || [];

    // Mark that annotations have been loaded for this file (even if empty)
    annotationSystem.annotationsLoaded = true;

    console.log('Annotations loaded from server:', annotationSystem.annotations.length);

    if (annotationSystem.active) {
        // Use PDF-specific reload if in PDF.js viewer
        if (annotationSystem.fileType === 'pdf' && window.PDFViewer && window.PDFViewer.pdfDoc) {
            reloadPDFAnnotations();
        } else if (annotationSystem.fileType === 'epub' && window.repositionEpubAnnotations) {
            // EPUB markers are positioned by resolving stored CFIs against the
            // currently rendered chapter — that has to happen per-viewer.
            var viewerId = annotationSystem.currentEpubViewer
                ? annotationSystem.currentEpubViewer.viewerId
                : window.activeEpubViewerId;
            window.repositionEpubAnnotations(viewerId);
        } else {
            displayAnnotationMarkers();
        }
    }
});

// Display annotation markers on the page
// Create a temporary marker for a new annotation (before it's saved)
function createTemporaryMarker(annotation) {
    console.log('Creating temporary marker for annotation:', annotation.id);

    // Remove ONLY the previous temporary marker if it exists (not all temp markers)
    // This way we don't remove saved annotations that still have temp- IDs
    if (annotationSystem.previousTempId) {
        $('.annotation-marker[data-annotation-id="' + annotationSystem.previousTempId + '"]').remove();
    }
    annotationSystem.previousTempId = annotation.id;

    // For PDF.js viewer, append to annotation layer
    if (window.PDFViewer && window.PDFViewer.pdfDoc && annotation.page === window.PDFViewer.currentPage) {
        var $annotationLayer = $('#pdfjs-annotation-layer');

        if ($annotationLayer.length > 0) {
            var marker = $('<div/>').addClass('annotation-marker')
                                    .attr('data-annotation-id', annotation.id)
                                    .attr('title', 'New annotation')
                                    .css({
                                        'position': 'absolute',
                                        'left': annotation.location.x + 'px',
                                        'top': annotation.location.y + 'px'
                                    });

            $annotationLayer.append(marker);
            console.log('Temporary marker created in PDF.js annotation layer');
        }
        return;
    }

    // For EPUBs, append to EPUB.js's `.epub-container`. That's the element
    // that actually scrolls (overflow-y:scroll, position:relative, height
    // matching the configured render height). The iframe sits inside it at
    // offset (0,0) with full content height, so the range bounding rect we
    // captured maps directly to absolute coords in this container.
    if (annotationSystem.fileType === 'epub' && annotationSystem.currentEpubViewer) {
        var $epubRender = $('#' + annotationSystem.currentEpubViewer.renderId);
        var $scrollParent = $epubRender.find('.epub-container').first();
        if ($scrollParent.length === 0) $scrollParent = $epubRender;
        if ($scrollParent.length > 0) {
            $('<div/>').addClass('annotation-marker')
                .attr('data-annotation-id', annotation.id)
                .attr('title', 'New annotation')
                .css({
                    'position': 'absolute',
                    'left': annotation.location.x + 'px',
                    'top': annotation.location.y + 'px',
                    'pointer-events': 'auto'
                })
                .appendTo($scrollParent);
        }
    }
}

function displayAnnotationMarkers() {

    console.log('=== displayAnnotationMarkers called ===');
    console.log('Current file:', annotationSystem.currentFile);
    console.log('Annotations count:', annotationSystem.annotations.length);

    // Clear existing markers EXCEPT the one currently being edited
    if (annotationSystem.currentAnnotation && annotationSystem.currentAnnotation.id) {
        $('.annotation-marker').not('[data-annotation-id="' + annotationSystem.currentAnnotation.id + '"]').remove();
    } else {
        $('.annotation-marker').remove();
    }

    if (!annotationSystem.currentFile || annotationSystem.annotations.length === 0) {
        console.log('No annotations to display');
        return;
    }

    // Find and prepare container
    var container = findAnnotationContainer();
    console.log('Container:', container ? container[0] : 'none');

    if (container && container.length > 0) {
        // Make sure container has relative positioning
        if (container.css('position') === 'static') {
            container.css('position', 'relative');
        }
    }

    annotationSystem.annotations.forEach(function(annotation) {

        console.log('Creating marker for annotation:', annotation.id, 'at', annotation.location);

        var marker = $('<div/>').addClass('annotation-marker')
                                .attr('data-annotation-id', annotation.id)
                                .attr('title', annotation.content ? annotation.content.substring(0, 50) + '...' : 'Note');

        // Position the marker
        if (annotation.location) {
            marker.css({
                'position': 'absolute',
                'left': annotation.location.x + 'px',
                'top': annotation.location.y + 'px'
            });
        }

        // Click to view/edit annotation
        marker.on('click', function(e) {
            console.log('Marker clicked:', annotation.id);
            e.preventDefault();
            e.stopPropagation();
            $('.pdf-click-overlay').hide();  // Hide overlay when viewing annotation
            editAnnotation(annotation, e);
        });

        // Append to appropriate container
        if (container && container.length > 0) {
            container.append(marker);
            console.log('Marker appended to container');
        } else {
            $('body').append(marker);
            console.log('Marker appended to body');
        }
    });

    console.log('=== displayAnnotationMarkers done ===');
}

// Find the appropriate container for annotation markers
function findAnnotationContainer() {

    if (annotationSystem.fileType === 'pdf') {
        // Try to find the PDF object
        var pdfObject = $('object[type="application/pdf"]:visible').first();
        if (pdfObject.length > 0) {
            var parent = pdfObject.parent();

            // Create or find a wrapper div for annotations if it doesn't exist
            var wrapper = parent.find('.pdf-annotations-wrapper');
            if (wrapper.length === 0) {
                // Create wrapper that covers the PDF object
                wrapper = $('<div/>')
                    .addClass('pdf-annotations-wrapper')
                    .css({
                        'position': 'absolute',
                        'top': '0',
                        'left': '0',
                        'width': pdfObject.width() + 'px',
                        'height': pdfObject.height() + 'px',
                        'pointer-events': 'none',  // Don't block PDF interaction
                        'z-index': '1500'  // Above overlay
                    });

                // Make sure parent is positioned
                if (parent.css('position') === 'static') {
                    parent.css('position', 'relative');
                }

                parent.append(wrapper);
                console.log('Created PDF annotations wrapper');
            }

            // Make markers inside wrapper clickable
            wrapper.css('pointer-events', 'none');  // Wrapper transparent
            wrapper.find('.annotation-marker').css('pointer-events', 'auto');  // But markers clickable

            return wrapper;
        }

        // Fallback to embed_pdf
        var pdfEmbed = $('.embed_pdf:visible').first();
        if (pdfEmbed.length > 0) {
            return pdfEmbed.parent();
        }
    }

    if (annotationSystem.fileType === 'epub') {
        // Prefer the active EPUB viewer's render container — that's where
        // markers are positioned (absolute, in container content coords).
        if (annotationSystem.currentEpubViewer) {
            var $render = $('#' + annotationSystem.currentEpubViewer.renderId);
            if ($render.length > 0) return $render;
        }
        var epubContainer = $('#epub-viewer:visible, .epub-container:visible, .epubjs-viewer-render:visible').first();
        if (epubContainer.length > 0) {
            return epubContainer;
        }
    }

    return $('#content');
}

// Hide all annotation markers
function hideAllAnnotationMarkers() {
    $('.annotation-marker').remove();
}

// Create new annotation at clicked position
$(document).on('dblclick', function(e) {

    if (!annotationSystem.active) {
        return;
    }

    // Don't create annotation if clicking on existing marker or panel
    if ($(e.target).hasClass('annotation-marker') ||
        $(e.target).closest('#annotation_panel').length > 0) {
        return;
    }

    // Only detect current file if we're not already in a PDF context
    // PDF.js viewer sets currentFile explicitly, don't overwrite it
    if (!annotationSystem.currentFile || !annotationSystem.currentFile.includes('.pdf')) {
        detectCurrentFile();
    }

    var container = findAnnotationContainer();
    var offset = container ? container.offset() : {top: 0, left: 0};

    var location = {
        x: e.pageX - offset.left,
        y: e.pageY - offset.top,
        width: 0,
        height: 0
    };

    // If we're in PDF.js viewer, add page number and scale
    if (window.PDFViewer && window.PDFViewer.pdfDoc) {
        location.page = window.PDFViewer.currentPage;
        location.scale = window.PDFViewer.scale;
    }

    createNewAnnotation(location);
});

// Create a new annotation
function createNewAnnotation(location) {

    console.log('=== createNewAnnotation called ===');
    console.log('Location:', location);

    // Generate a temporary ID for the marker
    var tempId = 'temp-' + Date.now();

    annotationSystem.currentAnnotation = {
        id: tempId,
        type: 'text',
        location: location,
        content: '',
        color: '#ffff00'
    };

    console.log('Current annotation created:', annotationSystem.currentAnnotation);

    if (annotationSystem.fileType === 'pdf') {
        // For PDFs, use page number from location or default to 1
        annotationSystem.currentAnnotation.page = location.page || 1;
    }

    if (annotationSystem.fileType === 'epub') {
        // CFI + chapter are computed by handleEpubDblClick and passed in
        // via the location object — promote them onto the annotation itself
        // so they end up in the persisted YAML.
        annotationSystem.currentAnnotation.cfi = (location && location.cfi) ? location.cfi : '';
        if (location && typeof location.chapter === 'number') {
            annotationSystem.currentAnnotation.chapter = location.chapter;
        }
    }

    // Create a temporary marker immediately
    createTemporaryMarker(annotationSystem.currentAnnotation);

    // Temporarily remove PDF overlay so textarea is accessible
    console.log('Hiding PDF overlays');
    $('.pdf-click-overlay').hide();
    console.log('PDF overlays hidden, count:', $('.pdf-click-overlay').length);

    // Use viewport coords if available (from double-click), otherwise canvas-relative
    if (location.viewportX !== undefined && location.viewportY !== undefined) {
        showAnnotationPanel(location.viewportX, location.viewportY, 'New Note', true);
    } else {
        showAnnotationPanel(location.x, location.y, 'New Note', false);
    }
    $('#annotation_textarea').val('');
    $('#annotation_delete').hide();
    console.log('=== createNewAnnotation done ===');
}

// Edit an existing annotation
function editAnnotation(annotation, clickEvent) {

    annotationSystem.currentAnnotation = annotation;

    var title = 'Note';
    if (annotation.timestamp) {
        var date = new Date(annotation.timestamp);
        title += ' - ' + date.toLocaleString();
    }

    // Populate content + delete-button visibility BEFORE showing the panel,
    // so the moment it appears the user sees the saved text — no flash of
    // an empty textarea while the value is filled in afterwards.
    var ta = document.getElementById('annotation_textarea');
    if (ta) ta.value = annotation.content || '';
    var delBtn = document.getElementById('annotation_delete');
    if (delBtn) delBtn.style.display = '';

    if (clickEvent && clickEvent.clientX !== undefined && clickEvent.clientY !== undefined) {
        showAnnotationPanel(clickEvent.clientX, clickEvent.clientY, title, true);
    } else {
        showAnnotationPanel(annotation.location.x, annotation.location.y, title, false);
    }
}

// Show annotation panel
function showAnnotationPanel(x, y, title, isViewportCoords) {

    $('#annotation_title').text(title);

    var leftPos, topPos;
    var screenX, screenY;

    if (isViewportCoords) {
        screenX = x;
        screenY = y;
    }
    // If we're in PDF.js viewer modal, convert canvas-relative coords to screen coords
    else if (window.PDFViewer && window.PDFViewer.pdfDoc) {
        var currentPage = window.PDFViewer.currentPage;
        var $canvas = $('.pdfjs-canvas-container').eq(currentPage - 1);

        if ($canvas.length > 0) {
            var rect = $canvas[0].getBoundingClientRect();
            screenX = rect.left + x;
            screenY = rect.top + y;
        } else {
            screenX = x + 50;
            screenY = y;
        }
    } else {
        screenX = x + 50;
        screenY = y;
    }

    var panelWidth = 300;
    var panelHeight = 200;
    var windowWidth = $(window).width();
    var windowHeight = $(window).height();

    leftPos = screenX + 30;
    if (leftPos + panelWidth > windowWidth) {
        leftPos = screenX - panelWidth - 10;
        if (leftPos < 10) {
            leftPos = windowWidth - panelWidth - 10;
        }
    }

    topPos = screenY;
    if (topPos + panelHeight > windowHeight) {
        topPos = windowHeight - panelHeight - 10;
    }
    if (topPos < 10) {
        topPos = 10;
    }

    // Position the panel in one CSS write before making it visible, so the
    // browser only does a single reflow when it appears.
    var panel = document.getElementById('annotation_panel');
    if (panel) {
        panel.style.left = leftPos + 'px';
        panel.style.top = topPos + 'px';
        panel.style.zIndex = '10001';
        panel.style.backgroundColor = '#fbf6ea';
        panel.style.border = 'none';
        panel.style.display = 'block';
    }

    // Focus the textarea after the panel is on-screen.
    var ta = document.getElementById('annotation_textarea');
    if (ta) ta.focus();
}

// Close annotation panel
function closeAnnotationPanel() {
    // Only remove the marker if it's a temporary annotation (not yet saved)
    // Check if the annotation is temporary by:
    // 1. ID starts with "temp-" (newly created)
    // 2. NOT in the annotations array (not saved yet)
    if (annotationSystem.currentAnnotation &&
        annotationSystem.currentAnnotation.id &&
        annotationSystem.currentAnnotation.id.startsWith('temp-')) {

        // Double-check it's not in the saved annotations
        var isSaved = annotationSystem.annotations.some(function(ann) {
            return ann.id === annotationSystem.currentAnnotation.id;
        });

        if (!isSaved) {
            console.log('Removing temporary unsaved marker:', annotationSystem.currentAnnotation.id);
            $('.annotation-marker[data-annotation-id="' + annotationSystem.currentAnnotation.id + '"]').remove();
        } else {
            console.log('Keeping marker for saved annotation:', annotationSystem.currentAnnotation.id);
        }
    }

    $('#annotation_panel').hide();
    annotationSystem.currentAnnotation = null;

    // Restore PDF overlay
    $('.pdf-click-overlay').show();

    // Reload annotations to ensure all markers are visible
    if (window.PDFViewer && window.PDFViewer.pdfDoc) {
        reloadPDFAnnotations();
    } else if (annotationSystem.fileType === 'epub' && window.repositionEpubAnnotations) {
        var viewerId = annotationSystem.currentEpubViewer
            ? annotationSystem.currentEpubViewer.viewerId
            : window.activeEpubViewerId;
        window.repositionEpubAnnotations(viewerId);
    }
}

// Save current annotation
function saveCurrentAnnotation() {

    console.log('=== saveCurrentAnnotation called ===');

    if (!annotationSystem.currentAnnotation) {
        console.log('No current annotation');
        return;
    }

    // Prevent double saves
    if (annotationSystem.saving) {
        console.log('Already saving, ignoring duplicate call');
        return;
    }
    annotationSystem.saving = true;

    var content = $('#annotation_textarea').val().trim();

    if (content === '') {
        annotationSystem.saving = false;
        showNotification('Note content cannot be empty', 'error');
        return;
    }

    // Update annotation content
    annotationSystem.currentAnnotation.content = content;

    // Ensure timestamp is set
    if (!annotationSystem.currentAnnotation.timestamp) {
        annotationSystem.currentAnnotation.timestamp = new Date().toISOString();
    }

    // Ensure filePath is set on the annotation itself for reference
    annotationSystem.currentAnnotation.filePath = annotationSystem.currentFile;
    annotationSystem.currentAnnotation.fileType = annotationSystem.fileType;

    console.log('Saving annotation:', annotationSystem.currentAnnotation);
    console.log('For file:', annotationSystem.currentFile);

    var annotationData = {
        filePath: annotationSystem.currentFile,
        annotation: annotationSystem.currentAnnotation
    };

    socket.emit('save_annotation', JSON.stringify(annotationData));
}

// Handle successful annotation save
socket.on('annotation_saved', function(data) {
    var result = JSON.parse(data);

    // Reset saving flag
    annotationSystem.saving = false;

    if (result.success) {
        showNotification('Note saved successfully', 'success');

        // Remove temporary marker before adding the permanent one
        $('.annotation-marker[data-annotation-id^="temp-"]').remove();

        // Update local annotations array
        var existingIndex = annotationSystem.annotations.findIndex(
            ann => ann.id === result.annotation.id
        );

        if (existingIndex !== -1) {
            annotationSystem.annotations[existingIndex] = result.annotation;
        } else {
            annotationSystem.annotations.push(result.annotation);
        }

        // Refresh markers - use PDF-specific reload if in PDF.js viewer
        // Check if the annotation has a page property (indicates it's a PDF annotation)
        if (result.annotation.page && window.PDFViewer && window.PDFViewer.pdfDoc) {
            reloadPDFAnnotations();
        } else if (result.annotation.fileType === 'epub' && window.repositionEpubAnnotations) {
            var viewerId = annotationSystem.currentEpubViewer
                ? annotationSystem.currentEpubViewer.viewerId
                : window.activeEpubViewerId;
            window.repositionEpubAnnotations(viewerId);
        } else {
            displayAnnotationMarkers();
        }
        closeAnnotationPanel();
    }
});

// Handle annotation updates from other clients
socket.on('annotation_updated', function(data) {
    var result = JSON.parse(data);

    // Only reload if this is not our own save (avoid duplicates)
    // We already handled our own saves in 'annotation_saved'
    // This is only for updates from OTHER clients
    // Skip it for now to avoid duplicates
    console.log('annotation_updated received (from broadcast), ignoring to avoid duplicates');
});

// Delete current annotation
function deleteCurrentAnnotation() {

    if (!annotationSystem.currentAnnotation || !annotationSystem.currentAnnotation.id) {
        return;
    }

    if (!confirm('Are you sure you want to delete this note?')) {
        return;
    }

    var deleteData = {
        filePath: annotationSystem.currentFile,
        annotationId: annotationSystem.currentAnnotation.id
    };

    socket.emit('delete_annotation', JSON.stringify(deleteData));
}

// Handle successful annotation deletion
socket.on('annotation_deleted', function(data) {
    var result = JSON.parse(data);

    if (result.success) {
        showNotification('Note deleted successfully', 'success');

        // Remove from local array
        annotationSystem.annotations = annotationSystem.annotations.filter(
            ann => ann.id !== result.annotationId
        );

        // Refresh markers — dispatch by file type
        if (annotationSystem.fileType === 'pdf' && window.PDFViewer && window.PDFViewer.pdfDoc) {
            reloadPDFAnnotations();
        } else if (annotationSystem.fileType === 'epub' && window.repositionEpubAnnotations) {
            var viewerId = annotationSystem.currentEpubViewer
                ? annotationSystem.currentEpubViewer.viewerId
                : window.activeEpubViewerId;
            window.repositionEpubAnnotations(viewerId);
        } else {
            displayAnnotationMarkers();
        }
        closeAnnotationPanel();
    }
});

// Handle annotation removal from other clients
socket.on('annotation_removed', function(data) {
    var result = JSON.parse(data);

    if (result.filePath === annotationSystem.currentFile) {
        // Reload annotations for this file
        socket.emit('get_annotations', annotationSystem.currentFile);
    }
});

// Handle annotation errors
socket.on('annotation_error', function(errorMsg) {
    showNotification('Error: ' + errorMsg, 'error');
});

// Voice command support for creating annotations
socket.on('create_new_annotation', function() {
    if (annotationSystem.active) {
        var elem = $(':hover').last();
        var offset = elem.offset() || {top: 100, left: 100};
        createNewAnnotation({
            x: offset.left,
            y: offset.top,
            width: 0,
            height: 0
        });
    } else {
        toggleAnnotationMode();
    }
});

//===========================================
// PDF.js Viewer Integration
//===========================================

// Setup double-click handler for PDF.js viewer annotations
function setupPDFJSAnnotationHandlers() {

    console.log('Setting up PDF.js annotation handlers');

    // Remove old handlers to avoid duplicates
    $(document).off('dblclick', '.pdfjs-page-canvas, .pdfjs-text-layer, #pdfjs-annotation-layer');

    // Add double-click handler to PDF canvas, text layer AND annotation layer
    $(document).on('dblclick', '.pdfjs-page-canvas, .pdfjs-text-layer, #pdfjs-annotation-layer', function(e) {

        console.log('=== PDF.js double-clicked ===');
        console.log('Target:', e.target.className);

        // Always prevent default and stop propagation FIRST to prevent other handlers from firing
        e.preventDefault();
        e.stopPropagation();

        if (!annotationSystem.active) {
            console.log('Annotation system not active');
            return;
        }

        // Clear any text selection that was created by the double-click itself
        // We want to allow annotations even if double-clicking on text
        if (window.getSelection) {
            window.getSelection().removeAllRanges();
        }

        // Get the canvas container for position calculation
        var $container = $(this).closest('.pdfjs-canvas-container');
        if ($container.length === 0) {
            console.error('Could not find canvas container');
            return;
        }

        // Use getBoundingClientRect for accurate positioning relative to viewport
        var rect = $container[0].getBoundingClientRect();

        // Calculate canvas-relative coords for storing the annotation position
        var canvasX = e.clientX - rect.left;
        var canvasY = e.clientY - rect.top;

        // For panel positioning, we need viewport coords that account for the modal position
        // Get the modal container position
        var $modal = $('#pdf-viewer-modal');
        var modalRect = $modal.length > 0 ? $modal[0].getBoundingClientRect() : {left: 0, top: 0};

        // Calculate position relative to modal
        var modalRelativeX = e.clientX - modalRect.left;
        var modalRelativeY = e.clientY - modalRect.top;

        var location = {
            x: canvasX - 20,  // Apply -20px offset for star positioning (to the left)
            y: canvasY - 20,  // Apply -20px offset for star positioning (higher)
            width: 0,
            height: 0,
            page: window.PDFViewer ? window.PDFViewer.currentPage : 1,
            scale: window.PDFViewer ? window.PDFViewer.scale : 1.5,  // Save the scale at creation time
            // Store ABSOLUTE viewport coords for panel positioning
            viewportX: e.clientX,
            viewportY: e.clientY
        };

        console.log('=== Double-click annotation creation ===');
        console.log('Mouse viewport coords:', {clientX: e.clientX, clientY: e.clientY});
        console.log('Canvas rect:', {left: rect.left, top: rect.top, width: rect.width, height: rect.height});
        console.log('Modal rect:', {left: modalRect.left, top: modalRect.top});
        console.log('Modal-relative coords:', {x: modalRelativeX, y: modalRelativeY});
        console.log('Calculated canvas-relative location:', {x: location.x, y: location.y});
        console.log('Page:', location.page, 'Scale:', location.scale);

        detectCurrentFile();
        createNewAnnotation(location);
    });
}

// Export globally
window.setupPDFJSAnnotationHandlers = setupPDFJSAnnotationHandlers;

// Reload annotations for current PDF.js page
function reloadPDFAnnotations() {

    console.log('=== reloadPDFAnnotations ===');

    // Only reload annotations if annotation mode is active
    if (!annotationSystem.active) {
        console.log('Annotation mode not active, skipping marker display');
        return;
    }

    if (!window.PDFViewer || !annotationSystem.currentFile) {
        console.log('PDF viewer or currentFile not ready');
        return;
    }

    var currentPage = window.PDFViewer.currentPage;

    console.log('Current page:', currentPage);
    console.log('Total annotations:', annotationSystem.annotations.length);

    // If annotations haven't been loaded yet for this file, request them from server
    // Use a flag instead of checking array length to avoid infinite loops
    if (!annotationSystem.annotationsLoaded && annotationSystem.currentFile) {
        console.log('Annotations not loaded yet, requesting from server...');
        socket.emit('get_annotations', annotationSystem.currentFile);
        return; // Will be called again when annotations are loaded
    }

    // Clear existing markers EXCEPT the one currently being edited
    if (annotationSystem.currentAnnotation && annotationSystem.currentAnnotation.id) {
        $('#pdfjs-annotation-layer .annotation-marker').not('[data-annotation-id="' + annotationSystem.currentAnnotation.id + '"]').remove();
    } else {
        $('#pdfjs-annotation-layer .annotation-marker').remove();
    }

    // Filter annotations for current page
    var pageAnnotations = annotationSystem.annotations.filter(function(ann) {
        return ann.page === currentPage || !ann.page;  // Show annotations without page on all pages
    });

    console.log('Annotations for page', currentPage + ':', pageAnnotations.length);

    // Get current scale
    var currentScale = window.PDFViewer.scale;

    // Display markers for this page
    pageAnnotations.forEach(function(annotation) {

        var marker = $('<div/>').addClass('annotation-marker')
                                .attr('data-annotation-id', annotation.id)
                                .attr('title', annotation.content ? annotation.content.substring(0, 50) + '...' : 'Note');

        // Position the marker, adjusting for scale
        if (annotation.location) {
            // Get the scale at which the annotation was created (default to 1.5 for old annotations)
            var annotationScale = annotation.location.scale || 1.5;

            // Calculate scale ratio
            var scaleRatio = currentScale / annotationScale;

            // Adjust position based on scale ratio
            var adjustedX = annotation.location.x * scaleRatio;
            var adjustedY = annotation.location.y * scaleRatio;

            console.log('Annotation', annotation.id, 'created at scale', annotationScale,
                       'displayed at scale', currentScale, 'ratio', scaleRatio,
                       'original pos:', annotation.location.x, annotation.location.y,
                       'adjusted pos:', adjustedX, adjustedY);

            marker.css({
                'position': 'absolute',
                'left': adjustedX + 'px',
                'top': adjustedY + 'px',
                'pointer-events': 'auto'
            });
        }

        // Click to view/edit annotation
        marker.on('click', function(e) {
            console.log('Marker clicked:', annotation.id);
            e.preventDefault();
            e.stopPropagation();
            editAnnotation(annotation, e);
        });

        $('#pdfjs-annotation-layer').append(marker);
    });

    console.log('=== reloadPDFAnnotations done ===');
}

// Make functions globally available
window.reloadPDFAnnotations = reloadPDFAnnotations;
window.closeAnnotationPanel = closeAnnotationPanel;
window.toggleAnnotationMode = toggleAnnotationMode;

//===========================================
// EPUB.js Viewer Integration (CFI-anchored)
//===========================================

// EPUB.js renders each chapter into its own iframe. The outer page can't
// listen for events inside the iframe via document.on('dblclick', ...),
// so we hook into rendition.hooks.content — which fires every time a
// chapter is rendered — to attach listeners directly to the iframe's
// document. Same for marker positioning: we resolve a stored CFI to a
// DOM Range inside the iframe, then place the marker in the outer
// container at the range's bounding rect (the iframe sits at offset 0,0
// inside the .epubjs-viewer-render scrollable container, so the rect
// coords work directly as absolute positions).

function getCaretRangeFromPoint(doc, x, y) {
    if (doc.caretRangeFromPoint) {
        return doc.caretRangeFromPoint(x, y);
    }
    if (doc.caretPositionFromPoint) {
        var pos = doc.caretPositionFromPoint(x, y);
        if (!pos) return null;
        var r = doc.createRange();
        r.setStart(pos.offsetNode, pos.offset);
        r.setEnd(pos.offsetNode, pos.offset);
        return r;
    }
    return null;
}

function getViewIframe(view, contents) {
    if (view && view.iframe) return view.iframe;
    if (contents && contents.iframe) return contents.iframe;
    if (view && view.element) {
        var ifr = view.element.querySelector ? view.element.querySelector('iframe') : null;
        if (ifr) return ifr;
    }
    return null;
}

// Compute an iframe's position in its container's CONTENT coordinate space
// (i.e. what an absolutely-positioned child of the container would need as
// `top`/`left` to align with the iframe's top-left).
//
// Uses getBoundingClientRect rather than offsetParent walking so we don't
// depend on assumptions about EPUB.js's internal wrapper structure or which
// elements are positioned. The container's scrollTop is added so the result
// lives in content coords (not the visible-viewport-relative coords that
// getBoundingClientRect returns).
function iframeOffsetInContainer(iframe, container) {
    if (!iframe || !container) return { x: 0, y: 0 };
    var iRect = iframe.getBoundingClientRect();
    var cRect = container.getBoundingClientRect();
    return {
        x: iRect.left - cRect.left + (container.scrollLeft || 0),
        y: iRect.top - cRect.top + (container.scrollTop || 0)
    };
}

// Locate the iframe whose document holds the given Range, regardless of
// how deeply EPUB.js has nested it. Returns null for cross-origin frames.
function findIframeForRange(range) {
    try {
        var doc = range.startContainer && range.startContainer.ownerDocument;
        return (doc && doc.defaultView && doc.defaultView.frameElement) || null;
    } catch (err) {
        return null;
    }
}

function handleEpubDblClick(viewer, contents, view, e) {

    if (!annotationSystem.active) return;

    e.preventDefault();
    e.stopPropagation();

    // Make sure annotation system targets THIS viewer's file. If the user
    // double-clicks in a different EPUB than the one currently tracked,
    // switch context and (re-)load its annotations.
    if (annotationSystem.currentFile !== viewer.epubPath) {
        annotationSystem.currentFile = viewer.epubPath;
        annotationSystem.fileType = 'epub';
        annotationSystem.annotationsLoaded = false;
        annotationSystem.currentEpubViewer = viewer;
        socket.emit('get_annotations', viewer.epubPath);
    } else {
        annotationSystem.currentEpubViewer = viewer;
    }

    var doc = contents.document;
    var range = getCaretRangeFromPoint(doc, e.clientX, e.clientY);
    if (!range) {
        console.warn('EPUB dblclick: no caret range at point');
        return;
    }

    var cfi = '';
    try { cfi = contents.cfiFromRange(range); } catch (err) {}
    if (!cfi) {
        try { cfi = viewer.rendition.cfiFromRange ? viewer.rendition.cfiFromRange(range) : ''; } catch (err) {}
    }
    if (!cfi) {
        console.warn('EPUB dblclick: could not derive CFI');
        return;
    }

    // range.getBoundingClientRect() is in iframe-viewport coords. With
    // flow:'scrolled-doc' the iframe height equals its content height, so
    // those coords are the absolute offset within the iframe document.
    // To translate that to .epub-container coords (where we attach markers),
    // add the iframe's cumulative offset within .epub-container — EPUB.js
    // may wrap the iframe in a per-view div, so a single offsetTop/Left
    // isn't enough.
    var rangeRect = range.getBoundingClientRect();

    var iframe = getViewIframe(view, contents);
    var iframeRect = iframe ? iframe.getBoundingClientRect() : { left: 0, top: 0 };

    var $render = $('#' + viewer.renderId);
    var $epubContainer = $render.find('.epub-container').first();
    var epubContainerEl = $epubContainer.length ? $epubContainer[0] : null;
    var iframeOffset = iframeOffsetInContainer(iframe, epubContainerEl);

    var loc = viewer.rendition.currentLocation();
    var chapter = (loc && loc.start && typeof loc.start.index === 'number') ? loc.start.index : null;

    // Marker position in .epub-container CONTENT coords (where it'll be
    // placed via position:absolute).
    var markerContentX = iframeOffset.x + rangeRect.left - 12;
    var markerContentY = iframeOffset.y + rangeRect.top - 12;

    // Panel position in OUTER document VIEWPORT coords. Derive it from the
    // marker's visual position (which we know is correct because the star
    // appears at the click). This works whether `.epub-container` itself
    // scrolls or whether the outer page scrolls — getBoundingClientRect
    // already accounts for both, and we just subtract the container's own
    // scroll to get content→viewport correctly.
    var containerRect = epubContainerEl
        ? epubContainerEl.getBoundingClientRect()
        : iframeRect;
    var containerScrollLeft = epubContainerEl ? (epubContainerEl.scrollLeft || 0) : 0;
    var containerScrollTop = epubContainerEl ? (epubContainerEl.scrollTop || 0) : 0;
    var clickViewportX = containerRect.left + markerContentX + 12 - containerScrollLeft;
    var clickViewportY = containerRect.top + markerContentY + 12 - containerScrollTop;

    var location = {
        x: markerContentX,
        y: markerContentY,
        cfi: cfi,
        chapter: chapter,
        viewportX: clickViewportX,
        viewportY: clickViewportY
    };

    createNewAnnotation(location);
}

window.attachEpubAnnotationHooks = function(viewer) {

    if (!viewer || !viewer.rendition || !viewer.rendition.hooks) return;
    // Guard against double-attach (the plugin file is included twice via the
    // base.html block, and this would otherwise stack listeners).
    if (viewer._annotHooksAttached) return;
    viewer._annotHooksAttached = true;

    viewer.rendition.hooks.content.register(function(contents, view) {
        // Defensive: contents.document may be missing on some EPUBs (rare).
        if (!contents || !contents.document) return;
        contents.document.addEventListener('dblclick', function(e) {
            handleEpubDblClick(viewer, contents, view, e);
        });
        // (No iframe cursor injection: the toolbar annotation button gets a
        // .active class to signal mode; injecting CSS into each chapter's
        // iframe head was both redundant and prone to leaving stale crosshair
        // cursors when iframe doc references went stale across chapter swaps.)
    });

    // After each chapter render, refresh markers if this viewer's file is the
    // one annotation mode is tracking.
    viewer.rendition.on('rendered', function() {
        if (annotationSystem.active && annotationSystem.currentFile === viewer.epubPath) {
            // Small delay so EPUB.js has fully populated the iframe DOM and
            // CFI ↔ Range resolution actually finds the text.
            setTimeout(function() { window.repositionEpubAnnotations(viewer.viewerId); }, 150);
        }
    });
};

// Debounce per viewer so a burst of save / chapter-render / font-change
// events coalesces into a single repaint. Without this, ~each click and
// each scroll would tear down + rebuild every marker. Kept short so
// toggling annotation mode feels instant.
var _epubRepositionTimers = {};
window.repositionEpubAnnotations = function(viewerId) {
    if (!viewerId) viewerId = window.activeEpubViewerId;
    if (!viewerId) return;
    clearTimeout(_epubRepositionTimers[viewerId]);
    _epubRepositionTimers[viewerId] = setTimeout(function() {
        delete _epubRepositionTimers[viewerId];
        _repositionEpubAnnotationsImpl(viewerId);
    }, 50);
};

function _repositionEpubAnnotationsImpl(viewerId) {

    if (!window.EPUBViewers || !window.EPUBViewers[viewerId]) return;
    var viewer = window.EPUBViewers[viewerId];
    var $render = $('#' + viewer.renderId);
    if ($render.length === 0) return;
    // Markers attach to .epub-container (the actual scroll parent created by
    // EPUB.js). Fall back to the render div if EPUB.js hasn't injected it yet.
    var $container = $render.find('.epub-container').first();
    if ($container.length === 0) $container = $render;

    // Only act on the viewer whose file the annotation system is tracking.
    if (annotationSystem.currentFile !== viewer.epubPath) return;

    if (!annotationSystem.active) {
        $container.find('.annotation-marker').remove();
        return;
    }

    // Clear existing markers EXCEPT the one currently being edited
    if (annotationSystem.currentAnnotation && annotationSystem.currentAnnotation.id) {
        $container.find('.annotation-marker').not('[data-annotation-id="' + annotationSystem.currentAnnotation.id + '"]').remove();
    } else {
        $container.find('.annotation-marker').remove();
    }

    if (!annotationSystem.annotations || annotationSystem.annotations.length === 0) return;

    var loc = viewer.rendition.currentLocation();
    var currentChapter = (loc && loc.start && typeof loc.start.index === 'number') ? loc.start.index : null;

    var containerEl = $container[0];

    // ---- READ PHASE ----
    // Synchronously gather all (annotation, rect) pairs first. By keeping
    // every layout-reading call consecutive and avoiding any DOM writes
    // between them, the browser triggers exactly ONE layout flush for the
    // whole batch instead of one per annotation. This is the big win on
    // huge EPUB iframes.
    var firstRange = null;
    var jobs = [];
    annotationSystem.annotations.forEach(function(ann) {
        if (!ann.cfi) return;
        if (typeof ann.chapter === 'number' && currentChapter !== null && ann.chapter !== currentChapter) {
            return;
        }
        var range;
        try { range = viewer.rendition.getRange(ann.cfi); } catch (err) { return; }
        if (!range) return;
        var rect = range.getBoundingClientRect();
        if (!rect.width && !rect.height && !rect.left && !rect.top) return;
        if (!firstRange) firstRange = range;
        jobs.push({ ann: ann, left: rect.left, top: rect.top });
    });

    if (jobs.length === 0) return;

    // Iframe offset within the container — same for every job in this
    // chapter, so compute once. Done after the read phase to share the
    // already-fresh layout.
    var offset = iframeOffsetInContainer(findIframeForRange(firstRange), containerEl);

    // ---- WRITE PHASE ----
    // Build all markers into a DocumentFragment, then attach the fragment
    // in a single appendChild call. One write, one reflow. Handlers go
    // directly on the elements (cheaper than jQuery event delegation,
    // which would have to walk up the DOM on every click).
    var fragment = document.createDocumentFragment();
    jobs.forEach(function(job) {
        var marker = document.createElement('div');
        marker.className = 'annotation-marker';
        marker.setAttribute('data-annotation-id', job.ann.id);
        marker.title = job.ann.content ? job.ann.content.substring(0, 50) + '...' : 'Note';
        var s = marker.style;
        s.position = 'absolute';
        s.left = (offset.x + job.left - 12) + 'px';
        s.top = (offset.y + job.top - 12) + 'px';
        s.pointerEvents = 'auto';

        var ann = job.ann;
        marker.addEventListener('click', function(ev) {
            ev.preventDefault();
            ev.stopPropagation();
            editAnnotation(ann, ev);
        });

        fragment.appendChild(marker);
    });
    containerEl.appendChild(fragment);
}

// Update the .active state of every EPUB viewer's toolbar button so each
// viewer's button reflects whether its file is currently being annotated.
function syncAllEpubAnnotBtnStates() {
    if (!window.EPUBViewers) return;
    Object.keys(window.EPUBViewers).forEach(function(id) {
        var v = window.EPUBViewers[id];
        if (v && typeof v.syncAnnotBtnState === 'function') {
            v.syncAnnotBtnState();
        }
    });
}
window.syncAllEpubAnnotBtnStates = syncAllEpubAnnotBtnStates;

// (Previously: syncEpubAnnotationCursor toggled a class on each iframe's
// documentElement to set crosshair cursor. Removed — the toolbar button
// state is sufficient signal, and the iframe-doc tracking caused the cursor
// to occasionally stick after chapter changes.)
window.syncEpubAnnotationCursor = function() {};  // no-op stub for callers

// Initialize when document is ready
$(document).ready(function() {
    initAnnotationSystem();
    setupPDFJSAnnotationHandlers();
});

</script>
