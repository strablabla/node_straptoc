<script src="lib/keymaster.js"></script>

<script>

/*

Make the pics bigger..

*/

var curr_photo = ''
var wpic = 300
var hpic = 600
var list_big_pics = []
var nb_bpics = 0 // nb of bg pics
var pic_yet_open = []
var one_img = false
var targetMaxDim = 500 // Taille cible pour la plus grande dimension

function make_big_pic(wpic, hpic, idpic){

    var new_pic =  $('<div/>').attr('id', idpic)  //
                              .css({  'position':'fixed',
                                      'border-style':'solid',
                                      'border-width': '10px',
                                      'border-color': 'white',
                                      'box-shadow': '0.1em 0.1em 1.2em',
                                      'top':110 + 10*nb_bpics+'px',
                                      'right':200 + 10*nb_bpics+'px',
                                      'width': wpic + 10 + 'px',
                                      'height': hpic + 10 + 'px',
                                      'z-index': 20 + nb_bpics
                                    })
    //--- Menu de disposition
    var layoutMenu = $('<div/>').addClass('layout-menu').css({
        'position': 'absolute',
        'top': '5px',
        'left': '5px',
        'z-index': '100'
    })

    var menuBtn = $('<div/>').html('&#9776;').css({
        'background': 'rgba(0,0,0,0.6)',
        'color': 'white',
        'padding': '3px 8px',
        'cursor': 'pointer',
        'border-radius': '3px',
        'font-size': '14px'
    })

    var menuDropdown = $('<div/>').addClass('layout-dropdown').css({
        'display': 'none',
        'position': 'absolute',
        'top': '25px',
        'left': '0',
        'background': 'white',
        'border': '1px solid #ccc',
        'border-radius': '3px',
        'box-shadow': '2px 2px 5px rgba(0,0,0,0.3)',
        'min-width': '150px'
    })

    var optCascade = $('<div/>').text('Cascade').css({
        'padding': '8px 12px',
        'cursor': 'pointer',
        'border-bottom': '1px solid #eee'
    }).hover(
        function(){ $(this).css('background', '#f0f0f0') },
        function(){ $(this).css('background', 'white') }
    ).click(function(e){
        e.stopPropagation()
        applyCascadeLayout()
        menuDropdown.hide()
    })

    var optCircle = $('<div/>').text('Circle').css({
        'padding': '8px 12px',
        'cursor': 'pointer',
        'border-bottom': '1px solid #eee'
    }).hover(
        function(){ $(this).css('background', '#f0f0f0') },
        function(){ $(this).css('background', 'white') }
    ).click(function(e){
        e.stopPropagation()
        applyCircleLayout()
        menuDropdown.hide()
    })

    var optCloseAll = $('<div/>').text('Close all').css({
        'padding': '8px 12px',
        'cursor': 'pointer'
    }).hover(
        function(){ $(this).css('background', '#f0f0f0') },
        function(){ $(this).css('background', 'white') }
    ).click(function(e){
        e.stopPropagation()
        reset_bigpic()
        menuDropdown.hide()
    })

    menuDropdown.append(optCascade).append(optCircle).append(optCloseAll)
    layoutMenu.append(menuBtn).append(menuDropdown)

    menuBtn.click(function(e){
        e.stopPropagation()
        $('.layout-dropdown').not(menuDropdown).hide()
        menuDropdown.toggle()
    })

    new_pic.append(layoutMenu)

    //--- Slider

    var inp_slider = $('<input>').attr('id','imslider_'+ idpic)
                                 .attr('data-slider-id','slider_'+ idpic)
                                 .attr('data-slider-min',"-1")
                                 .attr('data-slider-max',"1")
                                 .attr('data-slider-step',"0.01")
                                 .attr('data-slider-value',"0")
                                 .attr('data-provide',"slider")
    var pic_slider = $('<div/>').append(inp_slider)
                                .css({'position':'absolute',
                                      'bottom':'-50px'})

    //-------

    var new_img = $('<img/>').attr('id','imbp_'+ idpic)

    new_pic.append(new_img)
    new_pic.addClass('bigpic')
    new_pic.append(pic_slider)

    new_pic.draggable().hide()

    // Bring to front on click
    new_pic.click(function(e){
        // Don't trigger on slider
        if ($(e.target).hasClass('slider') || $(e.target).closest('.slider').length) return;
        // Find max z-index among all bigpics
        var maxZ = 20;
        $('.bigpic').each(function(){
            var z = parseInt($(this).css('z-index')) || 20;
            if (z > maxZ) maxZ = z;
        });
        // Set this one higher
        $(this).css('z-index', maxZ + 1);
    });

    // close the current open photo

    new_pic.dblclick(function(){
          //alert( $(this).attr('id') )
          $(this).hide()
          var addr_pic = $(this).find('img').attr('src')
          var ind = pic_yet_open.indexOf(addr_pic)
          pic_yet_open.splice(ind,1)
          list_big_pics.splice(ind,1)
          //nb_bpics -= 1
    })

    $('#content').append(new_pic) //

    return new_pic

}

//var bigpic_panel = make_big_pic(wpic, hpic, "bigpic_panel")

// option for watching only one photo at a time or many

key('alt+i',function(){

    one_img = !one_img

})

// reset all the parameters

function reset_bigpic(){
    $('.bigpic').remove()
    //$('.bigpic').hide()
    list_big_pics = []
    nb_bpics = 0 // nb of bg pics
    pic_yet_open = []

}

// Double click to close all the photos

$('figure').dblclick(function(){
    if ($(this).parent().hasClass('thumbnail')){
        reset_bigpic()
    }
  })

function vertical_with_ratio(img,ratio_hw,wpic){

      //alert('wpic ' + wpic)
      nw = wpic
      nh = nw*ratio_hw
      img.parent().css({
        'width': nw + 10 + 'px',
        'height': nh + 10 + 'px',
      })
      img.css({'width' : nw + 'px',
               'height' : nh -10 + 'px',
               'margin' : '0px'})

}

function horizontal_with_ratio(img,ratio_hw,hpic){

      //alert('hpic ' + hpic)
      nh = hpic
      nw = nh/ratio_hw
      img.parent().css({
        'width': nw + 10 + 'px',
        'height': nh + 10 + 'px',
      })
      img.css({'width' : nw + 'px',
               'height' : nh -10 + 'px',
               'margin' : '0px'})

}

function save_wh_xy(p){

      p.attr('w',p.width())
      p.attr('h',p.height())
      // Sauvegarder les dimensions originales seulement la première fois
      if (!p.attr('orig_w')) {
          p.attr('orig_w', p.width())
          p.attr('orig_h', p.height())
      }
      p.attr('x',parseInt(p.parent().css('right')) || parseInt(p.parent().css('left')))
      p.attr('y',parseInt(p.parent().css('top')))

}

function adapt_pic_dim(new_pic){

      var w = new_pic.width()
      var h = new_pic.height()

      // Calculer le facteur pour que la plus grande dimension fasse targetMaxDim (500px)
      var maxDim = Math.max(w, h)
      var scaleFactor = targetMaxDim / maxDim

      var newW = Math.round(w * scaleFactor)
      var newH = Math.round(h * scaleFactor)

      new_pic.parent().css({
        'width': (newW + 20) + 'px',
        'height': (newH + 20) + 'px',
      })
      new_pic.css({
        'width': newW + 'px',
        'height': newH + 'px',
        'margin': '0px'
      })

      save_wh_xy(new_pic)
}

function add_new_bigpic(addr_pic){

    //alert('oppp')
    pic_yet_open.push(addr_pic)
    nb_bpics += 1
    id_new_pic = 'bp' + nb_bpics
    list_big_pics.push( make_big_pic(wpic, hpic, id_new_pic) )
    list_big_pics[pic_yet_open.length-1].show()
    // <img/> object..
    var new_pic = $('#imbp_' + id_new_pic)
    // add the src..
    modif_img = new_pic.attr( 'src', addr_pic )

    // adapt the size

    $(modif_img).load(function() {

          adapt_pic_dim(new_pic)

      })

}


function act_deact_drag_slider(){

        var curr_img = null
        $('.slider').mouseover(function(){
                             curr_img = $(this).parents().eq(1)
                             curr_img.draggable({ disabled: true});
                          }).mouseout(function(){
                             curr_img.draggable({ disabled: false});
                          })
        }




function change_dim_with_slider(pic,val){

      var w = pic.attr('w')
      var h = pic.attr('h')
      pic.css({'width':w*(1+val)+'px'})
      pic.parent().css({'width':w*(1+val)+10})
      pic.css({'height':h*(1+val)-10+'px'})
      pic.parent().css({'height':h*(1+val)+10})
      //----
      pp = pic.parent()
      var y = parseInt(pic.attr('y'))
      var x = parseInt(pic.attr('x'))
      pp.css({'top':y-h*val+'px'})
      pp.css({'right':x-w*val+'px'})

}

function hook_slider(picId){

        var currentId = picId || ('bp' + nb_bpics)
        var slider = $('#imslider_' + currentId)
        slider.bootstrapSlider({                                                   // slider for opacity
              formatter: function(val) {
                    var pic = $('#imbp_' + currentId)
                    change_dim_with_slider(pic,val)
                  }
              })
        act_deact_drag_slider()

}

function save_pos_drag(){

      $( ".bigpic" ).draggable({
       drag: function( event, ui ) {
            var img = $(this).find('img')
            save_wh_xy(img)
       }
      });

}

// Disposition en cascade
function applyCascadeLayout(){
    var pics = $('.bigpic:visible')
    if (pics.length === 0) return

    // Calculer le décalage basé sur la taille cible (1/5 de 600px)
    var offsetX = Math.round(targetMaxDim / 5)
    var offsetY = Math.round(targetMaxDim / 5)

    // Position de départ (en haut à gauche, 200px du bord gauche)
    var startTop = 100
    var startLeft = 200

    // Appliquer la taille et position à toutes les photos
    pics.each(function(index){
        var img = $(this).find('img')
        var origW = parseInt(img.attr('orig_w')) || parseInt(img.attr('w')) || 300
        var origH = parseInt(img.attr('orig_h')) || parseInt(img.attr('h')) || 400

        // Calculer le facteur pour que la plus grande dimension fasse 600px
        var maxDim = Math.max(origW, origH)
        var scaleFactor = targetMaxDim / maxDim

        // Calculer la nouvelle taille
        var newW = Math.round(origW * scaleFactor)
        var newH = Math.round(origH * scaleFactor)

        // Appliquer la taille à l'image
        img.css({
            'width': newW + 'px',
            'height': newH + 'px'
        })

        // Appliquer la taille au container (+ 20 pour le cadre blanc de 10px)
        $(this).css({
            'width': (newW + 20) + 'px',
            'height': (newH + 20) + 'px',
            'top': (startTop + index * offsetY) + 'px',
            'left': (startLeft + index * offsetX) + 'px',
            'right': 'auto',
            'z-index': 20 + index
        })

        // Mettre à jour les attributs pour le slider (utiliser la nouvelle taille)
        img.attr('w', newW)
        img.attr('h', newH)
        img.attr('y', startTop + index * offsetY)
        img.attr('x', startLeft + index * offsetX)
    })
}

// Disposition en cercle
function applyCircleLayout(){
    var pics = $('.bigpic:visible')
    if (pics.length === 0) return

    // Rayon = 1/3 de la taille cible (600px)
    var radius = Math.round(targetMaxDim / 3)

    // Centre du cercle (au milieu de l'écran)
    var centerX = $(window).width() / 2
    var centerY = $(window).height() / 2

    // Angle entre chaque photo
    var alpha = (2 * Math.PI) / pics.length

    // Appliquer la taille et position à toutes les photos
    pics.each(function(index){
        var img = $(this).find('img')
        var origW = parseInt(img.attr('orig_w')) || parseInt(img.attr('w')) || 300
        var origH = parseInt(img.attr('orig_h')) || parseInt(img.attr('h')) || 400

        // Calculer le facteur pour que la plus grande dimension fasse 600px
        var maxDim = Math.max(origW, origH)
        var scaleFactor = targetMaxDim / maxDim

        // Calculer la nouvelle taille
        var newW = Math.round(origW * scaleFactor)
        var newH = Math.round(origH * scaleFactor)

        // Angle pour cette photo (-90° = en haut, puis sens horaire)
        var angle = (-Math.PI / 2) - (index * alpha)

        // Position sur le cercle (centre de la photo)
        var posX = centerX + radius * Math.cos(angle) - (newW + 20) / 2
        var posY = centerY + radius * Math.sin(angle) - (newH + 20) / 2

        // Appliquer la taille à l'image
        img.css({
            'width': newW + 'px',
            'height': newH + 'px'
        })

        // Appliquer la taille et position au container
        $(this).css({
            'width': (newW + 20) + 'px',
            'height': (newH + 20) + 'px',
            'top': posY + 'px',
            'left': posX + 'px',
            'right': 'auto',
            'z-index': 20 + index
        })

        // Mettre à jour les attributs pour le slider
        img.attr('w', newW)
        img.attr('h', newH)
        img.attr('y', posY)
        img.attr('x', posX)
    })
}

// click on the figure to open a new photo

// Fermer les menus dropdown au clic ailleurs
$(document).click(function(){
    $('.layout-dropdown').hide()
})

$('figure').click(function(){
    if ($(this).parent().hasClass('thumbnail')){
        //alert('figgg')
        var addr_pic = $(this).find('img').attr('src')
        if (one_img){

            reset_bigpic()

        }
        if ( pic_yet_open.indexOf(addr_pic) == -1 ){

            add_new_bigpic(addr_pic)
            hook_slider('bp' + nb_bpics)
            save_pos_drag()

           }
    }
})



</script>
