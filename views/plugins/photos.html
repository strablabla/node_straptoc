    pic_yet_open = []

  })

function vertical_with_ratio(img,ratio_hw,wpic){

      //alert('wpic ' + wpic)
      nw = wpic
      nh = nw*ratio_hw
      img.parent().css({
        'width': nw + 10 + 'px',
        'height': nh + 10 + 'px',
      })
      img.css({'width' : nw + 'px',
               'height' : nh -10 + 'px',
               'margin' : '0px'})

}

function horizontal_with_ratio(img,ratio_hw,hpic){

      //alert('hpic ' + hpic)
      nh = hpic
      nw = nh/ratio_hw
      img.parent().css({
        'width': nw + 10 + 'px',
        'height': nh + 10 + 'px',
      })
      img.css({'width' : nw + 'px',
               'height' : nh -10 + 'px',
               'margin' : '0px'})

}

function save_wh_xy(p){

      p.attr('w',p.width())
      p.attr('h',p.height())
      // Save original dimensions only the first time
      if (!p.attr('orig_w')) {
          p.attr('orig_w', p.width())
          p.attr('orig_h', p.height())
      }
      p.attr('x',parseInt(p.parent().css('right')) || parseInt(p.parent().css('left')))
      p.attr('y',parseInt(p.parent().css('top')))

}

function adapt_pic_dim(new_pic){

      var w = new_pic.width()
      var h = new_pic.height()

      // Calculate scale factor so largest dimension equals targetMaxDim (500px)
      var maxDim = Math.max(w, h)
      var scaleFactor = targetMaxDim / maxDim

      var newW = Math.round(w * scaleFactor)
      var newH = Math.round(h * scaleFactor)

      new_pic.parent().css({
        'width': (newW + 20) + 'px',
        'height': (newH + 20) + 'px',
      })
      new_pic.css({
        'width': newW + 'px',
        'height': newH + 'px',
        'margin': '0px'
      })

      save_wh_xy(new_pic)
}

function add_new_bigpic(addr_pic){

    //alert('oppp')
    pic_yet_open.push(addr_pic)
    nb_bpics += 1
    id_new_pic = 'bp' + nb_bpics
    list_big_pics.push( make_big_pic(wpic, hpic, id_new_pic) )
    list_big_pics[pic_yet_open.length-1].show()
    // <img/> object..
    var new_pic = $('#imbp_' + id_new_pic)
    // add the src..
    modif_img = new_pic.attr( 'src', addr_pic )

    // adapt the size

    $(modif_img).load(function() {

          adapt_pic_dim(new_pic)

      })

}


function act_deact_drag_slider(){

        var curr_img = null
        $('.slider').mouseover(function(){
                             curr_img = $(this).parents().eq(1)
                             curr_img.draggable({ disabled: true});
                          }).mouseout(function(){
                             curr_img.draggable({ disabled: false});
                          })
        }




function change_dim_with_slider(pic,val){

      var w = pic.attr('w')
      var h = pic.attr('h')
      pic.css({'width':w*(1+val)+'px'})
      pic.parent().css({'width':w*(1+val)+10})
      pic.css({'height':h*(1+val)-10+'px'})
      pic.parent().css({'height':h*(1+val)+10})
      //----
      pp = pic.parent()
      var y = parseInt(pic.attr('y'))
      var x = parseInt(pic.attr('x'))
      pp.css({'top':y-h*val+'px'})
      pp.css({'right':x-w*val+'px'})

}

function hook_slider(picId){

        var currentId = picId || ('bp' + nb_bpics)
        var slider = $('#imslider_' + currentId)
        slider.bootstrapSlider({
              formatter: function(val) {
                    var pic = $('#imbp_' + currentId)
                    change_dim_with_slider(pic,val)
                  }
              })

        // Reposition arrows when slider is released (in one-by-one mode)
        slider.on('slideStop', function() {
            if (oneByOneMode) {
                var pic = $('#' + currentId)
                var img = pic.find('img')
                var picLeft = pic.position().left
                var picTop = pic.position().top
                var picW = pic.outerWidth()
                var picH = pic.outerHeight()
                var picCenterX = picLeft + picW / 2
                var picCenterY = picTop + picH / 2

                // Update max dimension with new image size
                oneByOneMaxDim = Math.max(img.width(), img.height())

                // Use new max dimension + frame for arrow positioning
                var refHalfWidth = (oneByOneMaxDim + 20) / 2
                var arrowOffset = 50
                var arrowWidth = 40

                // Save new position for navigation
                oneByOnePosition = {
                    centerX: picCenterX,
                    centerY: picCenterY
                }

                var prevArrow = $('#onebyone-prev')
                var nextArrow = $('#onebyone-next')

                if (prevArrow.length) {
                    prevArrow.css({
                        'left': (picCenterX - refHalfWidth - arrowOffset) + 'px',
                        'top': picCenterY + 'px'
                    })
                }
                if (nextArrow.length) {
                    nextArrow.css({
                        'left': (picCenterX + refHalfWidth + arrowOffset - arrowWidth) + 'px',
                        'top': picCenterY + 'px'
                    })
                }
            }
        })

        act_deact_drag_slider()

}

function save_pos_drag(){

      $( ".bigpic" ).draggable({
       start: function( event, ui ) {
            // Hide arrows at drag start
            if (oneByOneMode) {
                $('#onebyone-prev, #onebyone-next').hide()
            }
       },
       drag: function( event, ui ) {
            var img = $(this).find('img')
            save_wh_xy(img)
       },
       stop: function( event, ui ) {
            // Reposition and show arrows at drag end
            if (oneByOneMode) {
                var pic = $(this)
                var img = pic.find('img')
                var picLeft = pic.position().left
                var picTop = pic.position().top
                var picW = pic.outerWidth()
                var picH = pic.outerHeight()
                var picCenterX = picLeft + picW / 2
                var picCenterY = picTop + picH / 2

                // Update max dimension with new image size
                oneByOneMaxDim = Math.max(img.width(), img.height())

                // Use new max dimension + frame for arrow positioning
                var refHalfWidth = (oneByOneMaxDim + 20) / 2
                var arrowOffset = 40
                var arrowWidth = 40  // padding (10+10) + character (~20)

                // Save new position for navigation
                oneByOnePosition = {
                    centerX: picCenterX,
                    centerY: picCenterY
                }

                var prevArrow = $('#onebyone-prev')
                var nextArrow = $('#onebyone-next')

                if (prevArrow.length) {
                    prevArrow.css({
                        'left': (picCenterX - refHalfWidth - arrowOffset) + 'px',
                        'top': picCenterY + 'px'
                    }).show()
                }
                if (nextArrow.length) {
                    nextArrow.css({
                        'left': (picCenterX + refHalfWidth + arrowOffset - arrowWidth) + 'px',
                        'top': picCenterY + 'px'
                    }).show()
                }
            }
       }
      });

}

// Cascade layout
function applyCascadeLayout(){
    var pics = $('.bigpic:visible')
    if (pics.length === 0) return

    // Calculate offset based on target size (1/5 of 600px)
    var offsetX = Math.round(targetMaxDim / 5)
    var offsetY = Math.round(targetMaxDim / 5)

    // Starting position (top left, 200px from left edge)
    var startTop = 100
    var startLeft = 200

    // Apply size and position to all photos
    pics.each(function(index){
        var img = $(this).find('img')
        var origW = parseInt(img.attr('orig_w')) || parseInt(img.attr('w')) || 300
        var origH = parseInt(img.attr('orig_h')) || parseInt(img.attr('h')) || 400

        // Calculate factor so largest dimension equals 600px
        var maxDim = Math.max(origW, origH)
        var scaleFactor = targetMaxDim / maxDim

        // Calculate new size
        var newW = Math.round(origW * scaleFactor)
        var newH = Math.round(origH * scaleFactor)

        // Apply size to image
        img.css({
            'width': newW + 'px',
            'height': newH + 'px'
        })

        // Apply size to container (+ 20 for 10px white frame)
        $(this).css({
            'width': (newW + 20) + 'px',
            'height': (newH + 20) + 'px',
            'top': (startTop + index * offsetY) + 'px',
            'left': (startLeft + index * offsetX) + 'px',
            'right': 'auto',
            'z-index': 20 + index
        })

        // Update slider attributes (use new size)
        img.attr('w', newW)
        img.attr('h', newH)
        img.attr('y', startTop + index * offsetY)
        img.attr('x', startLeft + index * offsetX)
    })
}

// Circle layout
function applyCircleLayout(){
    var pics = $('.bigpic:visible')
    if (pics.length === 0) return

    // Rayon = 1/3 de la taille cible (600px)
    var radius = Math.round(targetMaxDim / 3)

    // Circle center (middle of screen)
    var centerX = $(window).width() / 2
    var centerY = $(window).height() / 2

    // Angle between each photo
    var alpha = (2 * Math.PI) / pics.length

    // Apply size and position to all photos
    pics.each(function(index){
        var img = $(this).find('img')
        var origW = parseInt(img.attr('orig_w')) || parseInt(img.attr('w')) || 300
        var origH = parseInt(img.attr('orig_h')) || parseInt(img.attr('h')) || 400

        // Calculate factor so largest dimension equals 600px
        var maxDim = Math.max(origW, origH)
        var scaleFactor = targetMaxDim / maxDim

        // Calculate new size
        var newW = Math.round(origW * scaleFactor)
        var newH = Math.round(origH * scaleFactor)

        // Angle for this photo (-90° = top, then clockwise)
        var angle = (-Math.PI / 2) - (index * alpha)

        // Position on circle (photo center)
        var posX = centerX + radius * Math.cos(angle) - (newW + 20) / 2
        var posY = centerY + radius * Math.sin(angle) - (newH + 20) / 2

        // Apply size to image
        img.css({
            'width': newW + 'px',
            'height': newH + 'px'
        })

        // Apply size and position to container
        $(this).css({
            'width': (newW + 20) + 'px',
            'height': (newH + 20) + 'px',
            'top': posY + 'px',
            'left': posX + 'px',
            'right': 'auto',
            'z-index': 20 + index
        })

        // Update slider attributes
        img.attr('w', newW)
        img.attr('h', newH)
        img.attr('y', posY)
        img.attr('x', posX)
    })
}

// Taille standard (targetMaxDim)
function applyStandardSize(pic){
    if (!pic || pic.length === 0) return

    var img = pic.find('img')
    var origW = parseInt(img.attr('orig_w')) || parseInt(img.attr('w')) || 300
    var origH = parseInt(img.attr('orig_h')) || parseInt(img.attr('h')) || 400

    // Calculate factor so largest dimension equals targetMaxDim
    var maxDim = Math.max(origW, origH)
    var scaleFactor = targetMaxDim / maxDim

    // Calculate new size
    var newW = Math.round(origW * scaleFactor)
    var newH = Math.round(origH * scaleFactor)

    // Apply size to image
    img.css({
        'width': newW + 'px',
        'height': newH + 'px'
    })

    // Apply size to container (+ 20 for 10px white frame)
    pic.css({
        'width': (newW + 20) + 'px',
        'height': (newH + 20) + 'px'
    })

    // Don't update w/h to preserve slider range

    // In one-by-one mode, update max dimension and reposition arrows
    if (oneByOneMode) {
        oneByOneMaxDim = Math.max(newW, newH)

        var picLeft = pic.position().left
        var picTop = pic.position().top
        var picW = pic.outerWidth()
        var picH = pic.outerHeight()
        var picCenterX = picLeft + picW / 2
        var picCenterY = picTop + picH / 2

        var refHalfWidth = (oneByOneMaxDim + 20) / 2
        var arrowOffset = 50
        var arrowWidth = 40

        oneByOnePosition = {
            centerX: picCenterX,
            centerY: picCenterY
        }

        var prevArrow = $('#onebyone-prev')
        var nextArrow = $('#onebyone-next')

        if (prevArrow.length) {
            prevArrow.css({
                'left': (picCenterX - refHalfWidth - arrowOffset) + 'px',
                'top': picCenterY + 'px'
            })
        }
        if (nextArrow.length) {
            nextArrow.css({
                'left': (picCenterX + refHalfWidth + arrowOffset - arrowWidth) + 'px',
                'top': picCenterY + 'px'
            })
        }
    }
}

// One by one layout
function applyOneByOneLayout(currentPic){
    // Get all portfolio photos (thumbnails)
    oneByOnePhotos = []
    $('.thumbnail figure img').each(function(){
        oneByOnePhotos.push($(this).attr('src'))
    })

    if (oneByOnePhotos.length === 0) return

    // Trouver l'index de la photo courante
    var currentSrc = currentPic.find('img').attr('src')
    oneByOneIndex = oneByOnePhotos.indexOf(currentSrc)
    if (oneByOneIndex === -1) oneByOneIndex = 0

    // Save current position and size of the photo
    var picW = currentPic.outerWidth()
    var picH = currentPic.outerHeight()
    var picLeft = currentPic.position().left
    var picTop = currentPic.position().top
    var savedPosition = {
        centerX: picLeft + picW / 2,
        centerY: picTop + picH / 2
    }
    // Save max dimension of image (without frame)
    var img = currentPic.find('img')
    var savedMaxDim = Math.max(img.width(), img.height())

    // Fermer toutes les photos ouvertes
    reset_bigpic()

    // Activate one by one mode and restore position and max dimension
    oneByOneMode = true
    oneByOnePosition = savedPosition
    oneByOneMaxDim = savedMaxDim

    // Open current photo
    showOneByOnePhoto(oneByOneIndex)
}

function showOneByOnePhoto(index){
    // Create overlay if it doesn't exist
    if ($('#onebyone-overlay').length === 0) {
        var overlay = $('<div/>').attr('id', 'onebyone-overlay').css({
            'position': 'fixed',
            'top': '0',
            'left': '0',
            'width': '100%',
            'height': '100%',
            'background': 'rgba(0, 0, 0, 0.5)',
            'z-index': '15'
        })
        // Click on overlay to exit one-by-one mode but keep the photo
        overlay.click(function(){
            exitOneByOneMode()
        })
        $('body').append(overlay)
    }

    // Close previous photo if exists
    $('.bigpic').remove()
    list_big_pics = []
    nb_bpics = 0
    pic_yet_open = []

    // Remove existing arrows
    $('#onebyone-prev, #onebyone-next').remove()

    if (index < 0 || index >= oneByOnePhotos.length) return

    var addr_pic = oneByOnePhotos[index]
    oneByOneIndex = index

    // Open new photo
    add_new_bigpic(addr_pic)
    hook_slider('bp' + nb_bpics)
    save_pos_drag()

    // Temporarily hide to avoid visual jump
    var pic = $('.bigpic').first()
    pic.css('visibility', 'hidden')

    // Position photo (use saved position or center)
    setTimeout(function(){
        if (pic.length === 0) return

        // Apply saved max dimension if it exists
        if (oneByOneMaxDim) {
            var img = pic.find('img')
            var origW = img[0].naturalWidth || img.width()
            var origH = img[0].naturalHeight || img.height()
            var maxDim = Math.max(origW, origH)
            var scaleFactor = oneByOneMaxDim / maxDim
            var newW = Math.round(origW * scaleFactor)
            var newH = Math.round(origH * scaleFactor)
            img.css({
                'width': newW + 'px',
                'height': newH + 'px'
            })
            pic.css({
                'width': (newW + 20) + 'px',
                'height': (newH + 20) + 'px'
            })
        }

        var picW = pic.outerWidth()
        var picH = pic.outerHeight()

        var posX, posY
        if (oneByOnePosition) {
            // Use saved position (center of previous photo)
            posX = oneByOnePosition.centerX - picW / 2
            posY = oneByOnePosition.centerY - picH / 2
        } else {
            // First time: center in window
            posX = ($(window).width() - picW) / 2
            posY = ($(window).height() - picH) / 2
        }

        pic.css({
            'left': posX + 'px',
            'top': posY + 'px',
            'right': 'auto'
        })

        // Add navigation arrows (based on saved max dimension)
        var picCenterX = posX + picW / 2
        var picCenterY = posY + picH / 2
        // Use max dimension + frame for arrow positioning (horizontal case)
        var refHalfWidth = oneByOneMaxDim ? (oneByOneMaxDim + 20) / 2 : picW / 2
        var arrowOffset = 50
        var arrowWidth = 40  // padding (10+10) + caractère (~20)

        var arrowStyle = {
            'position': 'fixed',
            'font-size': '25px',
            'color': '#bbb',
            'cursor': 'pointer',
            'z-index': '1000',
            'user-select': 'none',
            'padding': '10px',
            'transform': 'translateY(-50%)'
        }

        if (index > 0) {
            var prevArrow = $('<div/>').attr('id', 'onebyone-prev').html('&#10094;').css(arrowStyle)
                .css('left', (picCenterX - refHalfWidth - arrowOffset) + 'px')
                .css('top', picCenterY + 'px')
            prevArrow.hover(
                function(){ $(this).css('color', '#888') },
                function(){ $(this).css('color', '#bbb') }
            ).click(function(e){
                e.stopPropagation()
                // Sauvegarder la position actuelle avant de changer
                var currentPic = $('.bigpic').first()
                var currentW = currentPic.outerWidth()
                var currentH = currentPic.outerHeight()
                var currentLeft = currentPic.position().left
                var currentTop = currentPic.position().top
                oneByOnePosition = {
                    centerX: currentLeft + currentW / 2,
                    centerY: currentTop + currentH / 2
                }
                showOneByOnePhoto(oneByOneIndex - 1)
            })
            $('body').append(prevArrow)
        }

        if (index < oneByOnePhotos.length - 1) {
            var nextArrow = $('<div/>').attr('id', 'onebyone-next').html('&#10095;').css(arrowStyle)
                .css('left', (picCenterX + refHalfWidth + arrowOffset - arrowWidth) + 'px')
                .css('top', picCenterY + 'px')
            nextArrow.hover(
                function(){ $(this).css('color', '#888') },
                function(){ $(this).css('color', '#bbb') }
            ).click(function(e){
                e.stopPropagation()
                // Sauvegarder la position actuelle avant de changer
                var currentPic = $('.bigpic').first()
                var currentW = currentPic.outerWidth()
                var currentH = currentPic.outerHeight()
                var currentLeft = currentPic.position().left
                var currentTop = currentPic.position().top
                oneByOnePosition = {
                    centerX: currentLeft + currentW / 2,
                    centerY: currentTop + currentH / 2
                }
                showOneByOnePhoto(oneByOneIndex + 1)
            })
            $('body').append(nextArrow)
        }

        // Update slider attributes
        var img = pic.find('img')
        img.attr('x', posX)
        img.attr('y', posY)

        // Afficher la photo une fois positionnée
        pic.css('visibility', 'visible')
    }, 100)
}

function exitOneByOneMode(){
    oneByOneMode = false
    oneByOnePosition = null
    oneByOneMaxDim = null
    $('#onebyone-prev, #onebyone-next, #onebyone-overlay').remove()
}
