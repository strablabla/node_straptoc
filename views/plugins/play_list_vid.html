function reinit_act(selection, elem, action){

      /*

      Reinitialize elem with action..

      */

      elem.each(function(){
            if( $(this).attr('index') != selection.attr('index') ){
                  eval(action)
            }
       })
}

function reinitialize(sel){

      /*

      Reinitialize

      */

      reinit_act(sel, $('.vid_selected'),'$(this)[0].pause()')
      reinit_act(sel, $('.elem_list_play_selected'),"$(this).css({'color':'black'})")
      reinit_act(sel, $('.ul_selected'),'$(this).hide()')
      // hide sound's icon after the name
      reinit_act(sel, $('.icon_sound'),'$(this).hide()')

}

// play music clicking a title...

function selection_click(elem_li, selection, numsel){

      /*

      Actions produced when clicking the element of the play_list..

      */

      selection.click(function(e){
           if (is_delete_mode){
                 e.stopPropagation()
                 remove_playlist_item($(this))
                 return false
           }
           reinitialize($(this))
           var currid = $(this).attr('id').split('sel_')[1] // vid current id ..
           var currvidid = '#' + currid
           var sel_vid = $(currvidid)[0]
           if (sel_vid.paused){                             // if video stopped.
               play_vid_list(numsel)
               $('#media_panel_icon').attr('alt','music')
                                     .attr('src',icon_playing)
               // Update play/pause button to show pause icon
               $('#icon_play').hide()
               $('#icon_pause').show()
               is_playing = true
             } else {                                       // if video active..
              selection.css({'color':'black'})
              sel_vid.pause()
              // Close video in main page
              close_vid_in_page(numsel)
              $('#media_panel_icon').attr('alt','music')
                                    .attr('src', icon_helmet)
              // Update play/pause button to show play icon
              $('#icon_pause').hide()
              $('#icon_play').show()
              is_playing = false
              $('#progress_container').hide()
              $('#progress_time').hide()
            }
      })

}

var len_lim = 45

function change_vid_name(vid_id){
      // Get full name without extension
      var full_name = vid_id.split('/').pop()
      full_name = full_name.replace(/\.(mp4|webm|ogg|mkv|avi)$/i, '')

      var vid_name = full_name
      var is_truncated = false

      // Truncate at the end if too long
      if (vid_name.length > len_lim){
          vid_name = vid_name.substring(0, len_lim) + '...'
          is_truncated = true
      }

      return { name: vid_name, full_name: full_name, truncated: is_truncated }
}

function fill_play_list(elem_li, vid_id, numsel){

      /*

      Create the play_list..

      */

      // icon to indicate vid is in the play list
      var icon_sound = $('<img/>').attr('src',"capicon/svg/073.svg")
                                  .css({'width':'13px', 'margin-left':'10px'})
                                  .attr('index', numsel)
                                  .addClass('icon_sound')

      var currid = 'vid_num' + numsel
      var selection = $('<div/>')

      var vid_info = change_vid_name(vid_id)
      selection.addClass('elem_list_play_selected').attr('index', numsel)
               .attr('src', vid_id)
               .attr('id', 'sel_' + currid)
               .text((numsel + 1) + '. ' + vid_info.name.toLowerCase())  // index + title
               .attr('title', vid_info.full_name)  // tooltip with full name
               .append(icon_sound.hide())
               .append($('<span/>').text(' - ')
                                   .hide()
                                   .addClass('remove_vid')
                                   .css({'font-size':'20px'}))
               .css({'font-size':'17px',
                     'font-family': "apple_garamond",
                     'text-shadow':'none',
                     'white-space': 'nowrap',
                     'overflow': 'hidden',
                     'text-overflow': 'ellipsis'})

      get_playlist_items_parent().append(selection)     // add media title to the play list..

      selection_click(elem_li, selection, numsel)

      // show the sign - for removing video
      $('.elem_list_play_selected').mouseover(function(){   //
         $(this).find('.remove_vid').show()
      })
      // hide the sign - for removing video
      $('.elem_list_play_selected').mouseout(function(){  //
         $(this).find('.remove_vid').hide()
      })

      $('.remove_vid').one('click', function(e){
           e.stopPropagation()
           remove_playlist_item($(this).parent())
           return false
      })


}

function remove_playlist_item($elem){

      /*

      Remove a single item from the play list and clean up the doc state.

      */

      var currindex = parseInt($elem.attr('index'))
      var $parent_group = $elem.closest('.playlist_group')
      $elem.remove()

      var tit_index_sel = '.ul_selected[index="'+ currindex + '"]'
      var tit = $(tit_index_sel)
      tit.parent().find('.icon_title').remove()
      var addr = tit.find('a').attr('href')
      var index_addr = list_vid.indexOf(addr)
      if (index_addr != -1){
            list_vid.splice(index_addr, 1)
      }
      tit.parent().css({'color':'rgb(102, 204, 102)'})
      tit.removeAttr('index')
      tit.hide()
      tit.removeClass("ul_selected")
      tit.parent().removeClass("selected_title")
      var vid_sel = tit.find('.vid_selected')
      vid_sel.removeAttr('index')
      vid_sel.removeAttr('id')
      vid_sel.removeClass('vid_selected')

      // remove now-empty group container
      if ($parent_group.length && $parent_group.find('.elem_list_play_selected').length === 0){
            $parent_group.remove()
      }
}

function make_playlist_group($source_li){

      /*

      Build a directory group container in the playlist with a header showing
      the directory name. Returns { group, items } where group is the wrapper
      and items is the indented child container that should receive entries.

      */

      var group_name = ''
      var $label = $source_li.find('.vid-group-label').first()
      if ($label.length){
            group_name = $label.text().trim()
      }
      if (!group_name){
            group_name = $source_li.children('a').first().text().trim() || 'dossier'
      }
      // strip trailing toggles like " [+]" / " [-]"
      group_name = group_name.replace(/\s*\[[-+]\]\s*$/, '')

      var $group = $('<div/>').addClass('playlist_group')
                              .css({'margin-top':'8px'})
      var $group_title = $('<div/>').addClass('playlist_group_title')
                                    .text(group_name)
                                    .css({
                                          'font-size':'17px',
                                          'font-weight':'bold',
                                          'font-family':'apple_garamond',
                                          'color':'#444',
                                          'margin-top':'4px',
                                          'margin-bottom':'2px',
                                          'white-space':'nowrap',
                                          'overflow':'hidden',
                                          'text-overflow':'ellipsis'
                                    })
      var $group_items = $('<div/>').addClass('playlist_group_items')
                                    .css({'padding-left':'20px'})
      $group.append($group_title).append($group_items)
      $('#vid_play_list_items').append($group)
      return { group: $group, items: $group_items }
}

function clear_play_list(){

    // remove the titles in the playlist..
    $('.elem_list_play_selected').remove()
    // remove any group containers (directory groupings)
    $('.playlist_group').remove()
    // doublon list empty to permit to put again the same vids..
    list_vid = []
    // remove the icons after the titles..
    $('.icon_title').remove()
    // reset the index at 0
    numsel = 0
    // go back to green color for the titles
    $('.selected_title').css({'color':'rgb(102, 204, 102)'})
    // stop playing the current video
    try{
        currvid.pause()
       }catch(err){

       }
    currvid = null
    // Reset play/pause button to play icon
    $('#icon_pause').hide()
    $('#icon_play').show()
    is_playing = false
    current_playing_index = 0
    //----------
    $('.ul_selected').removeAttr('index')
    $('.ul_selected').hide()
    $('.ul_selected').removeClass("ul_selected")
    $('.selected_title').removeClass("selected_title")
    //----------
    $('.vid_selected').removeAttr('index')
    $('.vid_selected').removeAttr('id')
    $('.vid_selected').removeClass('vid_selected')

}

function add_vid(elem_li, vid, vid_id, numsel, list_vid, list_icons){

      /*

      Add video in the play list

      */

      elem_li.addClass('selected_title')
      elem_li.children('ul').addClass('ul_selected')
                            .attr('index', numsel)
      vid.attr('id', 'vid_num' + numsel)
         .attr('index', numsel)             // number associated to the video..
         .addClass('vid_selected')          // assigning class vid_selected to all the video selected..
      // color the link in the main document
      elem_li.css({'color':'black'})
      // icon to indicate vid is in the play list
      list_icons[numsel] = $('<img/>').attr('src', icon_helmet)
                                      .css({'width':'12px', 'margin':'0px', 'margin-left':'5px'})
                                      .addClass('icon_title')
      // add icon in the doc - for lazy videos, add after [+], otherwise append to li
      var tog_elem = elem_li.find('.tog_elem_vid')
      if (tog_elem.length) {
          tog_elem.after($('<span/>').append(list_icons[numsel]))
      } else {
          elem_li.append($('<span/>').text(' ').append(list_icons[numsel]))
      }
      // save the videos id to avoid doublons.
      list_vid.push(vid_id)

      //-----------

      fill_play_list(elem_li, vid_id, numsel)
}

var list_vid = []      // list of videos fingerprint..
var list_icons = []
var numsel = 0

// action when clicking on a green video name (single video)

$("li").click( function(e){
    // Only process if playlist is visible
    if (!$('#vid_play_list').is(':visible')){
        return
    }

    // Only trigger when clicking on the text element itself (.embed_video / .vid-lazy-title)
    var $target = $(e.target)
    if (!$target.closest('.embed_video').length && !$target.hasClass('embed_video')) {
        return  // Clicked outside the video title text
    }

    var elem_li = $(this)
    var vid = elem_li.find('ul li div video')
    if ( vid.length ){
        if(elem_li.children('ul').hasClass('strapvid')){  // filter the li element..
            // Support lazy loading: use data-src or data-video-path if src not yet set
            var vid_id = vid.attr('src') || vid.attr('data-src') || elem_li.find('.vid-lazy-container').attr('data-video-path')
            if (vid_id && list_vid.indexOf(vid_id) == -1){      // if not yet in the list..
                // For lazy videos, set the src now so it can be played
                if (!vid.attr('src') && vid_id) {
                    vid.attr('src', vid_id)
                    elem_li.find('.vid-lazy-container').attr('data-loaded', 'true')
                }
                add_vid(elem_li, vid, vid_id, numsel, list_vid, list_icons)
                // increment the number of selected elements ..
                numsel += 1
            }

       }
    } // end if vid
})

// select videos by group

$("li").dblclick( function(e){
    // Only process if playlist is visible - don't interfere with double-click to text mode
    if (!$('#vid_play_list').is(':visible')){
        return  // Let dblclick_to_text handler work
    }

    var elem_li_grp = $(this)
    // Only trigger on the group name text, not on empty space
    var $dblTarget = $(e.target)
    if (!$dblTarget.closest('.vid-group-label').length) {
        return
    }
    if (elem_li_grp.hasClass('strapvid_inside')){
        // Only react when the dblclicked label belongs directly to THIS li,
        // not to a nested sub-list li (otherwise the parent handler also fires
        // while bubbling and duplicates/expands the selection).
        var $dblLabel = $dblTarget.closest('.vid-group-label')
        if ($dblLabel.closest('li')[0] !== elem_li_grp[0]) return
        var $grp = make_playlist_group(elem_li_grp)
        current_group_parent = $grp.items
        var added_count = 0
        // find each video..
        elem_li_grp.find('video').each( function(){
            // Support lazy loading: use data-src if src not yet set
            var vid_id = $(this).attr('src') || $(this).attr('data-src')
            var elem_li = $(this).parents().eq(3)
            //alert(elem_li.text())
            if (vid_id && list_vid.indexOf(vid_id) == -1){      // if not yet in the list..
                // For lazy videos, set the src now so it can be played
                if (!$(this).attr('src') && vid_id) {
                    $(this).attr('src', vid_id)
                    $(this).closest('.vid-lazy-container').attr('data-loaded', 'true')
                }
                add_vid(elem_li, $(this), vid_id, numsel, list_vid, list_icons)
                numsel += 1
                added_count += 1
            }
        })
        current_group_parent = null
        if (added_count === 0) $grp.group.remove()
    }
  })

// Select all lazy videos by clicking on the parent container (list name)
$("li").click( function(e){
    // Only process if playlist is visible
    if (!$('#vid_play_list').is(':visible')){
        return
    }

    var elem_li_parent = $(this)
    // Check if this li contains a vid-lazy-list (parent of lazy videos)
    var lazyList = elem_li_parent.find('.vid-lazy-list')
    if (lazyList.length && !elem_li_parent.hasClass('vid-lazy-item')){
        // Only trigger when clicking on the group name text, not on empty space
        var $clickTarget = $(e.target)
        var $clickLabel = $clickTarget.closest('.vid-group-label')
        if (!$clickLabel.length) {
            return
        }
        // Only react when the clicked label belongs directly to THIS li, not
        // to a nested sub-list li. Without this, clicking a sub-folder also
        // triggers parents up the chain, loading their whole subtree.
        if ($clickLabel.closest('li')[0] !== elem_li_parent[0]) {
            return
        }
        // Add all lazy videos from this parent to the playlist (grouped by directory)
        var $grp = make_playlist_group(elem_li_parent)
        current_group_parent = $grp.items
        var added_count = 0
        lazyList.find('.vid-lazy-item').each(function(){
            var elem_li = $(this)
            var vid = elem_li.find('video')
            var vid_id = vid.attr('src') || vid.attr('data-src') || elem_li.find('.vid-lazy-container').attr('data-video-path')
            if (vid_id && list_vid.indexOf(vid_id) == -1){
                // For lazy videos, set the src now so it can be played
                if (!vid.attr('src') && vid_id) {
                    vid.attr('src', vid_id)
                    elem_li.find('.vid-lazy-container').attr('data-loaded', 'true')
                }
                add_vid(elem_li, vid, vid_id, numsel, list_vid, list_icons)
                numsel += 1
                added_count += 1
            }
        })
        current_group_parent = null
        if (added_count === 0) $grp.group.remove()
    }
})

$('#vid_play_list').hide()
$('#toggle_play_list').hide()
var play_list_open = true

$('#toggle_play_list').on('click', function(){   //

      /*

      show / hide play_list

      */

     play_list_open = !play_list_open
     var translr = '-' + $('#vid_play_list').css('width')  // translate right
     if (!play_list_open){
          $('#vid_play_list').animate({'right': translr }) // hide
     }
     else{
          $('#vid_play_list').animate({ 'right': pos_right_init }) // show

currvid = null;

function format_time(seconds){
    var mins = Math.floor(seconds / 60)
    var secs = Math.floor(seconds % 60)
    return mins + ':' + (secs < 10 ? '0' : '') + secs
}

function get_all_playlist_indices(){
    // Return array of all existing playlist indices
    var indices = []
    $('.elem_list_play_selected').each(function(){
        indices.push(parseInt($(this).attr('index')))
    })
    return indices
}

function get_random_index(current){
    var indices = get_all_playlist_indices()
    if (indices.length <= 1) return current
    // Remove current from candidates
    var candidates = indices.filter(function(idx){ return idx !== current })
    return candidates[Math.floor(Math.random() * candidates.length)]
}

function unfold_parents($elem){
    // Unfold all ancestor lists that are hidden (:: folding mechanism)
    $elem.parents('ul').each(function(){
        var $ul = $(this)
        if (!$ul.is(':visible')) {
            $ul.show()
            // Update the [+] toggle indicator to [-]
            $ul.prev('a').find('span.\\:\\:').text(' [-]')
        }
    })
}

function open_vid_in_page(i){
    // Open the video container in the main page
    var $vid = $('#vid_num' + i)
    if (!$vid.length) return
    var $li = $vid.closest('.vid-lazy-item')
    if ($li.length) {
        // Unfold any hidden parent lists first
        unfold_parents($li)
        // Expand the strapvid ul
        var $strapvid = $li.find('.strapvid')
        $strapvid.slideDown(200)
        // Show the lazy container
        var $container = $li.find('.vid-lazy-container')
        $container.show()
        // Update toggle text
        $li.find('.vid-lazy-toggle').text(' [-]')
        // Ensure src is set
        var $video = $container.find('video')
        var videoPath = $container.attr('data-video-path')
        if ($video.attr('data-src') && !$video.attr('src') && videoPath) {
            $video.attr('src', videoPath)
            $container.attr('data-loaded', 'true')
        }
        // Scroll to the video (after parents are unfolded so offset is correct)
        setTimeout(function(){
            $('html, body').animate({ scrollTop: $li.offset().top - 100 }, 300)
        }, 50)
    }
}

function close_vid_in_page(i){
    // Close the video container in the main page
    var $vid = $('#vid_num' + i)
    if (!$vid.length) return
    var $li = $vid.closest('.vid-lazy-item')
    if ($li.length) {
        var $strapvid = $li.find('.strapvid')
        $strapvid.slideUp(200)
        $li.find('.vid-lazy-toggle').text(' [+]')
    }
}

var previous_playing_index = null

function play_vid_list(i){

      /*

      Play the list elements

      */

      vid_id = '#vid_num' + i
      currvid = $(vid_id)[0]
      if (!currvid) return  // video not found

      // Close previous video in main page
      if (previous_playing_index !== null && previous_playing_index !== i) {
          close_vid_in_page(previous_playing_index)
      }

      current_playing_index = i  // track current index
      previous_playing_index = i

      // Open current video in main page
      open_vid_in_page(i)

      currvid.play()
      // Update play/pause button to show pause icon
      $('#icon_play').hide()
      $('#icon_pause').show()
      is_playing = true

      // Show and update progress bar
      $('#progress_container').show()
      $('#progress_time').show()

      var curr_ul;
      $('.strapvid').each(function(){
          if ($(this).attr('index') == i){
               curr_ul = $(this)
           }
        })
      $('#sel_vid_num' + i).css({'color':'blue'})          // selection colored in blue
                           .children('.icon_sound').show()  // show sound icon

      // Update progress bar on timeupdate
      $(vid_id).off('timeupdate').on('timeupdate', function(){
          if (currvid && currvid.duration) {
              var pct = (currvid.currentTime / currvid.duration) * 100
              $('#progress_bar').css('width', pct + '%')
              $('#progress_time').text(format_time(currvid.currentTime) + ' / ' + format_time(currvid.duration))
          }
      })

      $(vid_id).off('ended').on('ended',function(){

            try{
                reinitialize($('#sel_vid_num' + i))    // reinit last vid
                reinitialize($('#sel_vid_num' + (i-1)))  // reinit vid before last vid

                if (is_shuffle) {
                    // Shuffle mode: pick a random video
                    var rand_ind = get_random_index(i)
                    play_vid_list(rand_ind)
                } else {
                    // Normal sequential mode
                    var found_next = false
                    for ( var j=1; j<100; j++ ){
                        var next_ind = i+j
                        if ($('#sel_vid_num' + next_ind).length) {
                            play_vid_list(next_ind)
                            found_next = true
                            break
                        }
                    }
                    // If no next found and loop is on, restart from beginning
                    if (!found_next && is_loop) {
                        var indices = get_all_playlist_indices()
                        if (indices.length > 0) {
                            var first_ind = Math.min.apply(null, indices)
                            play_vid_list(first_ind)
                        }
                    }
                    // If no next found and no loop, stop
                    if (!found_next && !is_loop) {
                        is_playing = false
                        $('#icon_pause').hide()
                        $('#icon_play').show()
                        $('#media_panel_icon').attr('src', icon_helmet)
                        $('#progress_container').hide()
                        $('#progress_time').hide()
                        // Close last video in page
                        close_vid_in_page(i)
                        previous_playing_index = null
                    }
                }

              }catch(err){

              }
      })
}

// Toggle play/pause

$('#butt_play_pause').click(function(){
    if (!is_playing) {
        // Start playing
        reinitialize($('<div/>'))  // dummy element to reinit all
        $('#media_panel_icon').attr('alt','music')
                              .attr('src', icon_playing)
        // If no video playing yet, start from beginning, otherwise resume current
        if (!currvid || currvid.paused) {
            if (current_playing_index === 0 && !currvid) {
                play_vid_list(0)
            } else {
                play_vid_list(current_playing_index)
            }
        }
        // Switch to pause icon
        $('#icon_play').hide()
        $('#icon_pause').show()
        is_playing = true
    } else {
        // Pause
        if (currvid && !currvid.paused) {
            currvid.pause()
            $('#media_panel_icon').attr('alt','music')
                                  .attr('src', icon_helmet)
            $('.elem_list_play_selected').each(function(){
                if ($(this).css('color') == 'rgb(0, 0, 255)') {
                    $(this).css({'color': 'black'})
                }
            })
        }
        // Switch to play icon
        $('#icon_pause').hide()
        $('#icon_play').show()
        is_playing = false
    }
})

// Update progress bar when pausing via native controls
document.addEventListener('pause', function(e) {
    if (e.target.tagName === 'VIDEO' && e.target === currvid) {
        // Keep progress bar visible but update play/pause button
        $('#icon_pause').hide()
        $('#icon_play').show()
        is_playing = false
    }
}, true)

document.addEventListener('play', function(e) {
    if (e.target.tagName === 'VIDEO' && e.target === currvid) {
        $('#icon_play').hide()
        $('#icon_pause').show()
        is_playing = true
    }
}, true)

// Go to previous video

$('#butt_prev').click(function(){
    // Find the previous existing index
    for (var j = 1; j < 100; j++) {
        var prev_ind = current_playing_index - j
        if (prev_ind < 0) break
        if ($('#sel_vid_num' + prev_ind).length) {
            reinitialize($('<div/>'))  // reinit all
            $('#media_panel_icon').attr('alt','music')
                                  .attr('src', icon_playing)
            play_vid_list(prev_ind)
            // Icon update is now handled in play_vid_list
            break
        }
    }
})

// Go to next video

$('#butt_next').click(function(){
    // Find the next existing index
    for (var j = 1; j < 100; j++) {
        var next_ind = current_playing_index + j
        if ($('#sel_vid_num' + next_ind).length) {
            reinitialize($('<div/>'))  // reinit all
            $('#media_panel_icon').attr('alt','music')
                                  .attr('src', icon_playing)
            play_vid_list(next_ind)
            // Icon update is now handled in play_vid_list
            break
        }
    }
})

// Toggle shuffle mode
$('#butt_shuffle').click(function(){
    is_shuffle = !is_shuffle
    $(this).css('color', is_shuffle ? '#333' : '#999')
})

// Toggle loop mode
$('#butt_loop').click(function(){
    is_loop = !is_loop
    $(this).css('color', is_loop ? '#333' : '#999')
})

// Click on progress bar to seek
$('#progress_container').click(function(e){
    if (currvid && currvid.duration) {
        var offset = e.pageX - $(this).offset().left
        var width = $(this).width()
        var pct = offset / width
        currvid.currentTime = pct * currvid.duration
    }
})

// Toggle delete mode: click items to remove them

$('#butt_delete_mode').click(function(){
    is_delete_mode = !is_delete_mode
    if (is_delete_mode){
        $(this).css('color', '#c00')
        $('#vid_play_list_items').css({'cursor':'not-allowed',
                                        'background-color':'rgba(255, 200, 200, 0.25)'})
    } else {
        $(this).css('color', '#999')
        $('#vid_play_list_items').css({'cursor':'default',
                                        'background-color':'transparent'})
    }
})

// Clear the whole play list..

$('#pl_act_bin').click(function(){

    // Close current video in main page before clearing
    if (previous_playing_index !== null) {
        close_vid_in_page(previous_playing_index)
        previous_playing_index = null
    }
    $('#progress_container').hide()
    $('#progress_time').hide()
    $('#progress_bar').css('width', '0%')
    clear_play_list()

})


</script>
